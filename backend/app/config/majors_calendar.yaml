# THE HORIZON CALENDAR — every knowable major event through 2030.
# Queue #223 Item 1. Read by app/tasks/horizon_sentinel.py.
#
# Purpose: a marquee event should never arrive without a page. This file is the
# roadmap. The sentinel walks it every day and escalates as each event nears:
#   T-30  (0 < days_to_start <= 30)  -> candidate     (info)
#   T-14  (0 < days_to_start <= 14)  -> needs-page     (P1) if no live page
#   T-7   (0 < days_to_start <=  7)  -> marquee-escalation (P1; marquee=true)
#   in progress (start <= today <= end) AND no page   -> IN-PROGRESS-WITHOUT-PAGE (P0)
# The sentinel checks "has a page" by resolving concept_key against the live
# event-concept surface (GET /api/event/{concept_key}). marquee:true also drives
# server-side feed pinning (Item 2).
#
# Schema per entry:
#   name            human label
#   slug            url slug (kebab)
#   concept_key     event-concept key the page resolves at (event:<domain>:<slug>),
#                   or null when the surface is a plain event/bracket with no concept
#                   adapter yet (still tracked; page-check is best-effort)
#   domain          adapter domain (golf/tennis/f1/soccer/cycling/awards/election/...)
#   start / end     ISO dates (YYYY-MM-DD). end == start for single-day events.
#   archetype       expected surface shape: winner_field | bracket | single_event |
#                   team_match | card | ceremony
#   marquee         true => must pin atop the feed while in progress
#   date_confidence confirmed | approximate  (approximate = conventional window for a
#                   not-yet-scheduled edition; honest early-warning, refine when set)
#   notes           optional context
#
# NOTE ON DATES: 2026 entries are confirmed from published schedules. Far-future
# annual editions use the sport's conventional window (date_confidence: approximate)
# — good enough for a T-30 early-warning; tighten each as the real date is announced.

