# ============================================================================
# THE COMPETITION REGISTER — the standing competitions the editions above are
# editions OF. UX-P065 (#1744 step 2a, epic #1741).
#
# WHY THIS EXISTS: nothing on disk modelled "an edition of". `entities` has no
# parent link, no concept adapter config carries a parent slug, and the three
# mechanisms that faked one all disagree — awards parse a year suffix off a
# standing slug, cycling aliases hard-pin a standing name to ONE edition, and
# golf uses year-less slugs (:69-71) in a file that also writes `masters-2027`.
#
# ASSIGNED, NEVER INFERRED (standing doctrine, ratified 2026-08-12). A parent is
# read from the `competition:` field on the edition — it is never derived by
# stripping `-2027` off a slug. Inference is what produced three disagreeing
# mechanisms; a wrong assignment is one visible line, a wrong inference is a
# rule that is wrong everywhere at once and nowhere in particular.
#
# Schema per row:
#   slug                   standing url slug (kebab, NO year)
#   name                   human label ("The Masters")
#   domain                 adapter domain, matching the editions'
#   archetype              expected surface shape of an edition
#   aliases                other names a reader might type. Globally unique and
#                          disjoint from every slug (asserted by test).
#   standing_concept_key   the year-less concept key this competition ALREADY
#                          resolves at in production, or null. This field
#                          RECORDS what is true today — it does not repoint
#                          anything. Where it disagrees with an edition's
#                          `concept_key`, that disagreement is the finding
#                          (see the two dated false alarms below).
#
# ⚠️ TWO EDITION KEYS IN THIS FILE DO NOT RESOLVE, MEASURED 2026-08-12:
#   event:golf:masters-2027    -> 404   while event:golf:the-masters   -> 200
#   event:golf:ryder-cup-2027  -> 404   while event:golf:ryder-cup     -> 200
# `horizon_sentinel` decides "has a page" by resolving `concept_key`, so each of
# these is a P1 needs-page alarm scheduled to fire at T-30 (2027-03-09 and
# 2027-08-18) for a page that already exists. Recorded here, deliberately NOT
# repaired in this queue: changing a live concept key is routing, and routing
# needs its own before/after. See #1744.
# ============================================================================

competitions:
  - slug: the-masters
    name: "The Masters"
    domain: golf
    archetype: winner_field
