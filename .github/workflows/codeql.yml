name: "CodeQL"

# Static security analysis (issue #840). Results surface in the repo Security
# tab. Compose pushes additionally qualify exact-source security evidence before
# Integrator may push master; a full test run cannot clear an unknown verdict.
# Master publishes baseline receipts only. Deployment gates remain in ci.yml.
on:
  push:
    branches: ["master", "integrator/compose-**"]
  pull_request:
    # NO `branches:` filter — deliberately, and it is the same named failure
    # `ci.yml` carries (queue 366 item 0). `pull_request: branches: [X]` filters
    # on the PR's BASE, so a stacked PR (base = another feature branch) matches
    # nothing and the workflow never runs. GitHub then shows the PR with no
    # CodeQL check at all — indistinguishable, at a glance, from CodeQL having
    # run and found nothing. A check that could not run must never render as a
    # check that passed. Queue 364's #1949 was retargeted to `master` purely to
    # get CI at all; that workaround is what this line retires.
  schedule:
    - cron: "23 5 * * 1"  # Mondays 05:23 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR/scheduled checkout retains the original depth-one behavior.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Record CodeQL checkout provenance
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/integrator/compose-'))
        env:
          SECURITY_LANGUAGE: ${{ matrix.language }}
        run: python3 .github/scripts/ci-prior-evidence.py --security-record codeql-provenance.json --language "$SECURITY_LANGUAGE"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # PLURAL. `languages:`, not `language:` — #1591.
          #
          # This workflow spent at least two days analysing NOTHING. It passed
          # `language:` (singular), which is not an input this action has, so it
          # was dropped with only a warning:
          #
          #   ##[warning]Unexpected input(s) 'language', valid inputs are
          #     [... 'languages' ...]
          #
          # With no language pinned, init falls back to autodetecting the whole
          # repository:
          #
          #   Autodetected languages: python, javascript, swift, actions
          #   ##[error]Swift analysis is only supported on macOS runner images.
          #
          # `ios/` makes Swift autodetect, Swift needs a macOS runner, and the
          # abort happens in `init` — BEFORE analysis — so it took python and
          # javascript-typescript down with it. Both matrix jobs failed
          # identically because both were doing the same full-repo autodetect;
          # the matrix was decorative until this line was fixed.
          #
          # Nothing caught it because CodeQL is not a required check: eight
          # consecutive red runs, no merge blocked, no alert. A scanner that is
          # red continuously and reported to nobody looks exactly like one with
          # nothing to report — gotcha #53, at the level of the rail.
          #
          # Swift stays unanalysed, deliberately (Alex, 2026-08-08): restoring
          # python + javascript-typescript is the win, and `ios/` would need a
          # separate macOS-runner job. `actions` is likewise not analysed here;
          # it would be an added matrix entry, not a change to this input.
          #
          # Guarded by frontend/e2e/contract/codeqlLanguages.contract.test.js.
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # #10090 (Alex adopted 10/28): the Python leg skips backend/tests/**
          # (paths-ignore in the config). Empty for javascript-typescript, which
          # init treats as unset, so that leg's analysed files are unchanged.
          config-file: ${{ matrix.language == 'python' && './.github/codeql/codeql-config.yml' || '' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql_analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      # #11155: readiness only. Never accepts security evidence or changes the
      # qualifier's inputs/deadline; every outcome returns to that same gate.
      - name: Wait for parent master CodeQL baseline
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integrator/compose-')
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import subprocess
          import time

          CAP_SECONDS = 720
          REQUEST_SECONDS = 20
          POLL_SECONDS = 20
          MAX_RESPONSE_BYTES = 1_000_000

          def wait_for_parent():
              started = time.monotonic()
              deadline = started + CAP_SECONDS

              def finish(reason):
                  elapsed = max(0, time.monotonic() - started)
                  print(f"Parent baseline wait: {reason} after {elapsed:.1f}s; qualifier decides.")

              if os.environ.get("GITHUB_EVENT_NAME") != "push" or not os.environ.get(
                  "GITHUB_REF", ""
              ).startswith("refs/heads/integrator/compose-"):
                  finish("not a compose push")
                  return
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                  finish("invalid repository")
                  return
              with open("codeql-provenance.json", encoding="utf-8") as source:
                  base = json.load(source)["base"]
              if not isinstance(base, str) or not re.fullmatch(r"[0-9a-f]{40}", base):
                  finish("invalid base")
                  return
              repository_id = int(os.environ["GITHUB_REPOSITORY_ID"])
              if repository_id <= 0:
                  finish("invalid repository identity")
                  return

              def read(endpoint):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError()
                  response = subprocess.run(
                      ["gh", "api", f"repos/{repository}/{endpoint}"],
                      check=True, capture_output=True, text=True,
                      timeout=min(REQUEST_SECONDS, remaining),
                  )
                  if time.monotonic() >= deadline:
                      raise TimeoutError()
                  if len(response.stdout.encode("utf-8")) > MAX_RESPONSE_BYTES:
                      raise ValueError()
                  return json.loads(response.stdout)

              def bound_run(run):
                  return (
                      isinstance(run, dict)
                      and type(run.get("id")) is int and run["id"] > 0
                      and type(run.get("run_attempt")) is int and run["run_attempt"] > 0
                      and run.get("path") == ".github/workflows/codeql.yml"
                      and run.get("head_sha") == base
                      and run.get("head_branch") == "master"
                      and run.get("event") == "push"
                      and run.get("repository", {}).get("id") == repository_id
                      and run.get("repository", {}).get("full_name") == repository
                      and run.get("head_repository", {}).get("id") == repository_id
                  )

              listing = read(
                  "actions/workflows/codeql.yml/runs?"
                  f"head_sha={base}&event=push&branch=master&per_page=100"
              )
              rows = listing.get("workflow_runs")
              if (
                  not isinstance(rows, list) or not rows or len(rows) > 100
                  or type(listing.get("total_count")) is not int
                  or listing["total_count"] != len(rows)
                  or not all(bound_run(row) for row in rows)
                  or len({row["id"] for row in rows}) != 1
              ):
                  finish("missing, ambiguous or invalid run listing")
                  return
              run_id = rows[0]["id"]
              while time.monotonic() < deadline:
                  # Same ID may have a new attempt. Read its current status;
                  # neither an old listing nor the other matrix leg is a gate.
                  run = read(f"actions/runs/{run_id}")
                  if not bound_run(run) or run["id"] != run_id:
                      finish("run identity changed")
                      return
                  status = run.get("status")
                  if status == "completed":
                      finish("parent run completed")
                      return
                  if status not in ("queued", "in_progress", "waiting", "pending", "requested") or run.get("conclusion") is not None:
                      finish("unexpected run state")
                      return
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  time.sleep(min(POLL_SECONDS, remaining))
              finish("deadline reached")

          # This step decides no security outcome. Do not expose raw API data,
          # exception text or credentials. The following qualifier still runs.
          try:
              wait_for_parent()
          except (TimeoutError, subprocess.TimeoutExpired):
              print("Parent baseline wait: request/deadline timeout; qualifier decides.")
          except Exception:
              print("Parent baseline wait: unavailable evidence; qualifier decides.")

      - name: Qualify compose security or record master baseline
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/integrator/compose-'))
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_LANGUAGE: ${{ matrix.language }}
          SECURITY_SARIF_ID: ${{ steps.codeql_analysis.outputs.sarif-id }}
        run: >-
          python3 .github/scripts/ci-prior-evidence.py
          --security-qualify codeql-provenance.json
          --sarif-id "$SECURITY_SARIF_ID"
          --security-output codeql-security.json
          --language "$SECURITY_LANGUAGE"

      - name: Publish CodeQL security receipt
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/integrator/compose-'))
        uses: actions/upload-artifact@v4
        with:
          name: codeql-security-${{ github.run_attempt }}-${{ matrix.language }}
          path: codeql-security.json
          if-no-files-found: error
          retention-days: 7
