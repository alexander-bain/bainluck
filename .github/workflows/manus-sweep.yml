name: Manus Sweep

on:
  schedule:
    - cron: "0 6,14,22 * * *"  # Light sweep 3x daily (11pm/7am/3pm PT)
    - cron: "0 10 * * 1"       # Deep sweep weekly Monday 3am PT
  workflow_dispatch:
    inputs:
      mode:
        description: "Sweep mode"
        required: false
        default: "light"
        type: choice
        options:
          - light
          - deep

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    name: Manus health sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Use the default GITHUB_TOKEN (permissions.contents: write below covers
      # the results push). Queue #198 / #1101: this checkout previously pinned
      # `token: secrets.GH_PUSH_TOKEN`, a manually-rotated PAT — when it lapsed
      # (~Jul-11) checkout died at step 2 with "could not read Username for
      # github.com", which SKIPPED the mode step so the failure issue rendered a
      # bare "(  )" empty name with no error, 3x/day. The auto-provisioned
      # GITHUB_TOKEN never expires.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Determine sweep mode
        id: mode
        run: |
          # Manual dispatch uses the input; scheduled uses cron expression
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode || 'light' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * 1" ]; then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
          else
            echo "mode=light" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify MANUS_API_KEY is set
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          if [ -z "$MANUS_API_KEY" ]; then
            echo "::error::MANUS_API_KEY secret is not set. Add it at Settings > Secrets > Actions."
            exit 1
          fi
          echo "MANUS_API_KEY is configured. Mode: ${{ steps.mode.outputs.mode }}"

      - name: Run Manus sweep
        id: sweep
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MANUS_SWEEP_MODE: ${{ steps.mode.outputs.mode }}
        run: python3 backend/scripts/manus_health_suite.py
        timeout-minutes: 45

      - name: Update latest symlink
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -d "Manus/audit_results/$TODAY" ]; then
            ln -sfn "$TODAY" Manus/audit_results/latest
          fi

      - name: Post summary
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MANIFEST="Manus/audit_results/$TODAY/manifest.json"
          if [ -f "$MANIFEST" ]; then
            {
              echo "## Manus Sweep (${{ steps.mode.outputs.mode }}) — $TODAY"
              echo
              python3 -c "
          import json
          m = json.load(open('$MANIFEST'))
          tasks = m.get('tasks', {})
          total = len(tasks)
          done = sum(1 for t in tasks.values() if t.get('status') == 'complete')
          credits = sum(t.get('credits', 0) for t in tasks.values())
          print(f'**{done}/{total} modules completed** ({credits:,} credits)')
          print()
          print('| Module | Status | Credits |')
          print('|--------|--------|---------|')
          for name, t in tasks.items():
              s = t.get('status', '?')
              c = t.get('credits', 0)
              icon = '✅' if s == 'complete' else ('⚠️' if s == 'collection_failed' else '❌')
              print(f'| {name} | {icon} {s} | {c:,} |')
          "
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Intake digest (parse + dedup + file issue)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Parse the latest sweep into deduplicated findings, write
          # new_findings_count into the manifest, and file ONE digest issue
          # (only when new findings exist). Best-effort: never fail the sweep.
          python3 backend/scripts/manus_intake.py || echo "intake step failed (non-fatal)"

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manus-sweep-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: Manus/audit_results/
          retention-days: 90

      - name: Commit results (best-effort)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -d "Manus/audit_results/$TODAY" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "Manus/audit_results/$TODAY/" "Manus/audit_results/latest"
            git commit -m "Manus sweep (${{ steps.mode.outputs.mode }}) $TODAY — automated [skip ci]" || echo "No changes to commit"
            git push || echo "Push failed — results saved as artifact"
          fi

      # Queue #198 / #1101: ONE deduped tracker per failure class, ever. The old
      # step did a blind `gh issue create` every run -> 3 spam issues/day. Now we
      # find the single open tracker (title prefix + marker) and append the new
      # occurrence as a COMMENT; only if none is open do we create it.
      - name: Report failure (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MODE="${{ steps.mode.outputs.mode }}"
          MODE="${MODE:-unknown}"   # empty if an early step (e.g. checkout) died
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MANIFEST="Manus/audit_results/$TODAY/manifest.json"
          MARKER="<!-- manus-sweep-failure-tracker -->"

          # Build the per-occurrence detail block.
          if [ -f "$MANIFEST" ]; then
            DETAIL=$(python3 -c "
          import json
          m = json.load(open('$MANIFEST'))
          tasks = m.get('tasks', {})
          failed = [f'- **{n}**: {t[\"status\"]}' for n, t in tasks.items() if t.get('status') != 'complete']
          if failed:
              print('Failed modules:')
              print('\n'.join(failed))
          else:
              print('All modules completed but the workflow still failed (commit/push issue?).')
          " 2>/dev/null || echo "Could not parse manifest.")
          else
            DETAIL="No manifest written — an early step (checkout / setup / mode) failed before any module ran. Check the run log."
          fi

          OCCURRENCE=$(printf '**New failure occurrence** — %s (mode: \`%s\`)\n\n%s\n\nRun: %s' "$TODAY" "$MODE" "$DETAIL" "$RUN_URL")

          # Find the single OPEN tracker (client-side title-prefix filter — no
          # reliance on search indexing of the HTML marker).
          EXISTING=$(gh issue list --state open --label alert-intake --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title | startswith("Manus sweep failing"))][0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$OCCURRENCE"
            echo "Appended occurrence to existing tracker #$EXISTING"
          else
            gh issue create \
              --title "Manus sweep failing (recurring)" \
              --body "$(printf '%s\nThe Manus health sweep workflow is failing. This is the single deduped tracker for that failure class — each new occurrence is appended as a comment below. Close it once a run goes green; a later failure re-files a fresh tracker.\n\n%s' "$MARKER" "$OCCURRENCE")" \
              --label "area:infra,type:ops,alert-intake"
            echo "Created new tracker (no open one existed)"
          fi
