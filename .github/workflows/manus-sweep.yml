name: Manus Sweep

on:
  schedule:
    - cron: "0 14 */3 * *"  # Every 3 days at 7am PT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    name: Manus 10-module health sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Verify MANUS_API_KEY is set
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          if [ -z "$MANUS_API_KEY" ]; then
            echo "::error::MANUS_API_KEY secret is not set. Add it at Settings > Secrets > Actions."
            exit 1
          fi
          echo "MANUS_API_KEY is configured."

      - name: Run Manus sweep
        id: sweep
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: python3 backend/scripts/manus_health_suite.py
        timeout-minutes: 45

      - name: Update latest symlink
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -d "Manus/audit_results/$TODAY" ]; then
            ln -sfn "$TODAY" Manus/audit_results/latest
          fi

      - name: Post summary
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          REPORT="Manus/audit_results/$TODAY/combined_report.md"
          MANIFEST="Manus/audit_results/$TODAY/manifest.json"
          if [ -f "$MANIFEST" ]; then
            {
              echo "## Manus Sweep — $TODAY"
              echo
              python3 -c "
          import json
          m = json.load(open('$MANIFEST'))
          tasks = m.get('tasks', {})
          total = len(tasks)
          done = sum(1 for t in tasks.values() if t.get('status') == 'complete')
          credits = sum(t.get('credits', 0) for t in tasks.values())
          print(f'**{done}/{total} modules completed** ({credits:,} credits)')
          print()
          print('| Module | Status | Credits |')
          print('|--------|--------|---------|')
          for name, t in tasks.items():
              s = t.get('status', '?')
              c = t.get('credits', 0)
              icon = '✅' if s == 'complete' else ('⚠️' if s == 'collection_failed' else '❌')
              print(f'| {name} | {icon} {s} | {c:,} |')
          "
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$REPORT" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Full report</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            head -200 "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manus-sweep-${{ github.run_id }}
          path: Manus/audit_results/
          retention-days: 90

      - name: Commit results (best-effort)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -d "Manus/audit_results/$TODAY" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "Manus/audit_results/$TODAY/" "Manus/audit_results/latest"
            git commit -m "Manus sweep $TODAY — automated" || echo "No changes to commit"
            git push || echo "Push blocked by branch protection — results saved as artifact"
          fi

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MANIFEST="Manus/audit_results/$TODAY/manifest.json"
          BODY="The Manus health sweep failed on $TODAY."
          if [ -f "$MANIFEST" ]; then
            DETAIL=$(python3 -c "
          import json
          m = json.load(open('$MANIFEST'))
          tasks = m.get('tasks', {})
          failed = [f'- **{n}**: {t[\"status\"]}' for n, t in tasks.items() if t.get('status') != 'complete']
          if failed:
              print('### Failed modules')
              print('\n'.join(failed))
          else:
              print('All modules completed but the workflow still failed (commit/push issue?).')
          " 2>/dev/null || echo "Could not parse manifest.")
            BODY="$BODY

          $DETAIL

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh issue create \
            --title "Manus sweep failed — $TODAY" \
            --body "$BODY" \
            --label "area:infra,type:ops,alert-intake"
