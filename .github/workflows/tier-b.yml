name: Tier-B review policy

# Ruling A: the author window merges every Tier-B PR, including policy edits,
# after green CI, current-head claude[bot] approval and Fable ACCEPT.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, edited]
  # GitHub loads workflow_run YAML from the default branch, not the PR merge ref.
  workflow_run:
    workflows: [Tier-B review]
    types: [completed]
  # Every event uses the evaluator checked out from the default branch below.
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [tier-b-review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request to evaluate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: write
  issues: write

concurrency:
  group: tier-b-review-policy-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pull_number || github.event.inputs.pull_number || 'sweep' }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({...context.repo, name: 'tier-b'});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({...context.repo, name: 'tier-b', color: 'B60205', description: 'Current-head Claude approval; Fable ACCEPT before the author window merges'});
            }
            await require('./tools/release/tier_b.cjs').evaluate(github, context);
