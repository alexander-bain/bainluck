name: Shard hints refresh

# #3497 — the CI shard timings refresh themselves, so the unmeasured count can
# never creep up to the 600-file limit and take master red for every lane.
#
# THE FAILURE THIS CLOSES. `backend/scripts/ci_shard_durations.json` holds the
# measured seconds per test file that `ci_shard.py` balances the eight
# `backend-tests` shards against, and `test_ci_shard.py` fails master once 600
# files have none. Until Nov 16 this workflow proposed a refreshed file as a PR.
# Actions cannot open PRs in this repo (`can_approve_pull_request_reviews:
# false`), and the one PR it kept updating, #6115, had been closed since Sep 14,
# so no refresh ever landed and master went red at 601 on Nov 15. It also read
# the run's log ARCHIVE (after a re-run that holds only the re-run jobs), verified
# with `--of 4` against an 8-shard CI, and failed with "no duration lines found"
# whenever its source run was frontend-only (those shards succeed without
# running pytest).
#
# NOW. Every green master run is checked. When the newest timings leave more
# than 10 test files unmeasured, this records fresh ones from that run's own
# shard logs and uploads them as the artifact `ci-shard-durations`. Every CI run
# applies the newest such artifact before it partitions
# (`scripts/ci_shard_hints_fetch.py`). Nothing is committed and no PR is needed;
# the committed file is only the fallback when no artifact exists.
#
# WHY `workflow_run` AND NOT `schedule:`. The input is a CI run's shard logs, and
# `workflow_run` hands over the run id. This repo's cron fires 19 min to 6 h late
# (#5662: 0 of 98 runs within 5 min of their slot), so a cron would read a run
# from some unrelated older master.
#
# COST. The check is a checkout plus two stdlib reads and exits in seconds. The
# expensive half (per-job logs, `pip install`, pytest's collection census) runs
# only past the 10-file threshold, about once a day at the measured ~60 new test
# files a day. That ordering is asserted by
# `backend/tests/test_shard_hints_refresh_3497.py`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    name: Refresh shard timings from this run's own logs
    runs-on: ubuntu-latest
    # Only a green push to master is a valid source: its logs describe the suite
    # as master has it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    # Master pushes ~31x a day; the older of two in-flight refreshes reads the
    # staler suite, so it yields.
    concurrency:
      group: shard-hints-refresh
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
      # The fetch reads the artifact the triggering CI run itself applied.
      RUN_FOR: ${{ github.event.workflow_run.id || github.run_id }}
      HOLD_AT_OR_BELOW: "10"

    steps:
      - uses: actions/checkout@v6
        with:
          # The census below counts test FILES, so it must be the tree whose logs
          # are read, not a master that has moved on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------- HOLD
      - name: Is a refresh due at all?
        id: staleness
        # Stdlib only, before any install. Never piped (gotcha #54).
        run: |
          set -uo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"
          python3 scripts/ci_shard_hints_fetch.py
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::fetching the newest shard timings exited $RC"
            exit 1
          fi
          python3 scripts/ci_shard.py --staleness > $TMP/staleness.json
          RC=$?
          cat $TMP/staleness.json
          if [ "$RC" -ne 0 ]; then
            echo "::error::--staleness exited $RC, which is a story about the harness, not a verdict."
            exit 1
          fi
          UNMEASURED="$(python3 -c "import json;print(json.load(open('$TMP/staleness.json'))['unmeasured'])")"
          echo "unmeasured=$UNMEASURED" >> "$GITHUB_OUTPUT"
          if [ "$UNMEASURED" -le "$HOLD_AT_OR_BELOW" ]; then
            echo "HOLD — $UNMEASURED unmeasured files (refresh above $HOLD_AT_OR_BELOW)."
          else
            echo "due=1" >> "$GITHUB_OUTPUT"
            echo "REFRESH — $UNMEASURED unmeasured files."
          fi

      # ------------------------------------------------------------- REFRESH
      - name: Fetch each shard's log from the run that triggered this
        id: logs
        if: steps.staleness.outputs.due
        # One log per backend-tests job of the LATEST attempt, never the run
        # archive (after a re-run it holds only the re-run jobs). Exit 3 means the
        # shards ran no tests (frontend-only or reused evidence): nothing to record.
        run: |
          set -uo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"
          python3 scripts/ci_shard_hints_fetch.py job-logs $TMP/shards.log
          RC=$?
          if [ "$RC" -eq 3 ]; then
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::job-logs exited $RC; refusing to record."
            exit 1
          fi
          echo "have=1" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < $TMP/shards.log | tr -d ' ') log lines"

      - name: Install dependencies
        if: steps.logs.outputs.have
        run: pip install -r requirements.txt

      - name: Record
        if: steps.logs.outputs.have
        # `--require-census` because this write is unattended: without pytest's
        # collection census, files whose tests all fall under the 0.005s print
        # threshold record at ~0s and get packed as free.
        run: |
          set -uo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"
          python3 scripts/ci_shard.py --record $TMP/shards.log --require-census
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::--record exited $RC; nothing will be uploaded."
            exit 1
          fi

      - name: The refreshed timings must be better than the ones they replace
        if: steps.logs.outputs.have
        # "It returned" is not "it worked" (gotcha #53).
        run: |
          set -uo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"
          BEFORE="${{ steps.staleness.outputs.unmeasured }}"
          python3 scripts/ci_shard.py --staleness > $TMP/staleness-after.json
          cat $TMP/staleness-after.json
          AFTER="$(python3 -c "import json;print(json.load(open('$TMP/staleness-after.json'))['unmeasured'])")"
          echo "unmeasured: $BEFORE -> $AFTER"
          if [ "$AFTER" -ge "$BEFORE" ]; then
            echo "::error::the refresh did not reduce the unmeasured count ($BEFORE -> $AFTER); not uploading."
            exit 1
          fi
          python3 scripts/ci_shard.py --verify --of 8

      - name: Upload the timings every CI run applies
        if: steps.logs.outputs.have
        uses: actions/upload-artifact@v4
        with:
          name: ci-shard-durations
          path: backend/scripts/ci_shard_durations.json
          if-no-files-found: error
          retention-days: 30

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### Shard timings refresh"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source run | \`$SOURCE_RUN_ID\` |"
            echo "| unmeasured before | \`${{ steps.staleness.outputs.unmeasured }}\` |"
            echo "| refresh due | \`${{ steps.staleness.outputs.due && 'yes' || 'no — HOLD' }}\` |"
            echo "| recorded and uploaded | \`${{ steps.logs.outputs.have && 'yes' || 'no' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
