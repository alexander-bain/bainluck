name: The Factory

on:
  workflow_run:
    workflows:
      [CI, Claude Code, Tier-B review, Tier-B review policy, TestFlight release]
    types: [requested, completed]
  push:
    branches: [master]
  issue_comment:
    types: [created, edited, deleted]
  status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-public-snapshot
  cancel-in-progress: false

jobs:
  preflight:
    name: Check factory freshness
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'status' ||
       ((github.event.context == 'Vercel' || github.event.context == 'Bain Luck | TestFlight from master') &&
        (github.event.state == 'success' || github.event.state == 'failure' || github.event.state == 'error'))) &&
      (github.event_name != 'issue_comment' || github.event.issue.number == 12779 || startsWith(github.event.comment.body, '**Fable'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      refresh: ${{ steps.gate.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: scripts/factory
          persist-credentials: false
      - name: Skip recent snapshots unless a change opened or left the floor
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/factory/preflight.cjs

  snapshot:
    name: Publish the factory from master
    needs: preflight
    if: needs.preflight.outputs.refresh == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: scripts/factory
          persist-credentials: false
      - name: Read master ancestry without historical file contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper= -c credential.helper='!gh auth git-credential' fetch --filter=blob:none --no-tags --unshallow origin master
      - name: Reconcile and publish the snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/factory/collect.py --output /tmp/factory.json --publish
