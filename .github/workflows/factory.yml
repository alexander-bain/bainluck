name: The Factory

on:
  push:
    branches: [master]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      measure_picture:
        description: Measure one picture for the meter
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  actions: read

concurrency:
  group: factory-public-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Read and update the factory from master
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: |
            /scripts/factory/
            /backend/app/services/llm_models.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read master ancestry without historical file contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper= -c credential.helper='!gh auth git-credential' fetch --filter=blob:none --no-tags --unshallow origin master
      - name: Collect, compare and publish a changed floor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL_FACTORY_NOTES: gpt-6-luna
          LLM_MODEL_FACTORY_PICTURE: gpt-image-2.6-flare
          FACTORY_MEASURE_PICTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_picture }}
        run: python3 scripts/factory/collect.py --output /tmp/factory.json --publish
      - name: Keep the measured picture for the receipt
        if: github.event_name == 'workflow_dispatch' && inputs.measure_picture
        uses: actions/upload-artifact@v4
        with:
          name: factory-measured-picture
          path: /tmp/factory-measured-picture.webp
          if-no-files-found: error
          retention-days: 7
