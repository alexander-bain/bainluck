name: Heavy app sync

# #5470 — keep `bainluck-heavy` on the code the main app is actually serving.
#
# THE FAILURE. Since the heavy split (9/11 ~1pm PT) the main site deploys itself
# and the heavy app does not. It sat 84 commits behind at 12:48am Sat, and 158
# commits / 42 `backend/app` files behind again seven hours after Alex's manual
# redeploy. Every background-job fix merged in between is "live" on the website
# and NOT running — #5505 passed review, merged, and changed nothing, with 109
# published Polymarket legs waiting on a worker that never got the code.
# `/health`, `heroku releases -a bainluck` and a LOOK at the page are all blind
# to it; the LOOK is the most misleading, because the page renders a number the
# shipped gate would have changed.
#
# WHY THIS IS A SEPARATE, SCHEDULED WORKFLOW and not a line in ci.yml's `deploy`
# job — the mechanism notice 48 names in its parenthetical:
#
#   * a heavy release cycles `worker-heavy.1`, and a dyno cycle kills whatever it
#     is mid-way through. That is the exact failure ship 2 ended by moving the
#     worker into its own app. There were 31 backend deploys in 24h (measured
#     2026-09-12), so per-release hands ship 2 back 31 times a day for code that
#     mostly does not change what heavy runs;
#   * this file cannot wedge the main deploy path. A bug in the block below
#     reddens a scheduled job; a bug in `deploy` stops the site shipping.
#
# The full derivation — including why a clock-picked window is not a guess here,
# and the measurement that makes a cycle cheap (one unit, not a pass) — is in
# `scripts/heavy_sync_decision.py`. The decision lives in that script rather than
# inline for the reason `heroku-release-required.sh` states about itself: an
# inline heredoc in a workflow is unreachable by every gate we own, which is how
# a deploy-path decision rots unnoticed. It is executed by
# `backend/tests/test_heavy_sync_decision_5470.py`.

on:
  # THE PRIMARY TRIGGER IS THE EVENT THAT CREATES THE DRIFT. Heavy falls behind
  # when the MAIN app deploys and it does not; so the main app deploying is the
  # only signal whose rate is guaranteed to track the rate of the problem. A
  # clock cannot, and measurably did not — see the script header's 4-runs-in-17-
  # slots reading, taken while heavy sat 7h33m behind with four launch ships dark.
  #
  # This cannot wedge the main deploy path, which is the property the whole file
  # is built around: `workflow_run` observes CI from OUTSIDE, in its own run. A
  # bug here reddens this job; `deploy` never learns it exists. (A line inside
  # ci.yml's deploy job would have neither property.)
  #
  # `branches: [master]` filters on the TRIGGERING run's head branch, so the ~10x
  # more numerous PR runs never reach here. `completed` is the only type offered,
  # so the conclusion is filtered on the job below.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # THE BACKSTOP, for the one case the event above cannot cover: a run that HELD
  # (outside the band, or under the cycle floor) when no further deploy arrives to
  # re-offer the sync. Kept hourly rather than removed — the two triggers are
  # gated by the same `decide`, so a redundant attempt costs two `ls-remote`s.
  schedule:
    # HOURLY, AND THE MINUTE IS DECORATIVE. #5662, measured 2026-09-12 over all
    # 100 `event=schedule` runs in this repo (2026-09-02..09-12, four workflows
    # whose crons each name a FIXED minute — :00, :17, :30, :40):
    #
    #   * fired within 5 min of their slot:            0 / 98
    #   * delay min / median / max:            19m / 239m / 359m
    #   * `created_at` == `run_started_at`, so the lateness is the SCHEDULER
    #     itself, not a runner queue we could wait out.
    #
    # This file's first version read "GitHub's scheduler is routinely MINUTES
    # late and is never trusted as the window" — wrong by two orders of
    # magnitude. A 19-359 min delay randomises the fire minute: those four fixed
    # crons land across all six 10-minute buckets (14/15/26/18/17/10), so the
    # `42` below has no bearing on when the job actually reads the clock. Two
    # estimators agree on the cost: applying the observed delays to a :42 base
    # puts 35/98 (36%) inside the band, and the observed fire minutes themselves
    # 38/100 (38%).
    #
    # The band stays — it is derived, not picked (`window_bounds()`), and HOLDing
    # outside it is right. What changes is the TRIGGER, because at ~40% in-band a
    # 3-hourly cron is 8 attempts/day => ~8.3h expected wait, against a design
    # that claimed to bound drift to ~3h. The number of ATTEMPTS is the only
    # lever we hold on the fire minute, and attempts are nearly free: `decide`
    # returns HOLD on `main_live == heavy_live` BEFORE it consults the clock, so
    # a run against an already-synced app costs two `ls-remote`s and never
    # deploys. Hourly => 24 attempts/day, ~2.5h expected wait, P(no sync in 12h)
    # ~0.2%.
    #
    # THE TAIL PROVED LONG, FOR A REASON THAT PARAGRAPH DID NOT MODEL
    # (latency/362, measured 2026-09-13 04:44Z). "Hourly => 24 attempts/day"
    # counts SLOTS, not RUNS. Since this file landed on master (12:10Z Sat) there
    # have been 16 nominal hourly slots and **4 delivered runs** — all four
    # `event=schedule`, none dispatched. Whether the missing twelve were dropped
    # or are still in flight is undecidable at this horizon (the measured delay
    # reaches 359m) and it does not change the answer: the attempt rate this
    # design assumed is 24/day, the attempt rate it is GETTING is ~6/day.
    # Observed rather than modelled — heavy sat on v12 `a1ba6f34` from 21:38:09Z
    # to at least 04:44Z: **7h06m, 81 commits and 16 `backend/app` files behind**
    # the main app's live `731f98cf`, with merged launch fixes among them waiting
    # on a worker that never got the code. That is this issue, again, wearing a
    # green schedule.
    #
    # THE RAISE TO `34,42,50` IS WITHDRAWN, AND THE MINUTE BELOW IS THE ONLY
    # AUTHORISED ONE (Codex, 2026-09-13 07:44Z, executed by latency/368). The
    # paragraphs above measure a real problem and are kept because they are
    # true; what they do NOT carry is an authorisation. "Pre-authorised" was the
    # lane reading its own earlier rationale back as approval — the cadence that
    # reached master was never granted, and a config delta does not become
    # approved by being merged. Deliberately recorded rather than quietly
    # reverted, so the next reader does not re-derive the raise from the same
    # arithmetic and land in the same place.
    #
    # What carries the ship instead is the `workflow_run` trigger above, which is
    # the reviewed mechanism and is untouched here: it fires on the deploy that
    # CREATES the drift, so the opportunity rate tracks the deploy rate rather
    # than a scheduler this repo has measured at 0/98 punctual. The cron is the
    # backstop for the one case the event cannot cover — a run that HELD while no
    # further deploy arrives to re-offer it — and one hourly attempt is what it
    # is licensed to be.
    #
    # Anyone considering N>1 again: the arithmetic is above, it is not the
    # blocker, and the answer is Alex's. Raise the number only with his word, and
    # re-measure the 4-of-16 delivery rate first — it is the only soft number
    # here and the wait is more sensitive to it than to N. Do not narrow the band.
    - cron: '42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync bainluck-heavy to the main app's live commit
    runs-on: ubuntu-latest
    # A CEILING, NOT A BUDGET, and it exists because this job now SLEEPS. Its
    # three bounded parts: the wait to the band's opening edge, at most one hour
    # minus the band's own width (39 min at today's :38-:58); the in-flight wait,
    # which cannot outlive the band (21 min); and the push plus the release
    # readback (10 polls, 6 s apart) on top of checkout. ~70 min of real ceiling,
    # so 75 leaves margin without letting a wedged run hold `heavy-deploy` for
    # GitHub's default six hours — the concurrency group is the thing being
    # protected here (`test_the_job_timeout_covers_the_longest_run_the_band_permits`).
    timeout-minutes: 75
    # A CI run that did not succeed deployed nothing, so there is no new drift to
    # clear — and `workflow_run` offers `completed` as its only type. Written as
    # `!= 'workflow_run' || ...` so the schedule and the attended dispatch are
    # never accidentally gated by a field their events do not carry. No secret is
    # read here, which is the whole of gotcha #9's rule about step-level `if`.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # NOT `heroku-deploy`. That group is held by ci.yml's deploy job with
    # `cancel-in-progress: false`, under which a newly queued job cancels the
    # previously PENDING one — so joining it would let 31 main deploys a day
    # starve this sync of its slot, silently, which is the drift again.
    # Different apps, different git refs: the two pushes cannot conflict.
    concurrency:
      group: heavy-deploy
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      # #5886's in-flight gate reads `/api/admin/celery/inspect`. An absent
      # secret is a benign UNKNOWN, never a failure — gotcha #9 keeps the check
      # inside the run block, and the gate's own polarity does the rest.
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      DISPATCHED: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Ancestry needs both live commits as real objects, not refs.
          fetch-depth: 0

      - name: Sync heavy (never-backwards guarded, window-gated)
        run: |
          set -uo pipefail

          # Gotcha #9: the secret is checked inside the run block, never in a
          # step-level `if`.
          if [ -z "${HEROKU_API_KEY:-}" ]; then
            echo "HEROKU_API_KEY is not set — neither app can be read."
            echo "Failing rather than skipping: a silent skip is the exact shape"
            echo "of the drift this job exists to end (gotcha #53)."
            exit 1
          fi

          git remote add heroku-main \
            "https://heroku:$HEROKU_API_KEY@git.heroku.com/bainluck.git" 2>/dev/null || true
          git remote add heroku-heavy \
            "https://heroku:$HEROKU_API_KEY@git.heroku.com/bainluck-heavy.git" 2>/dev/null || true

          # EVERY FACT IS READ TOGETHER, IN A FUNCTION, BECAUSE THEY ARE READ
          # TWICE. A run that sleeps to reach the band (below) has to judge the
          # world it wakes up in and not the one it went to sleep in: main can
          # deploy again while it waits, and the sha this job pushes must be the
          # one main is serving at the moment of the push. Re-reading them as a
          # set is the point — two facts from two different minutes is how a
          # never-backwards guard gets asked about an ancestry that has moved.
          read_facts() {
            # THE MAIN APP'S LIVE COMMIT IS THE TARGET, NOT origin/master. Heavy's
            # release phase skips `alembic upgrade heads` (Procfile, HEAVY_APP=1)
            # but still runs `assert_migrations_applied.py`, so heavy must never be
            # ahead of the migrations the PRIMARY app has applied. Tracking main's
            # live ref makes that structural: the sha has already passed CI and
            # already released on main, migrations and all.
            MAIN_LIVE="$(git ls-remote heroku-main refs/heads/master 2>/dev/null | cut -f1)"
            HEAVY_LIVE="$(git ls-remote heroku-heavy refs/heads/master 2>/dev/null | cut -f1)"
            echo "main  live: ${MAIN_LIVE:-<unreadable>}"
            echo "heavy live: ${HEAVY_LIVE:-<unreadable>}"

            git fetch --quiet heroku-main refs/heads/master 2>/dev/null || true
            git fetch --quiet heroku-heavy refs/heads/master 2>/dev/null || true

            # Ask whether we HOLD each object before asking about ancestry.
            # `merge-base --is-ancestor` on a commit we never fetched exits
            # non-zero, which reads identically to a truthful "no" — the
            # distinction ci.yml's deploy guard draws with its own `HAVE_LIVE`.
            ANCESTOR=unknown
            if [ -n "$MAIN_LIVE" ] && [ -n "$HEAVY_LIVE" ] \
               && git cat-file -e "${MAIN_LIVE}^{commit}" 2>/dev/null \
               && git cat-file -e "${HEAVY_LIVE}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$HEAVY_LIVE" "$MAIN_LIVE"; then
                ANCESTOR=true
              else
                ANCESTOR=false
              fi
            fi
            echo "heavy-is-ancestor: $ANCESTOR"

            # How long since heavy was last DISTURBED, for the cycle floor. `age`
            # always exits 0 and prints the number alone, so an unreadable answer
            # arrives here as the empty string and `decide` proceeds on it: this is
            # a cost gate, and a cost gate that cannot read its fact must not be
            # able to fail a job — the opposite polarity to the guards above it.
            HEAVY_AGE_MIN="$(python3 scripts/heavy_sync_decision.py age --app bainluck-heavy)"
            echo "heavy release age: ${HEAVY_AGE_MIN:-<unreadable>} min"
          }

          read_facts

          DISPATCH_FLAG=""
          if [ -n "${DISPATCHED:-}" ]; then
            DISPATCH_FLAG="--dispatched"
          fi

          # OUTSIDE THE BAND IS "NOT YET", NOT "NOT TODAY" — the sentence the
          # in-flight loop below already lives by, applied to the other clock.
          #
          # THE SIZE OF THE PRIZE IS MEASURED, and it is not the one this change
          # was asked for. "The deploy trigger is phase-locked against the band"
          # (lane1/324, four consecutive runs) does not survive the population:
          # 34 of 73 `workflow_run` fires landed in band, 47%, over every run
          # this workflow has had. What IS real is heavy's own release record —
          # v15..v20, 3h47 / 3h06 / 4h01 / 4h06 / 3h47, MEAN 3h45 against a 3h00
          # floor. The 45-minute residual is the wait for a trigger to arrive
          # while the band is open once the floor has cleared, and one arrives
          # every ~22 min at 47%: 45 min of expected wait, which is the reading.
          # The tail is worse and is the part that hurt — when deploys stop, the
          # only trigger is a cron measured 19-359 min late that landed in band
          # 2 of 11 times, which is the 7h06m and 7h33m episodes in the header.
          #
          # THE TARGET IS THE LATER OF TWO EDGES, and the second one is where
          # that 45-minute residual actually lives. A push may only happen
          # between the band's edges and the floor is a whole number of hours,
          # so the floor always clears INSIDE the band, at the same minute past
          # the hour as the release that started it (heavy v17..v20: :49, :50,
          # :56, :43). Sleeping only to the opening edge therefore does nothing
          # at all in the one hour that matters: at 14:07:15Z today, with v20's
          # floor clearing at 14:43:49Z, the opening edge is :38, the projected
          # age there is 174 min, and the run HOLDs six minutes short of a
          # window it could have slept into. Waiting to the LATER of the two
          # takes that hour; the deadline for any wait is the band's own closing
          # edge, so a floor clearing 2h50m out is refused rather than bought.
          #
          # Sleeping to an edge takes NOTHING away. The alternative was
          # never "push at :10" — it was "push at nothing" — and every gate is
          # re-asked for real after the sleep, against facts re-read then. The
          # script answers only "would this run push when the band opens",
          # because that question is `decide`'s and is asked OF `decide`.
          #
          # A sleeper wakes at :38:00 on the nose, which is the minute
          # `refresh_linked_polymarket_books` fires on — deliberately not
          # dodged with an offset. That is the in-flight gate's question, its
          # ring is 4.9-10.6s measured, and a second clock constant to avoid
          # one beat would be exactly the second answer this file keeps
          # refusing to write.
          #
          # It is affordable for reasons that are checkable rather than vibes:
          # this repository is PUBLIC, where GitHub-hosted standard runners are
          # free (so this is not a spend call), and the `heavy-deploy` group
          # cancels a PENDING duplicate rather than the running sleeper — a
          # burst of deploys collapses into the one run already waiting, which
          # reads their newest sha when it wakes. `timeout-minutes` on the job
          # is the ceiling on the whole of it.
          WAIT_S="$(python3 scripts/heavy_sync_decision.py wait-plan \
            --main-live "${MAIN_LIVE:-}" \
            --heavy-live "${HEAVY_LIVE:-}" \
            --heavy-is-ancestor "$ANCESTOR" \
            --heavy-release-age-min "${HEAVY_AGE_MIN:-}" \
            $DISPATCH_FLAG)"
          # A wait that did not parse is not a licence to sleep (gotcha #54: the
          # VALUE, not the exit code) — anything but digits becomes 0, and 0 is
          # the run this file has always been.
          case "${WAIT_S}" in ''|*[!0-9]*) WAIT_S=0 ;; esac
          if [ "$WAIT_S" -gt 0 ]; then
            echo "Sleeping ${WAIT_S}s to reach the band, then re-reading every fact."
            sleep "$WAIT_S"
            read_facts
          fi

          # Never piped, and the VALUE of the code is what is read (gotcha #54).
          set +e
          python3 scripts/heavy_sync_decision.py decide \
            --main-live "${MAIN_LIVE:-}" \
            --heavy-live "${HEAVY_LIVE:-}" \
            --heavy-is-ancestor "$ANCESTOR" \
            --heavy-release-age-min "${HEAVY_AGE_MIN:-}" \
            $DISPATCH_FLAG
          DECISION=$?
          set -e

          # The push is gated on the verdict, not merely reported beside it.
          case "$DECISION" in
            0) echo "Decision: PUSH." ;;
            1) echo "Decision: HOLD — nothing to do this run, exiting green."
               exit 0 ;;
            2) echo "Decision: REFUSE — somebody should look. Failing loudly."
               exit 1 ;;
            *) echo "Decision script exited $DECISION (usage/crash), which is a"
               echo "story about the harness, not a verdict — refusing."
               exit 1 ;;
          esac

          # #5886 — THE CLOCK IS NOT THE LAST WORD, BECAUSE THE BAND IS DERIVED
          # AGAINST ONE OF WORKER-HEAVY'S THREE SCHEDULED RESIDENTS.
          #
          # The first unattended convergence (09:53:58Z) cleared the accuracy
          # rebuild by 19m44s — the band worked — and cycled
          # `prediction_market_match` 3m58s in and `rebuild_typeahead_index` 58s
          # in. Both are scheduled INSIDE the band by construction (the matcher
          # fires :05/:20/:35/:50 and runs 154-552s, so it holds 19 of the band's
          # 25 minutes), and no 25-minute window clears all three. So instead of
          # predicting the worker, ask it: `/api/admin/celery/inspect` already
          # broadcasts the active set, and the script names the heavy fleet in
          # it from the app's own source.
          #
          # THAT NAMING IS NOT `HEAVY_TASKS` ALONE, AND READING IT AS SUCH LEFT
          # THREE JOBS INVISIBLE (#5886's second residual). A beat entry that
          # carries `options={"queue": "heavy"}` runs on worker-heavy whether or
          # not its task is a member, because `apply_async(queue=…)` overrules
          # `task_routes` — and three do, one of them
          # `refresh_linked_polymarket_books` at **:38, the first minute of this
          # band**, whose whole job is to give a linked market a price. So the
          # script unions the declared set with the beats authored onto the
          # queue (`heavy_queue_beat_tasks`). It costs at most one poll: that
          # task's measured ring is 4.9-10.6s.
          #
          # THE READ IS DONE HERE RATHER THAN IN THE SCRIPT for one reason: this
          # is OUR host, so it must carry `x-bainluck-origin` (notice 39), and
          # the script cannot import the carrier — it runs on a bare runner
          # before any `pip install`, which is the exemption the outbound-tag
          # guard grants it for its Heroku reads. `curl -H` tags it with no
          # import. A failed read writes nothing usable and the gate reads that
          # as UNKNOWN, which PROCEEDS: this is a cost gate, and a cost gate that
          # cannot read its fact must never be able to stop the sync.
          INSPECT_JSON="${RUNNER_TEMP:-/tmp}/heavy-inspect.json"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "ADMIN_TOKEN is not set — the in-flight gate will read UNKNOWN."
          fi

          # BUSY IS "NOT YET", NOT "NOT TODAY" — THE READ IS REPEATED UNTIL THE
          # BAND CLOSES. One read of a busy worker used to end the run, and the
          # three gates compose into a convergence rate that reading measured as
          # ~zero: heavy sat 299 min / 75 commits behind at 14:53Z Sunday with
          # five `backend/app/tasks` files dark, and in those five hours exactly
          # ONE trigger cleared both the band and the cycle floor — 14:46:23Z,
          # run 34763629805 — which read `poll_kalshi_markets` and held. Sampled
          # on the minute after it (latency/377, /api/admin/celery/inspect every
          # ~50 s): BUSY at :54, :55, :56, :57 and **IDLE at :58:02**, still
          # inside the band. The opportunity was there; nothing looked again.
          #
          # This is strictly more chances at the SAME verdict, never a weaker
          # one: every state it pushes in is a state the single read would also
          # have pushed in. It cannot reach past the band, because the deadline
          # IS the band (`band-seconds-left`) — the same edge `decide` gates on,
          # asked again rather than restated. So the accuracy rebuild keeps
          # every protection it had, and `--dispatched` is unaffected (the
          # in-flight verdict is BYPASSED, so the loop breaks on its first read).
          #
          # AND ONE IDLE READING IS NOT AN IDLE FLEET (#5886). The reply is a
          # snapshot of unknown age — 5 s of endpoint cache, a 25.6 s measured
          # broadcast, two retries — so v15 printed IDLE at 16:57:10Z while
          # `matching_reconciliation` had been running since 16:56:59.9Z, and
          # pushed. That job was short enough to survive (success 16:57:26, the
          # release 16:57:47); the `:50` matcher at 154-552 s would not have.
          # Two consecutive idle readings cannot both miss a job that outlives
          # their SEPARATION — the ~25.6 s read plus the 30 s sleep, ~56 s, not
          # the poll on its own — so the push waits for `IDLE_CONFIRMATIONS` of
          # them; the residual set is unchanged at that width and both numbers
          # are derived on the constants themselves (latency/381). The
          # confirm can only WAIT, never refuse: at the band's edge it falls
          # back to the single read the gate used before, so it cannot cost a
          # cycle — only the band can, exactly as before.
          IDLE_STREAK=0
          while true; do
            # Removed FIRST: with `--fail` curl writes no body, so a failed read
            # would otherwise leave the PREVIOUS iteration's payload in place and
            # the gate would judge a stale fleet. Absent is the honest state, and
            # the gate already reads absent as UNKNOWN.
            rm -f "$INSPECT_JSON"
            # `--retry`, because ONE READ IS NOT A READING of this endpoint:
            # measured 2026-09-13 11:02-11:03Z, two of eight calls returned HTTP
            # 500 (the inspect broadcast raises and the route does not catch it).
            # An UNKNOWN is safe — it proceeds — but an instrument that is inert a
            # quarter of the time is a veto that reads as one and is not.
            curl -fsS --max-time 45 --retry 2 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer ${ADMIN_TOKEN:-}" \
              -H "X-BainLuck-Origin: heavy-sync-workflow" \
              "https://api.bainluck.com/api/admin/celery/inspect" \
              -o "$INSPECT_JSON" \
              || echo "the inspect read failed; the gate treats that as UNKNOWN."

            # Stdout is CAPTURED and re-echoed because the confirm turns on the
            # VERDICT and not on the exit code. `IDLE` and `UNKNOWN` share code
            # 0 by design — both proceed — but they are opposite facts, and
            # only one of them is worth a second look. Stderr is left alone so
            # a real error still reaches the log in place.
            set +e
            INFLIGHT_OUT="$(python3 scripts/heavy_sync_decision.py inflight \
              --inspect-json "$INSPECT_JSON" \
              $DISPATCH_FLAG)"
            INFLIGHT=$?
            set -e
            printf '%s\n' "$INFLIGHT_OUT"
            INFLIGHT_VERDICT="${INFLIGHT_OUT%%:*}"

            # BUSY resets the streak; an unconfirmed IDLE waits. EVERYTHING
            # else breaks at once, and each for its own reason:
            #   UNKNOWN  — the instrument failed. A second broken reading is
            #              still broken, so confirming it spends band and buys
            #              nothing; the cost gate proceeds, as it always has.
            #   BYPASSED — `--dispatched`, which ignores this veto entirely.
            #              Confirming a reading nobody consults would make the
            #              attended run slower than the unattended one.
            #   exit >1  — a harness story, not a verdict (gotcha #54). Waiting
            #              on it is waiting for one nobody is computing.
            if [ "$INFLIGHT" -eq 1 ]; then
              IDLE_STREAK=0
            elif [ "$INFLIGHT" -eq 0 ] && [ "$INFLIGHT_VERDICT" = "IDLE" ]; then
              IDLE_STREAK=$((IDLE_STREAK + 1))
              # A full `if`, not `[ ... ] && break`: that list returns 1 on the
              # not-yet-confirmed pass, and a shell run under `set -e` reading
              # that as a failure is the kind of harness story gotcha #54 is
              # about. Nothing here is allowed to end the run.
              if [ "$IDLE_STREAK" -ge 2 ]; then break; fi
            else
              break
            fi

            BAND_LEFT="$(python3 scripts/heavy_sync_decision.py band-seconds-left)"
            # A deadline that did not parse is not a licence to keep waiting:
            # anything but digits becomes 0 and the loop stops. `[` would exit 2
            # on `-le` against a non-number, which an `if` reads as "false" —
            # i.e. as permission to sleep again (gotcha #54: read the value).
            case "${BAND_LEFT}" in ''|*[!0-9]*) BAND_LEFT=0 ;; esac
            # 56 = `CONFIRM_SEPARATION_SECONDS`, and it is A WHOLE TURN OF THIS
            # LOOP, not the sleep. This literal read `30` — the sleep alone —
            # until #6283, and the difference cost a cycle in production: run
            # 117 on 2026-09-15 read IDLE at 00:58:23Z with 36 s of band left,
            # took the confirm branch because 36 > 30, and the turn took 55.7 s,
            # so the band shut mid-read and the step exited `HOLD — the band
            # closed`. Heavy sat another 60 min on `c1b52e9c3` while the main
            # app served `f880e45da`. Any remainder the loop can SPEND but not
            # FINISH inside is a remainder it must not spend, because the
            # fallback here — pushing on one idle read — is the gate this job
            # shipped with and is the cheaper of the two by an hour.
            if [ "$BAND_LEFT" -le 56 ]; then
              if [ "$INFLIGHT" -eq 0 ]; then
                # An unconfirmed IDLE at the edge pushes. This is the reading
                # the gate used before the confirm existed, so the confirm has
                # taken nothing away — it only ever spends band it has.
                echo "The band closes in ${BAND_LEFT}s — pushing on one idle read"
                echo "rather than losing the cycle to a confirmation."
              else
                echo "The band closes in ${BAND_LEFT}s — holding rather than pushing"
                echo "past the edge that keeps the next accuracy rebuild whole."
              fi
              break
            fi
            if [ "$INFLIGHT" -eq 0 ]; then
              echo "Idle once; a snapshot cannot see a job that started inside it."
              echo "Confirming in 30s (${BAND_LEFT}s of band left)."
            else
              echo "Waiting 30s for worker-heavy to finish (${BAND_LEFT}s of band left)."
            fi
            sleep 30
          done

          case "$INFLIGHT" in
            0) echo "In flight: clear to cycle worker-heavy." ;;
            1) echo "Decision: HOLD — a heavy job is mid-run, exiting green."
               exit 0 ;;
            *) echo "::warning::the in-flight gate exited $INFLIGHT, which is a"
               echo "::warning::story about the harness and not a verdict. Proceeding:"
               echo "::warning::a cost gate must not be able to stop the sync."
               ;;
          esac

          # THE LAST WORD IS THE CLOCK, NOT THE VERDICT THAT WAS TRUE WHEN THE
          # RUN STARTED. `decide` read the band before the fleet was read, and
          # that read is not instant: one call to /api/admin/celery/inspect
          # measured 25.6 s (2026-09-13 21:38-21:43Z, eight reads, five 5 s
          # broadcasts per call), and it is retried twice, so a
          # single attempt is bounded at 45 s and the step at ~141 s. Waiting for
          # an idle worker widens the same gap deliberately. Either way the band
          # can close between the decision and the push, and a push outside the
          # band is precisely what the band exists to stop.
          #
          # So it is asked once more, here, where the answer still changes
          # something. Unlike the gates above this is a SAFETY check, and it has
          # a safety gate's polarity: a deadline that does not parse becomes 0
          # and HOLDS. `--dispatched` is exempt, because it is exempt from the
          # band itself — an attended run overrules the clock and never the
          # never-backwards guard.
          if [ -z "$DISPATCH_FLAG" ]; then
            BAND_LEFT="$(python3 scripts/heavy_sync_decision.py band-seconds-left)"
            case "${BAND_LEFT}" in ''|*[!0-9]*) BAND_LEFT=0 ;; esac
            if [ "$BAND_LEFT" -eq 0 ]; then
              echo "Decision: HOLD — the band closed while the fleet was being read."
              echo "The next trigger re-reads both live refs and re-judges."
              exit 0
            fi
          fi

          BEHIND="$(git rev-list --count "${HEAVY_LIVE}..${MAIN_LIVE}" 2>/dev/null || echo '?')"
          echo "Pushing $MAIN_LIVE to bainluck-heavy ($BEHIND commits behind)."

          # No --force, ever. A rejection can perfectly well mean something newer
          # is already live on heavy, and forcing then rewinds it. Let git refuse
          # the non-fast-forward and let the next run re-read and re-judge.
          if ! git push heroku-heavy "$MAIN_LIVE:refs/heads/master"; then
            echo "Push rejected. NOT retrying with --force: the next scheduled run"
            echo "re-reads both live refs and re-judges from scratch."
            exit 1
          fi

          # #5722 — ASK THE RELEASE RECORD, NOT THE GIT REF.
          #
          # This was `git ls-remote heroku-heavy` run immediately after the push,
          # and on the first ever sync (run 34714692872, 19:37Z) it returned the
          # PRE-PUSH sha and failed a job that had just succeeded: heavy really
          # did go to v11 `10c0ee5c`, release command and all. A Heroku git
          # endpoint is a push endpoint that triggers a build, and the ref it
          # advertises advances asynchronously after the release.
          #
          # `verify` polls the Platform API release record — which is what notice
          # 48 already means by "heavy carries the sha" — and distinguishes
          # UNREADABLE (2) from MISMATCH (1), because the old line could not and
          # so reported both as a false claim about heavy's commit.
          set +e
          python3 scripts/heavy_sync_decision.py verify \
            --app bainluck-heavy --expect "$MAIN_LIVE"
          READBACK=$?
          set -e

          {
            echo "### Heavy app sync"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| pushed | \`${MAIN_LIVE}\` |"
            echo "| heavy was | \`${HEAVY_LIVE}\` (${BEHIND} commits behind) |"
            echo "| readback | \`$(case $READBACK in 0) echo CONFIRMED;; 1) echo MISMATCH;; 2) echo UNREADABLE;; *) echo "exit $READBACK";; esac)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # The release moving is still not the whole ship. `worker-heavy` must
          # come up on it — read `/api/admin/celery/fleet-code` (notice 48),
          # which reports MATCHED only once the heavy worker names this slug.
          case "$READBACK" in
            0) echo "Heavy's release is built from the main app's live commit." ;;
            2) echo "::warning::the push succeeded but heavy's release could not be read"
               echo "::warning::back. NOT failing: an unreadable answer is not a negative one,"
               echo "::warning::and the next run re-reads both live refs and re-judges."
               exit 0 ;;
            *) echo "::error::heavy's release is not built from the commit just pushed."
               exit 1 ;;
          esac
