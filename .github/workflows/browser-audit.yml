name: Browser audit (manual)

# L2-221 Item 2 — phase 1 of the replacement browser-QA rail (#1497).
#
# DELIBERATELY manual-only. No `schedule:`, no issue filing, no auth, no
# production write credential. Those are later phases (C96's migration plan
# steps 3-5) and must not be switched on by editing this file casually.
#
# The one thing this workflow must never do is report GREEN without evidence.
# The retired provider's sweep concluded `success` with 0 of 3 modules
# collected; every step below is arranged so that path is impossible:
#
#   * the SHA wait fails hard if the requested commit is not the one deployed
#   * the runner fails if any journey fails
#   * the manifest validator fails on zero selected journeys, a missing
#     manifest, a SHA mismatch, an unevidenced journey, or a non-pass result
#   * artifacts upload with `if: always()` and are NOT wrapped in
#     continue-on-error, so a failed upload fails the job
#
# Rollback: disable or delete this workflow. Rollback does NOT mean restoring
# the retired provider.

on:
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: "Full 40-hex commit the deployed frontend must report before the audit runs"
        required: true
        type: string
      base_url:
        description: "Site origin to audit"
        required: false
        default: "https://www.bainluck.com"
        type: string
      api_base_url:
        description: "Backend origin — its /health sha is RECORDED beside the frontend's, never substituted for it"
        required: false
        default: "https://api.bainluck.com"
        type: string
      sha_timeout_seconds:
        description: "Bounded wait for the frontend deployment to report the requested SHA"
        required: false
        default: "600"
        type: string
      pack:
        description: "Which journeys to run"
        required: false
        default: "deploy-smoke+consent"
        type: choice
        options:
          - deploy-smoke+consent
          - deploy-smoke
          - consent
          - grid
          - calibration

# Least privilege: read the repo, nothing else. The filer that consumes a
# validated manifest is a separate, later job with its own `issues: write`.
permissions:
  contents: read

concurrency:
  group: browser-audit-${{ inputs.frontend_sha }}
  cancel-in-progress: true

jobs:
  audit:
    name: Anonymous Discover smoke + web consent pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/e2e

    env:
      AUDIT_PACK: ${{ inputs.pack }}
      AUDIT_TRIGGER: workflow_dispatch
      AUDIT_REQUESTED_SHA: ${{ inputs.frontend_sha }}
      TRACE_BASE_URL: ${{ inputs.base_url }}
      AUDIT_API_BASE_URL: ${{ inputs.api_base_url }}
      AUDIT_OUT_DIR: ${{ github.workspace }}/frontend/e2e/audit-out

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # L2-223: full history so the ancestry proof below is possible. With
          # the default depth-1 clone `git merge-base` cannot see the audited
          # commit, and "cannot prove" would collapse into "assume fine".
          fetch-depth: 0

      - name: Validate every dispatch input
        # L2-223. Every value here is attacker-choosable by anyone who can
        # dispatch the workflow, so each is read from the environment (never
        # interpolated into shell syntax) and pattern-checked before use.
        #
        # `sha_timeout_seconds` was previously spliced straight into shell
        # arithmetic as `$(( ${{ inputs.sha_timeout_seconds }} * 1000 ))`, which
        # evaluates arbitrary shell arithmetic — and `${{ }}` expansion happens
        # before the shell ever sees the line, so quoting it would not have
        # helped. Gotcha #9: the checks live inside the run block.
        env:
          RAW_TIMEOUT: ${{ inputs.sha_timeout_seconds }}
        run: |
          set -euo pipefail

          # An abbreviated sha is ambiguous, and "close enough" is exactly how
          # a run gets attached to the wrong deployment.
          if ! printf '%s' "${AUDIT_REQUESTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::frontend_sha must be a full lowercase 40-hex commit sha"
            exit 1
          fi

          # Digits only, and bounded. A negative or enormous value would either
          # skip the deployment wait entirely or hold a runner for hours.
          if ! printf '%s' "${RAW_TIMEOUT}" | grep -Eq '^[0-9]{1,4}$'; then
            echo "::error::sha_timeout_seconds must be 1-4 digits"
            exit 1
          fi
          if [ "${RAW_TIMEOUT}" -lt 30 ] || [ "${RAW_TIMEOUT}" -gt 1800 ]; then
            echo "::error::sha_timeout_seconds must be between 30 and 1800"
            exit 1
          fi
          echo "AUDIT_SHA_TIMEOUT_MS=$(( RAW_TIMEOUT * 1000 ))" >> "$GITHUB_ENV"

          # Canonical origins only. A preview deployment is a real Vercel host
          # serving a DIFFERENT build, so a green from one attached to a
          # production commit is a lie — hence exact match, not a suffix test.
          case "${TRACE_BASE_URL}" in
            https://www.bainluck.com|https://bainluck.com) ;;
            *) echo "::error::base_url must be a canonical production origin"; exit 1 ;;
          esac
          case "${AUDIT_API_BASE_URL}" in
            https://api.bainluck.com) ;;
            *) echo "::error::api_base_url must be https://api.bainluck.com"; exit 1 ;;
          esac

          # Reject an unknown pack up front so it cannot reach a command line
          # at all. Deliberately a `grep`, not a `case`: the packaging contract
          # test asserts there is exactly ONE `case "${AUDIT_PACK}"` dispatch in
          # this file — two would mean two playwright invocations, and the
          # second manifest would silently overwrite the first.
          #
          # L2-228: this allowlist and the `options:` list above are TWO places
          # that must agree, and they silently did not. L2-227 added `grid` to
          # the dropdown and to the dispatch `case`, but not here — so the only
          # way to select the grid pack was to have the run die at input
          # validation. An advertised choice that cannot execute is worse than
          # an absent one: it reads as coverage on the dropdown. The packaging
          # contract now DERIVES the expected set from `options:` and fails when
          # the allowlist, the dispatch and the npm scripts drift apart, so this
          # class cannot recur silently.
          if ! printf '%s' "${AUDIT_PACK}" | grep -Eq '^(deploy-smoke|consent|deploy-smoke\+consent|grid|calibration)$'; then
            echo "::error::unknown pack"
            exit 1
          fi

      - name: Bind the grading commit to the audited commit
        # L2-223. requested == observed proves WHICH DEPLOYMENT was exercised.
        # It says nothing about which commit's specs, evaluator and validator
        # did the grading — and a dispatch may name any ref, so a weakened
        # evaluator on a side branch could manufacture a green for a commit it
        # never graded honestly.
        #
        # Equality is not required: master legitimately moves ahead of what
        # Vercel has deployed. What IS required is proof that the audited
        # commit lies in this checkout's history. A fork commit, a rewritten
        # commit, or an unrelated branch fails that test.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "alexander-bain/bainluck" ]; then
            echo "::error::this rail may only run on the canonical repository"
            exit 1
          fi

          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "AUDIT_CHECKOUT_SHA=${CHECKOUT_SHA}" >> "$GITHUB_ENV"
          echo "Grading commit (checkout): ${CHECKOUT_SHA}"
          echo "Audited commit (deployed): ${AUDIT_REQUESTED_SHA}"

          if [ "${CHECKOUT_SHA}" = "${AUDIT_REQUESTED_SHA}" ]; then
            echo "AUDIT_CHECKOUT_ANCESTRY=identical" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! git cat-file -e "${AUDIT_REQUESTED_SHA}^{commit}" 2>/dev/null; then
            echo "::error::${AUDIT_REQUESTED_SHA} is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${AUDIT_REQUESTED_SHA}" "${CHECKOUT_SHA}"; then
            echo "::error::the deployed commit is not an ancestor of the checkout — the grading code is from a foreign line of history"
            exit 1
          fi
          echo "AUDIT_CHECKOUT_ANCESTRY=requested-is-ancestor-of-checkout" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          # L2-229: restored, in the same commit that adds the lockfile.
          #
          # These two lines were removed by L2-228 because setup-node's cache
          # step HARD-FAILS when its dependency path does not resolve ("Some
          # specified paths were not resolved, unable to cache dependencies"),
          # and the lockfile had never existed in any commit. A pure speed
          # optimisation was therefore aborting the job at SETUP — before the
          # contract fixtures, which sit ahead of any install precisely so they
          # always run. The rail's most important always-on gate was the first
          # casualty of a missing cache key, and the honest `npm ci` error
          # nobody ever got to see was replaced by a confusing one about
          # caching. Verified against run 30721023236.
          #
          # The packaging contract asserts every `cache-dependency-path` in
          # this file resolves to a real file, so the pair cannot come back
          # ahead of the lockfile again.
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Contract fixtures (no dependencies, no browser, no network)
        # Runs BEFORE any install: `node --test` needs nothing but Node. If the
        # false-green fixtures stop failing, nothing downstream can be trusted,
        # so this fails fast rather than after a browser download.
        run: npm run contract

      - name: Install locked dependencies
        # `npm ci` — never `npm install`. It fails loudly when the lockfile is
        # missing or disagrees with package.json, which is the reproducibility
        # gate: without it, two runs can use different browser revisions while
        # claiming to prove the same commit.
        run: npm ci

      - name: Install the Playwright-matched Chromium
        run: npx playwright install --with-deps chromium

      - name: Record runtime versions
        run: |
          echo "AUDIT_BROWSER_VERSION=$(npx playwright --version)" >> "$GITHUB_ENV"
          node --version

      - name: Wait for the requested frontend deployment
        # Exports AUDIT_OBSERVED_FRONTEND_SHA and, separately labelled,
        # AUDIT_OBSERVED_BACKEND_SHA. Exits non-zero if the requested commit
        # is not what /api/frontend-build reports within the bound.
        # AUDIT_SHA_TIMEOUT_MS was computed from a digits-only, range-checked
        # input in the validation step — no dispatch value reaches shell syntax.
        run: node scripts/wait-for-frontend-sha.js --timeout-ms "${AUDIT_SHA_TIMEOUT_MS}"

      - name: Run the selected pack — desktop and mobile
        # EXACTLY ONE playwright invocation, deliberately.
        #
        # The reporter writes `$AUDIT_OUT_DIR/manifest.json` on every run, so a
        # second invocation OVERWRITES the first's manifest — the validator
        # would then grade only the last pack while the summary still implied
        # both had been proven. A silently-discarded half is precisely the
        # false-green shape this rail exists to make impossible, so the packs
        # are combined into one run instead of chained as separate steps.
        #
        # The consent pack (#1453) is the rendered half of the web consent
        # claim: zero requests after a Decline, exactly one page view after a
        # Grant, nothing after a revoke. Each journey carries a telemetry ledger
        # the shared evaluator grades, and an absence is believed only alongside
        # a declared observation window.
        run: |
          case "${AUDIT_PACK}" in
            deploy-smoke)          npm run smoke ;;
            consent)               npm run consent ;;
            deploy-smoke+consent)  npm run smoke-consent ;;
            grid)                  npm run grid ;;
            calibration)           npm run calibration ;;
            *)
              echo "::error::unknown pack '${AUDIT_PACK}'"
              exit 1
              ;;
          esac

      - name: Validate the evidence manifest
        # The gate. A missing manifest, zero selected journeys, a SHA
        # mismatch, an unevidenced journey, or any non-pass result exits 1.
        #
        # L2-223 adds `--verify-bytes`: every artifact the manifest claims is
        # opened and re-hashed here, while the files still exist. Before this,
        # a fictional artifact with a plausible 64-hex digest validated — and a
        # fictional artifact is worse than none, because it reads as evidence
        # in every downstream summary.
        if: always()
        run: npm run validate -- "$AUDIT_OUT_DIR/manifest.json" --verify-bytes

      - name: Upload audit evidence
        # `if: always()` so failures keep their artifacts. Deliberately NOT
        # continue-on-error: if the upload fails there is no evidence, and a
        # run with no evidence must not be green.
        #
        # L2-223: `test-results/` and `playwright-report/` are NOT uploaded.
        # Both carry Playwright traces — zips of the whole session including
        # request/response bodies, storage and cookie headers — and phase 1 has
        # no reviewed containment policy for them. Tracing is off at the config
        # level too; this is the second lock, not the only one. The manifest
        # and its `artifacts/` screenshots are the closure evidence, and every
        # artifact path is required to live in this one uploaded tree.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ inputs.frontend_sha }}-${{ github.run_id }}
          path: frontend/e2e/audit-out/
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          MANIFEST="$AUDIT_OUT_DIR/manifest.json"
          {
            echo "## Browser audit"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| requested frontend sha (audited) | \`${AUDIT_REQUESTED_SHA}\` |"
            echo "| observed frontend sha | \`${AUDIT_OBSERVED_FRONTEND_SHA:-unresolved}\` |"
            echo "| checkout sha (grading code) | \`${AUDIT_CHECKOUT_SHA:-unresolved}\` |"
            echo "| checkout ancestry | ${AUDIT_CHECKOUT_ANCESTRY:-unproven} |"
            echo "| observed backend sha (recorded only) | \`${AUDIT_OBSERVED_BACKEND_SHA:-unavailable}\` |"
            echo "| base url | ${TRACE_BASE_URL} |"
            if [ -f "$MANIFEST" ]; then
              node -e '
                const m = require(process.argv[1]);
                const r = m.run;
                console.log(`| result | **${r.result}** |`);
                console.log(`| runner status | ${r.runner_status ?? "unrecorded"} |`);
                console.log(`| selected / completed / failed | ${r.selected_count} / ${r.completed_count} / ${r.failed_count} |`);
                for (const j of m.journeys) {
                  console.log(`| ${j.journey_id} [${j.project}] | ${j.result} |`);
                }
              ' "$MANIFEST"
            else
              echo "| result | **no manifest written — infrastructure failure** |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
