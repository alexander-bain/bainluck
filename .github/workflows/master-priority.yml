name: Master release priority

# Ensure master release runs get GitHub Actions runners ahead of queued or
# competing pull-request checks when the 40-job personal pool saturates
# (Alex, Tue Nov 24; automates Fable's 379: A yield + resume protocol). Later
# stages of a release (shards -> search-recall -> deploy -> smoke) each join
# the back of the same 40-job line unless competing PR checks yield.
#
# - Never cancels push runs, master runs, compose runs, or tier-b workflows.
# - Only pauses PR runs (`ci.yml`, `codeql.yml`, `watch-mvp.yml`) belonging to
#   open PRs at their exact head SHA, and records their run IDs in a short-lived
#   artifact so the completing master CI run automatically re-queues only the
#   still-current, still-cancelled PR heads.

on:
  push:
    branches: [master]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Optional manual action: yield or resume"
        required: false
        default: yield

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: master-priority-scheduler
  cancel-in-progress: false

jobs:
  yield-pr-runs:
    name: Yield PR runs for active master release
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'resume')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel competing PR checks while master CI is queued or running
        id: yield
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          out_path = Path("master-paused-pr-runs.json")

          def gh_json(endpoint, *, method="GET"):
              proc = subprocess.run(
                  ["gh", "api", "-X", method, endpoint],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  return None
              return json.loads(proc.stdout) if proc.stdout.strip() else {}

          master_runs = (
              gh_json(f"repos/{repo}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=10")
              or {}
          ).get("workflow_runs", [])
          active_master = [
              r for r in master_runs if r.get("status") in ("queued", "in_progress", "waiting", "pending", "requested")
          ]
          if not active_master:
              print("No queued/in-progress CI push run on master; leaving PR runs untouched.")
              raise SystemExit(0)

          print(f"Active master CI runs: {[r['id'] for r in active_master]}")

          paused = []
          seen_run_ids = set()
          for wf in ("ci.yml", "codeql.yml", "watch-mvp.yml"):
              for status in ("queued", "in_progress"):
                  data = (
                      gh_json(
                          f"repos/{repo}/actions/workflows/{wf}/runs?event=pull_request&status={status}&per_page=50"
                      )
                      or {}
                  )
                  for run in data.get("workflow_runs", []):
                      run_id = run.get("id")
                      if not run_id or run_id in seen_run_ids:
                          continue
                      seen_run_ids.add(run_id)
                      if run.get("head_branch") == "master":
                          continue
                      prs = run.get("pull_requests") or []
                      if not prs:
                          continue
                      pr_number = prs[0].get("number")
                      if not pr_number:
                          continue
                      pr = gh_json(f"repos/{repo}/pulls/{pr_number}")
                      if not pr or pr.get("state") != "open":
                          continue
                      head_sha = run.get("head_sha")
                      if not head_sha or (pr.get("head") or {}).get("sha") != head_sha:
                          continue
                      jobs_data = gh_json(f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100") or {}
                      jobs = jobs_data.get("jobs", [])
                      if any(j.get("conclusion") == "failure" for j in jobs):
                          # Leave already-red runs untouched.
                          continue
                      had_completed_jobs = any(
                          j.get("status") == "completed" and j.get("conclusion") in ("success", "skipped")
                          for j in jobs
                      )
                      proc = subprocess.run(
                          ["gh", "api", "-X", "POST", f"repos/{repo}/actions/runs/{run_id}/cancel"],
                          capture_output=True,
                          text=True,
                      )
                      if proc.returncode == 0:
                          print(f"Paused {wf} run {run_id} on PR #{pr_number} ({head_sha[:8]})")
                          paused.append(
                              {
                                  "run_id": run_id,
                                  "workflow_file": wf,
                                  "pr_number": pr_number,
                                  "head_sha": head_sha,
                                  "had_completed_jobs": had_completed_jobs,
                              }
                          )
                      else:
                          print(f"Skipped/race cancelling {wf} run {run_id}: {proc.stderr.strip()}")

          if paused:
              out_path.write_text(json.dumps(paused, indent=2), encoding="utf-8")
              print(f"Recorded {len(paused)} paused PR run(s) in {out_path}.")
          else:
              print("No competing open-PR runs needed yielding.")
          PY

      - name: Upload paused PR run list
        uses: actions/upload-artifact@v4
        with:
          name: master-paused-pr-runs-${{ github.run_id }}
          path: master-paused-pr-runs.json
          if-no-files-found: ignore
          retention-days: 1

  resume-pr-runs:
    name: Resume PR runs after master CI finishes
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'resume')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-queue still-current cancelled PR checks once master queue is clear
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import subprocess
          import zipfile
          from datetime import datetime, timedelta, timezone

          repo = os.environ["GITHUB_REPOSITORY"]

          def gh_api(endpoint, *, method="GET", binary=False):
              proc = subprocess.run(
                  ["gh", "api", "-X", method, endpoint],
                  capture_output=True,
              )
              if proc.returncode != 0:
                  return None
              return proc.stdout if binary else (json.loads(proc.stdout.decode("utf-8")) if proc.stdout.strip() else {})

          master_runs = (
              gh_api(f"repos/{repo}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=10")
              or {}
          ).get("workflow_runs", [])
          active_master = [
              r for r in master_runs if r.get("status") in ("queued", "in_progress", "waiting", "pending", "requested")
          ]
          if active_master:
              print(f"Master CI still active ({[r['id'] for r in active_master]}); deferring PR resume.")
              raise SystemExit(0)

          cutoff = datetime.now(timezone.utc) - timedelta(hours=3)
          artifacts = (
              gh_api(f"repos/{repo}/actions/artifacts?per_page=100") or {}
          ).get("artifacts", [])

          candidates = {}
          for art in artifacts:
              if art.get("expired"):
                  continue
              name = str(art.get("name") or "")
              if not name.startswith("master-paused-pr-runs-"):
                  continue
              created_raw = art.get("created_at")
              try:
                  created = datetime.fromisoformat(str(created_raw).replace("Z", "+00:00"))
              except ValueError:
                  continue
              if created < cutoff:
                  continue
              blob = gh_api(f"repos/{repo}/actions/artifacts/{art['id']}/zip", binary=True)
              if not blob:
                  continue
              try:
                  with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                      for member in zf.namelist():
                          if member.endswith(".json"):
                              for row in json.loads(zf.read(member).decode("utf-8")):
                                  rid = row.get("run_id")
                                  if rid and rid not in candidates:
                                      candidates[rid] = row
              except Exception as exc:
                  print(f"Could not read artifact {art.get('id')}: {exc}")

          if not candidates:
              print("No recent master-paused PR runs to resume.")
              raise SystemExit(0)

          pr_cache = {}
          for run_id, row in candidates.items():
              pr_number = row.get("pr_number")
              head_sha = row.get("head_sha")
              wf = row.get("workflow_file")
              if not (pr_number and head_sha and wf):
                  continue
              if pr_number not in pr_cache:
                  pr_cache[pr_number] = gh_api(f"repos/{repo}/pulls/{pr_number}")
              pr = pr_cache[pr_number]
              if not pr or pr.get("state") != "open" or (pr.get("head") or {}).get("sha") != head_sha:
                  continue
              run = gh_api(f"repos/{repo}/actions/runs/{run_id}")
              if not run or run.get("status") != "completed" or run.get("conclusion") != "cancelled":
                  continue

              siblings = (
                  gh_api(
                      f"repos/{repo}/actions/workflows/{wf}/runs?head_sha={head_sha}&event=pull_request&per_page=10"
                  )
                  or {}
              ).get("workflow_runs", [])
              already_covered = any(
                  s.get("status") in ("queued", "in_progress", "waiting", "pending", "requested")
                  or (s.get("status") == "completed" and s.get("conclusion") != "cancelled")
                  for s in siblings
              )
              if already_covered:
                  continue

              endpoint = (
                  f"repos/{repo}/actions/runs/{run_id}/rerun-failed-jobs"
                  if row.get("had_completed_jobs")
                  else f"repos/{repo}/actions/runs/{run_id}/rerun"
              )
              proc = subprocess.run(
                  ["gh", "api", "-X", "POST", endpoint],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0 and row.get("had_completed_jobs"):
                  proc = subprocess.run(
                      ["gh", "api", "-X", "POST", f"repos/{repo}/actions/runs/{run_id}/rerun"],
                      capture_output=True,
                      text=True,
                  )
              if proc.returncode == 0:
                  print(f"Resumed {wf} run {run_id} for PR #{pr_number} ({head_sha[:8]})")
              else:
                  print(f"Could not resume {wf} run {run_id}: {proc.stderr.strip()}")
          PY
