name: Tier-B review
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write
  issues: read
  id-token: write
concurrency:
  group: tier-b-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'tier-b') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for green CI at this head
        id: ci
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 30 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== head ||
                  !pr.labels.some(label => label.name === 'tier-b')) {
                core.notice('PR closed, became draft, lost tier-b, or moved head; no review.');
                return;
              }
              // refUpdateRule is GitHub's non-admin view. isRequired also
              // resolves each check's expected App without administration access.
              const nodes = [], cursors = new Set();
              let cursor = null, currentPolicy;
              do {
                const policy = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!,$cursor:String){
                  repository(owner:$owner,name:$repo){pullRequest(number:$number){
                    headRefOid baseRef{refUpdateRule{requiredStatusCheckContexts}}
                    commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100,after:$cursor){
                      nodes{__typename ... on CheckRun{databaseId isRequired(pullRequestNumber:$number)}
                        ... on StatusContext{context isRequired(pullRequestNumber:$number)}}
                      pageInfo{hasNextPage endCursor}
                    }}}}}
                  }}
                }`, {...repo, number, cursor});
                currentPolicy = policy.repository.pullRequest;
                if (currentPolicy.headRefOid !== head) return;
                const page = currentPolicy.commits.nodes[0]?.commit.statusCheckRollup?.contexts;
                if (!page) break; // Missing checks remain missing, never green.
                nodes.push(...page.nodes);
                if (page.pageInfo.hasNextPage && !page.pageInfo.endCursor) throw new Error('Required-check page is incomplete');
                cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
                if (cursor && cursors.has(cursor)) throw new Error('Required-check cursor repeated');
                if (cursor) cursors.add(cursor);
                if (cursor && cursors.size >= 10) throw new Error('Required-check page budget exhausted');
              } while (cursor);
              const requiredNames = currentPolicy.baseRef?.refUpdateRule?.requiredStatusCheckContexts;
              if (!requiredNames?.length) {
                core.setFailed('Required-check configuration is unavailable; no review.');
                return;
              }
              // Approval is produced after this review; waiting for it deadlocks.
              const required = requiredNames.filter(name => name !== 'Tier-B approval');
              if (!required.length) {
                core.setFailed('No required CI checks are configured; no review.');
                return;
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                {...repo, head_sha: head, event: 'pull_request', per_page: 100});
              // A superseded/cancelled suite must not masquerade as red CI.
              // For each workflow use its newest non-cancelled run at this head.
              const latest = new Map();
              for (const run of [...runs].sort((a, b) => b.id - a.id)) {
                if (run.conclusion !== 'cancelled' && !latest.has(run.path)) latest.set(run.path, run);
              }
              const ignoredSuites = new Set(runs.filter(run =>
                run.conclusion === 'cancelled' || latest.get(run.path)?.id !== run.id ||
                ['.github/workflows/tier-b-review.yml', '.github/workflows/tier-b.yml'].includes(run.path)
              ).map(run => run.check_suite_id).filter(id => id != null));
              const checks = (await github.paginate(github.rest.checks.listForRef,
                {...repo, ref: head, filter: 'latest', per_page: 100})).filter(check =>
                  !['review', 'Tier-B approval'].includes(check.name) &&
                  !ignoredSuites.has(check.check_suite?.id));
              const requiredCheckIds = new Set(nodes.filter(node => node.isRequired && node.__typename === 'CheckRun').map(node => node.databaseId));
              const requiredStatuses = new Set(nodes.filter(node => node.isRequired && node.__typename === 'StatusContext').map(node => node.context));
              const statuses = requiredStatuses.size
                ? await github.paginate(github.rest.repos.listCommitStatusesForRef,
                    {...repo, ref: head, per_page: 100}) : [];
              const requiredChecks = required.map(name => {
                const check = checks.find(check => check.name === name && requiredCheckIds.has(check.id));
                if (check) return check;
                const status = requiredStatuses.has(name) && statuses.find(status => status.context === name);
                return status ? {name: status.context,
                  status: status.state === 'pending' ? 'in_progress' : 'completed',
                  conclusion: status.state} : null;
              });
              const red = requiredChecks.find(check => check?.status === 'completed' &&
                !['success', 'neutral', 'skipped'].includes(check.conclusion));
              if (red) {
                core.setFailed(`Required CI is red at ${head}: ${red.name}; no review.`);
                return;
              }
              if (requiredChecks.every(check => check?.status === 'completed' &&
                  ['success', 'neutral', 'skipped'].includes(check.conclusion))) {
                const {data: current} = await github.rest.pulls.get({...repo, pull_number: number});
                if (current.state !== 'open' || current.draft || current.head.sha !== head ||
                    !current.labels.some(label => label.name === 'tier-b')) return;
                core.setOutput('ready', 'true');
                core.notice(`Required CI is green at ${head}.`);
                return;
              }
              core.info(`Waiting for CI at ${head}; reviewer has not started.`);
              await new Promise(resolve => setTimeout(resolve, 60000));
            }
            core.setFailed(`Timed out after 30 minutes waiting for green CI at ${head}; no review.`);
      - uses: actions/checkout@v6
        if: steps.ci.outputs.ready == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: steps.ci.outputs.ready == 'true'
        with:
          python-version: "3.11"
      - run: pip install -q -r backend/requirements.txt
        if: steps.ci.outputs.ready == 'true'
      - uses: anthropics/claude-code-action@v1
        if: steps.ci.outputs.ready == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} as the independent Tier-B reviewer.
            Required CI was verified green at head ${{ github.event.pull_request.head.sha }} before this review. Inspect the current required checks if needed; optional failures are evidence to assess, not an automatic refusal. The Tier-B approval check waits for your verdict and is excluded from this pre-review gate.
            Run tests directly, without a pipe: cd backend && python3 -m pytest <files> -q. Use Read/Grep for files. Shell commands may also use an absolute backend path; python/python3 pytest are allowed separately from cd.
            Follow docs/release-loop/tier-b-review-brief.md exactly; it is the whole brief. End with exactly one review: approve or request changes.
          claude_args: >-
            --model claude-sonnet-5-5 --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(cd:*),Bash(python -m pytest:*),Bash(python3 -m pytest:*),Bash(gh run view:*),Bash(echo:*),Bash(tail:*)" --max-turns 60
            ${{ startsWith(github.event.pull_request.head.ref, 'codex/eval-reviewer-') && '--max-budget-usd 0.40' || '' }}
