name: Daily Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize runs so a scheduled tick and a manual dispatch can never both reach the
# zero-owner cold-start create path concurrently and file duplicate canonical cards
# (Queue 279 / C72). The filer also re-reads owners immediately before POST.
concurrency:
  group: daily-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Production health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health checks
        env:
          # Notice 39 / #4763 Rail A: name this robot on our own wire. The tagging
          # code in `scripts/daily_health_check.py` has been live since #4706, but
          # `resolve_agent()` reads BL_AGENT at call time and returns None when it
          # is unset — so every read this job makes has been going out UNTAGGED,
          # indistinguishable from a person's in `search_query_logs`. This line is
          # the half that makes the other half do anything.
          BL_AGENT: ci-daily-health-check
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/daily_health_check.py --create-issue || true
