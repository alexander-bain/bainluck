# Full suite starts after the CI run has completed its deploy.
# Keep full commands in sync with CI.
name: Live-path full-suite watchdog
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
permissions:
  contents: read
  actions: read
  issues: write
  deployments: write
jobs:
  select:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion
      == 'success'
    outputs:
      live: ${{ steps.mode.outputs.live }}
    steps:
    - name: Read exact-run gate mode
      id: mode
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      run: "set -eu\nif ! gh run download \"$RUN_ID\" --repo \"$GITHUB_REPOSITORY\" --name \"release-loop-mode-$RUN_ID-$RUN_ATTEMPT\" --dir /tmp/release-loop-mode;\
        \ then\n  echo \"live=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\npython3 - <<'MODE'\nimport json, os\ntry:\n    with open('/tmp/release-loop-mode/release-loop-mode.json')\
        \ as source:\n        mode = json.load(source)\n    live = (mode.get('sha') != os.environ['CANDIDATE_SHA'] or mode.get('run_id') != os.environ['RUN_ID']\n\
        \            or mode.get('run_attempt') != os.environ['RUN_ATTEMPT'] or mode.get('live') is not False)\nexcept (OSError, ValueError, TypeError,\
        \ AttributeError):\n    live = True\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('live=' + str(live).lower()\
        \ + '\\n')\nMODE\n"
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    needs: select
    if: needs.select.outputs.live == 'true'
    steps:
    - id: scope
      run: echo "scope=full" >> "$GITHUB_OUTPUT"
  backend-tests:
    needs:
    - change-scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
    defaults:
      run:
        working-directory: backend
    steps:
    - name: Reused exact-commit test evidence
      if: needs.change-scope.outputs.reuse == 'true'
      working-directory: .
      env:
        REUSE_RUN: ${{ needs.change-scope.outputs.reuse_run }}
        REUSE_ATTEMPT: ${{ needs.change-scope.outputs.reuse_attempt }}
        REUSE_HEAD: ${{ needs.change-scope.outputs.reuse_head }}
        REUSE_BASE: ${{ needs.change-scope.outputs.reuse_base }}
      run: echo "reused run $REUSE_RUN attempt $REUSE_ATTEMPT, tested $REUSE_HEAD, base $REUSE_BASE"
    - name: "Frontend-only or live-path candidate \u2014 the full shard is deferred"
      if: needs.change-scope.outputs.scope == 'frontend' || needs.change-scope.outputs.live == 'true'
      working-directory: .
      run: echo "change scope is 'frontend'; shard ${{ matrix.shard }} intentionally ran nothing."
    - uses: actions/checkout@v6
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
      with:
        fetch-depth: 0
        filter: blob:none
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Record compose checkout provenance
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
        && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integrator/compose-')
      working-directory: .
      run: python3 .github/scripts/ci-prior-evidence.py --record "$RUNNER_TEMP/ci-provenance.json" --identity backend-tests-${{ matrix.shard }}
    - name: Publish compose checkout provenance
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
        && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integrator/compose-')
      uses: actions/upload-artifact@v4
      with:
        name: compose-source-provenance-${{ github.run_attempt }}-backend-tests-${{ matrix.shard }}
        path: ${{ runner.temp }}/ci-provenance.json
        if-no-files-found: error
        retention-days: 2
    - uses: actions/setup-python@v7
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
      run: pip install -r requirements.txt
    - name: Private redis-server binary for the real-Redis publication controls (#10090)
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
      run: 'set -euo pipefail

        dir="$RUNNER_TEMP/redislite"

        wheel=redislite-6.2.912183-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl

        pip download --no-deps --only-binary=:all: redislite==6.2.912183 -d "$dir"

        echo "d5ed8af4d03225a9b19e279d40f8d8feae872f87a9cd9f017751864fe7b224c6  $dir/$wheel" | sha256sum -c -

        python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract(''redislite/bin/redis-server'', sys.argv[2])" "$dir/$wheel" "$dir"

        chmod +x "$dir/redislite/bin/redis-server"

        "$dir/redislite/bin/redis-server" --version

        echo "EVENT_FRAME_REDIS_SERVER=$dir/redislite/bin/redis-server" >> "$GITHUB_ENV"

        echo "EVENT_FRAME_REDIS_REQUIRED=1" >> "$GITHUB_ENV"

        '
    - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
      if: needs.change-scope.outputs.scope != 'frontend' && needs.change-scope.outputs.reuse != 'true' && needs.change-scope.outputs.live != 'true'
      run: "set -o pipefail\nFILES=\"$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})\"\nif [ -z \"$FILES\"\
        \ ]; then\n  echo \"::error::shard ${{ matrix.shard }} resolved to ZERO test files \u2014 the\"\n  echo \"::error::partition is broken\
        \ and this leg would pass without testing anything.\"\n  exit 1\nfi\necho \"shard ${{ matrix.shard }}/${{ strategy.job-total }}: $(echo\
        \ $FILES | wc -w) test files\"\npython -m pytest $FILES -q --durations=0\n"
  shard-completeness:
    needs:
    - change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - name: Reused exact-commit test evidence
      if: needs.change-scope.outputs.reuse == 'true'
      working-directory: .
      env:
        REUSE_RUN: ${{ needs.change-scope.outputs.reuse_run }}
        REUSE_ATTEMPT: ${{ needs.change-scope.outputs.reuse_attempt }}
        REUSE_HEAD: ${{ needs.change-scope.outputs.reuse_head }}
        REUSE_BASE: ${{ needs.change-scope.outputs.reuse_base }}
      run: echo "reused run $REUSE_RUN attempt $REUSE_ATTEMPT, tested $REUSE_HEAD, base $REUSE_BASE"
    - uses: actions/checkout@v6
      if: needs.change-scope.outputs.reuse != 'true'
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-python@v7
      if: needs.change-scope.outputs.reuse != 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      if: needs.change-scope.outputs.reuse != 'true'
      run: pip install -r requirements.txt
    - name: The shards must cover the whole suite, exactly once each
      if: needs.change-scope.outputs.reuse != 'true'
      run: python scripts/ci_shard.py --verify --of 8
  database-integration:
    strategy:
      fail-fast: false
      matrix:
        group:
        - shared
        - shared-middle
        - shared-tail
        - isolated
        - shared-suffix
    needs:
    - change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bl_searchtest
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
        - 56379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SEARCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest
      PYTEST_ADDOPTS: ${{ matrix.group == 'shared-tail' && '--reruns 1 -rR' || '' }}
    steps:
    - id: db_000_reused_exact_commit_test_evidence
      name: Reused exact-commit test evidence
      if: ${{ !cancelled() && (needs.change-scope.outputs.reuse == 'true') }}
      working-directory: .
      env:
        REUSE_RUN: ${{ needs.change-scope.outputs.reuse_run }}
        REUSE_ATTEMPT: ${{ needs.change-scope.outputs.reuse_attempt }}
        REUSE_HEAD: ${{ needs.change-scope.outputs.reuse_head }}
        REUSE_BASE: ${{ needs.change-scope.outputs.reuse_base }}
      run: echo "reused run $REUSE_RUN attempt $REUSE_ATTEMPT, tested $REUSE_HEAD, base $REUSE_BASE"
    - id: db_001_actions_checkout_v6
      uses: actions/checkout@v6
      if: ${{ !cancelled() && (needs.change-scope.outputs.reuse != 'true') }}
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - id: db_002_actions_setup_python_v7
      uses: actions/setup-python@v7
      if: ${{ !cancelled() && (needs.change-scope.outputs.reuse != 'true') }}
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - id: db_003_install_dependencies
      name: Install dependencies
      if: ${{ !cancelled() && (needs.change-scope.outputs.reuse != 'true') }}
      run: pip install -r requirements.txt
    - id: db_004_verify_the_gate_is_actually_armed
      name: Verify the gate is actually armed
      if: ${{ !cancelled() && (needs.change-scope.outputs.reuse != 'true') }}
      run: "python -c \"\nimport os, sys\nurl = os.environ.get('SEARCH_TEST_DATABASE_URL')\nif not url:\n    sys.exit('SEARCH_TEST_DATABASE_URL\
        \ unset \u2014 the recall gate would silently SKIP')\nprint(f'recall gate armed against {url.rsplit(chr(64), 1)[-1]}')\n\"\n"
    - id: db_004a_55a_shared_tail_retry_once_plugin
      name: "#55-A shared tail \u2014 provision the pinned retry-once plugin"
      if: ${{ !cancelled() && (matrix.group == 'shared-tail' && needs.change-scope.outputs.reuse != 'true') }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/rerunfailures"
        wheel=pytest_rerunfailures-16.7-py3-none-any.whl
        pip download --no-deps --only-binary=:all: pytest-rerunfailures==16.7 -d "$dir"
        echo "edf1886209c2b7dafe35b5bf1708d6ec40ccf6c6b357f0f02807efcec0204c99  $dir/$wheel" | sha256sum -c -
        pip install --no-deps "$dir/$wheel"
        python -c "import pytest_rerunfailures; print('retry-once plugin', pytest_rerunfailures.__file__)"
    - id: db_005_10703_shared_tail_provision_pg_trgm_on_t
      name: "#10703 shared tail \u2014 provision pg_trgm on the fresh database"
      if: ${{ !cancelled() && (matrix.group == 'shared-tail' && needs.change-scope.outputs.reuse != 'true') }}
      run: "python - <<'PYPG'\nimport asyncio\nimport os\nfrom sqlalchemy import text\nfrom sqlalchemy.ext.asyncio import create_async_engine\n\
        \nasync def provision():\n    engine = create_async_engine(os.environ[\"SEARCH_TEST_DATABASE_URL\"])\n    try:\n        async with engine.begin()\
        \ as conn:\n            await conn.execute(text(\"CREATE EXTENSION IF NOT EXISTS pg_trgm\"))\n    finally:\n        await engine.dispose()\n\
        \nasyncio.run(provision())\nPYPG\n"
    - id: db_006_search_recall_contract_real_postgres
      name: Search recall contract (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_recall_contract.py \\\n  -v -s -rs 2>&1 | tee /tmp/recall.txt\nif\
        \ grep -qiE \"[0-9]+ skipped\" /tmp/recall.txt; then\n  echo \"::error::search recall contract SKIPPED \u2014 the gate did not run\"\n\
        \  exit 1\nfi\ngrep -E \"^SEARCH RECALL\" /tmp/recall.txt || {\n  echo \"::error::no SEARCH RECALL summary line \u2014 cannot quote the\
        \ result\"\n  exit 1\n}\n"
    - id: db_007_proven_duplicate_search_contract_real_po
      name: Proven-duplicate search contract (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_proven_duplicate_pg.py \\\n  -v -rs 2>&1 | tee /tmp/dupsearch.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/dupsearch.txt; then\n  echo \"::error::proven-duplicate search contract SKIPPED \u2014 the gate did\
        \ not run\"\n  exit 1\nfi\n"
    - id: db_008_10305_one_row_anchor_schedule_move_lock_
      name: '#10305 one-row anchor-schedule move: lock, fence and reach (real Postgres)'
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_reconcile_anchor_schedule_member_10305_pg.py \\\n  -v -rs -p no:cacheprovider\
        \ 2>&1 | tee /tmp/member10305.txt\nif grep -qiE \"[0-9]+ skipped\" /tmp/member10305.txt; then\n  echo \"::error::#10305 member-move gate\
        \ SKIPPED \u2014 the gate did not run\"\n  exit 1\nfi\nif ! grep -qE \"\\b11 passed\\b\" /tmp/member10305.txt; then\n  echo \"::error::#10305\
        \ member-move gate did not pass exactly 11 tests\"\n  exit 1\nfi\n"
    - id: db_009_10305_d2_participant_fill_fences_rollbac
      name: '#10305 D2 participant fill: fences, rollback, restore and the code denylist (real Postgres)'
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_espn_participant_fill_pg.py \\\n  -v -rs -p no:cacheprovider 2>&1 | tee /tmp/fill10305.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/fill10305.txt; then\n  echo \"::error::#10305 D2 participant-fill gate SKIPPED \u2014 the gate did\
        \ not run\"\n  exit 1\nfi\nif ! grep -qE \"\\b94 passed\\b\" /tmp/fill10305.txt; then\n  echo \"::error::#10305 D2 participant-fill gate\
        \ did not pass exactly 94 tests\"\n  exit 1\nfi\n"
    - id: db_010_typeahead_next_fixture_contracts_or_next
      name: Typeahead next-fixture contracts, or-NEXT and lead-team (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_typeahead_next_fixture_pg.py \\\n  -v -rs 2>&1 | tee /tmp/nextfixture.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/nextfixture.txt; then\n  echo \"::error::or-NEXT typeahead contract SKIPPED \u2014 the gate did not\
        \ run\"\n  exit 1\nfi\n"
    - id: db_011_did_you_mean_withdrawn_contract_real_pos
      name: Did-you-mean withdrawn contract (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_did_you_mean_withdrawn_8750_pg.py \\\n  -v -rs 2>&1 | tee /tmp/didyoumean.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/didyoumean.txt; then\n  echo \"::error::did-you-mean withdrawn contract SKIPPED \u2014 the gate did\
        \ not run\"\n  exit 1\nfi\n"
    - id: db_012_matchup_last_meeting_typeahead_contract_
      name: Matchup last-meeting typeahead contract (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_typeahead_matchup_last_meeting_8428_pg.py \\\n  -v -rs 2>&1 | tee /tmp/matchuplast.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/matchuplast.txt; then\n  echo \"::error::matchup last-meeting typeahead contract SKIPPED \u2014 the\
        \ gate did not run\"\n  exit 1\nfi\n"
    - id: db_013_search_settled_recency_contract_real_pos
      name: Search settled-recency contract (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_settled_recency_pg_8505.py \\\n  -v -rs 2>&1 | tee /tmp/settledrecency.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/settledrecency.txt; then\n  echo \"::error::search settled-recency contract SKIPPED \u2014 the gate\
        \ did not run\"\n  exit 1\nfi\n"
    - id: db_014_search_split_terms_sink_real_postgres
      name: Search split-terms sink (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_split_terms_sink_pg_9044.py \\\n  -v -rs 2>&1 | tee /tmp/splitterms.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/splitterms.txt; then\n  echo \"::error::search split-terms contract SKIPPED \u2014 the gate did not\
        \ run\"\n  exit 1\nfi\n"
    - id: db_015_search_club_schedule_date_order_real_pos
      name: Search club-schedule date order (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_club_schedule_date_order_pg_8942.py \\\n  -v -rs 2>&1 | tee /tmp/clubschedule.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/clubschedule.txt; then\n  echo \"::error::search club-schedule contract SKIPPED \u2014 the gate did\
        \ not run\"\n  exit 1\nfi\n"
    - id: db_016_search_finished_games_newest_day_first_o
      name: Search finished games newest-day first over the card leader (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_settled_day_over_lead_club_pg_9040.py \\\n  -v -rs 2>&1 | tee /tmp/settledday.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/settledday.txt; then\n  echo \"::error::search settled-day contract SKIPPED \u2014 the gate did not\
        \ run\"\n  exit 1\nfi\n"
    - id: db_017_search_today_s_final_right_behind_the_ne
      name: Search today's final right behind the next game (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_todays_final_behind_next_pg_9211.py \\\n  -v -rs 2>&1 | tee /tmp/todaysfinal.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/todaysfinal.txt; then\n  echo \"::error::search today's-final contract SKIPPED \u2014 the gate did\
        \ not run\"\n  exit 1\nfi\n"
    - id: db_018_mnf_monday_night_football_finds_monday_n
      name: mnf / monday night football finds Monday night's NFL game (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_broadcast_slot_pg.py \\\n  -v -rs 2>&1 | tee /tmp/slot.txt\nif grep\
        \ -qiE \"[0-9]+ skipped\" /tmp/slot.txt; then\n  echo \"::error::broadcast-slot search gate SKIPPED \u2014 the gate did not run\"\n  exit\
        \ 1\nfi\nif grep -qiE \"no tests ran|collected 0 items\" /tmp/slot.txt; then\n  echo \"::error::broadcast-slot search gate collected NOTHING\"\
        \n  exit 1\nfi\nif ! grep -qE \"^=+ 15 passed\" /tmp/slot.txt; then\n  echo \"::error::broadcast-slot search gate did not pass all 15\"\
        \n  exit 1\nfi\n"
    - id: db_019_proven_duplicate_search_bridge_contract_
      name: Proven-duplicate search BRIDGE contract (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_proven_duplicate_bridge_pg_5821.py \\\n  -v -rs 2>&1 | tee /tmp/dupbridge.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/dupbridge.txt; then\n  echo \"::error::proven-duplicate search BRIDGE contract SKIPPED \u2014 the\
        \ gate did not run\"\n  exit 1\nfi\n"
    - id: db_020_playoffs_leads_with_the_postseason_in_pr
      name: playoffs leads with the postseason in progress (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_playoffs_now_pg.py \\\n  -v -rs 2>&1 | tee /tmp/playoffsnow.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/playoffsnow.txt; then\n  echo \"::error::playoffs search gate SKIPPED \u2014 the gate did not run\"\
        \n  exit 1\nfi\nif grep -qiE \"no tests ran|collected 0 items\" /tmp/playoffsnow.txt; then\n  echo \"::error::playoffs search gate collected\
        \ NOTHING\"\n  exit 1\nfi\nif ! grep -qE \"^=+ 9 passed\" /tmp/playoffsnow.txt; then\n  echo \"::error::playoffs search gate did not pass\
        \ all 9\"\n  exit 1\nfi\n"
    - id: db_021_wild_card_finds_this_week_s_mlb_wild_car
      name: wild card finds this week's MLB Wild Card games (real Postgres)
      if: ${{ !cancelled() && (matrix.group == 'shared' && needs.change-scope.outputs.reuse != 'true') }}
