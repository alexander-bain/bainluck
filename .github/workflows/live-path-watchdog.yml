    - name: Summarize database integration failures
      id: database_integration_summary
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
        INTEGRATION_GROUP: ${{ matrix.group }}
      run: "python - <<'SUMMARY'\nimport json\nimport os\nresults = json.loads(os.environ['STEP_RESULTS'])\nfailed = [name for name, result in results.items() if result.get('outcome') == 'failure']\nlines = ['## Database integration — ' + os.environ['INTEGRATION_GROUP'], '']\nif failed:\n    lines += ['Failed steps:', ''] + ['- `' + name + '`' for name in failed]\nelse:\n    lines += ['No failed steps.']\nwith open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:\n    output.write('\\n'.join(lines) + '\\n')\nSUMMARY\n"

  search-recall:
    needs:
    - change-scope
    - database-integration
    if: always() && needs.change-scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - name: Every database integration group passed
      env:
        SCOPE_RESULT: ${{ needs.change-scope.result }}
        INTEGRATION_RESULT: ${{ needs.database-integration.result }}
      run: "if [ \"$SCOPE_RESULT\" != \"success\" ] || [ \"$INTEGRATION_RESULT\" != \"success\" ]; then\n  echo \"::error::database integration\
        \ incomplete: scope=$SCOPE_RESULT groups=$INTEGRATION_RESULT\"\n  exit 1\nfi\necho \"All database integration groups passed.\"\n"
  frontend-build:
    needs:
    - change-scope
    if: needs.change-scope.outputs.live != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Reused exact-commit test evidence
      if: needs.change-scope.outputs.reuse == 'true'
      working-directory: .
      env:
        REUSE_RUN: ${{ needs.change-scope.outputs.reuse_run }}
        REUSE_ATTEMPT: ${{ needs.change-scope.outputs.reuse_attempt }}
        REUSE_HEAD: ${{ needs.change-scope.outputs.reuse_head }}
        REUSE_BASE: ${{ needs.change-scope.outputs.reuse_base }}
      run: echo "reused run $REUSE_RUN attempt $REUSE_ATTEMPT, tested $REUSE_HEAD, base $REUSE_BASE"
    - uses: actions/checkout@v6
      if: needs.change-scope.outputs.reuse != 'true'
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-node@v7
      if: needs.change-scope.outputs.reuse != 'true'
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v7
      if: needs.change-scope.outputs.reuse != 'true'
      with:
        python-version: '3.11'
    - name: Install dependencies
      if: needs.change-scope.outputs.reuse != 'true'
      run: npm ci
    - name: Cache the Next.js build cache
      if: needs.change-scope.outputs.reuse != 'true'
      uses: actions/cache@v4
      with:
        path: frontend/.next/cache
        key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/lib/**')
          }}
        restore-keys: 'next-${{ hashFiles(''frontend/package-lock.json'') }}-

          next-

          '
    - name: "Build (ESLint gate \u2014 NOT a TypeScript gate, see the step below)"
      if: needs.change-scope.outputs.reuse != 'true'
      run: npm run build
    - name: Unit tests (Jest)
      if: needs.change-scope.outputs.reuse != 'true'
      run: npm run test:ci
    - name: Type check (fail-on-new)
      if: needs.change-scope.outputs.reuse != 'true'
      run: npm run typecheck
  e2e-contract:
    needs:
    - change-scope
    name: Browser-audit contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
    - name: Contract fixtures (no dependencies, no browser, no network)
      run: npm run contract
  veto:
    needs:
    - select
    - backend-tests
    - shard-completeness
    - database-integration
    - search-recall
    - frontend-build
    - e2e-contract
    if: always() && needs.select.outputs.live == 'true' && (needs.backend-tests.result != 'success' || needs.shard-completeness.result != 'success'
      || needs.database-integration.result != 'success' || needs.search-recall.result != 'success' || needs.frontend-build.result != 'success'
      || needs.e2e-contract.result != 'success')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
    - uses: actions/checkout@v6
    - name: Persist the failing source before waiting for provider locks
      run: 'python3 tools/release/veto.py --candidate-sha "$CANDIDATE_SHA" --reason "live-path full-suite watchdog failed"

        '
  rollback:
    needs:
    - select
    - backend-tests
    - shard-completeness
    - database-integration
    - search-recall
    - frontend-build
    - e2e-contract
    - veto
    if: always() && needs.select.outputs.live == 'true' && (needs.backend-tests.result != 'success' || needs.shard-completeness.result != 'success'
      || needs.database-integration.result != 'success' || needs.search-recall.result != 'success' || needs.frontend-build.result != 'success'
      || needs.e2e-contract.result != 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      NOW_ISSUE: ${{ vars.NOW_ISSUE }}
    steps:
    - uses: actions/checkout@v6
    - name: Rollback only the exact failing deployment
      env:
        CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        PROVIDER: heroku
      run: 'python3 tools/release/rollback.py --provider "$PROVIDER" --candidate-sha "$CANDIDATE_SHA" --reason "live-path full-suite watchdog
        failed"

        '
