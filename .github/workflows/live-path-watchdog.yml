  search-recall:
    needs:
    - change-scope
    - database-integration
    if: always() && needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    steps:
    - name: Every database integration group passed
      env:
        SCOPE_RESULT: ${{ needs.change-scope.result }}
        INTEGRATION_RESULT: ${{ needs.database-integration.result }}
      run: "if [ \"$SCOPE_RESULT\" != \"success\" ] || [ \"$INTEGRATION_RESULT\" != \"success\" ]; then\n  echo \"::error::database integration incomplete: scope=$SCOPE_RESULT\
        \ groups=$INTEGRATION_RESULT\"\n  exit 1\nfi\necho \"All database integration groups passed.\"\n"
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: npm ci
    - name: Cache the Next.js build cache
      uses: actions/cache@v4
      with:
        path: frontend/.next/cache
        key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
        restore-keys: 'next-${{ hashFiles(''frontend/package-lock.json'') }}-

          next-

          '
    - name: "Build (ESLint gate \u2014 NOT a TypeScript gate, see the step below)"
      run: npm run build
    - name: Unit tests (Jest)
      run: npm run test:ci
    - name: Type check (fail-on-new)
      run: npm run typecheck
    needs:
    - change-scope
    if: needs.change-scope.result == 'success'
  e2e-contract:
    name: Browser-audit contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
    - name: Contract fixtures (no dependencies, no browser, no network)
      run: npm run contract
    needs:
    - change-scope
    if: needs.change-scope.result == 'success'
  rollback:
    needs:
    - select
    - backend-tests
    - shard-completeness
    - database-integration
    - search-recall
    - frontend-build
    - e2e-contract
    if: always() && needs.select.outputs.live == 'true' && (needs.backend-tests.result != 'success' || needs.shard-completeness.result != 'success' || needs.database-integration.result
      != 'success' || needs.search-recall.result != 'success' || needs.frontend-build.result != 'success' || needs.e2e-contract.result != 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ matrix.provider == 'heroku' && 'heroku-deploy' || 'vercel-production' }}
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      NOW_ISSUE: ${{ vars.NOW_ISSUE }}
    steps:
    - uses: actions/checkout@v6
    - name: Rollback only the exact failing deployment
      env:
        CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        PROVIDER: ${{ matrix.provider }}
      run: 'python3 tools/release/rollback.py --provider "$PROVIDER" --candidate-sha "$CANDIDATE_SHA" --reason "live-path full-suite watchdog failed"

        '
    strategy:
      fail-fast: false
      matrix:
        provider:
        - heroku
        - vercel
