# Full suite starts after the CI run has completed its deploy.
# Generated from existing CI jobs: keep full commands in sync when CI changes.
name: Live-path full-suite watchdog
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
permissions:
  contents: read
  actions: read
  issues: write
  deployments: write
jobs:
  select:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success'
    outputs:
      live: ${{ steps.mode.outputs.live }}
    steps:
    - name: Read exact-run gate mode
      id: mode
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      run: "set -eu\nif ! gh run download \"$RUN_ID\" --repo \"$GITHUB_REPOSITORY\" --name release-loop-mode --dir /tmp/release-loop-mode; then\n  echo \"live=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\npython3 - <<'MODE'\nimport json, os\ntry:\n    with open('/tmp/release-loop-mode/release-loop-mode.json') as source:\n\
        \        mode = json.load(source)\n    live = mode.get('sha') != os.environ['CANDIDATE_SHA'] or mode.get('live') is not False\nexcept (OSError, ValueError,\
        \ TypeError, AttributeError):\n    live = True\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('live=' + str(live).lower() + '\\\
        n')\nMODE\n"
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    needs: select
    if: needs.select.outputs.live == 'true'
    steps:
    - id: scope
      run: echo "scope=full" >> "$GITHUB_OUTPUT"
  backend-tests:
    needs:
    - change-scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    defaults:
      run:
        working-directory: backend
    steps:
    - name: "Frontend-only candidate \u2014 this leg runs no tests (#5007)"
      if: needs.change-scope.outputs.scope == 'frontend'
      working-directory: .
      run: echo "change scope is 'frontend'; shard ${{ matrix.shard }} intentionally ran nothing."
    - uses: actions/checkout@v6
      if: needs.change-scope.outputs.scope != 'frontend'
      with:
        fetch-depth: 0
        filter: blob:none
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-python@v7
      if: needs.change-scope.outputs.scope != 'frontend'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      if: needs.change-scope.outputs.scope != 'frontend'
      run: pip install -r requirements.txt
    - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
      if: needs.change-scope.outputs.scope != 'frontend'
      run: "set -o pipefail\nFILES=\"$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})\"\nif [ -z \"$FILES\" ]; then\n  echo\
        \ \"::error::shard ${{ matrix.shard }} resolved to ZERO test files \u2014 the\"\n  echo \"::error::partition is broken and this leg would pass without testing\
        \ anything.\"\n  exit 1\nfi\necho \"shard ${{ matrix.shard }}/${{ strategy.job-total }}: $(echo $FILES | wc -w) test files\"\npython -m pytest $FILES -q --durations=0\n"
  shard-completeness:
    needs:
    - change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: The shards must cover the whole suite, exactly once each
      run: python scripts/ci_shard.py --verify --of 4
  database-integration:
    strategy:
      fail-fast: false
      matrix:
        group:
        - shared
        - isolated
    needs:
    - change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bl_searchtest
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
        - 56379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SEARCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Verify the gate is actually armed
      run: "python -c \"\nimport os, sys\nurl = os.environ.get('SEARCH_TEST_DATABASE_URL')\nif not url:\n    sys.exit('SEARCH_TEST_DATABASE_URL unset \u2014 the recall\
        \ gate would silently SKIP')\nprint(f'recall gate armed against {url.rsplit(chr(64), 1)[-1]}')\n\"\n"
    - name: Search recall contract (real Postgres)
      if: matrix.group == 'shared'
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_recall_contract.py \\\n  -v -s -rs 2>&1 | tee /tmp/recall.txt\nif grep -qiE \"[0-9]+ skipped\"\
        \ /tmp/recall.txt; then\n  echo \"::error::search recall contract SKIPPED \u2014 the gate did not run\"\n  exit 1\nfi\ngrep -E \"^SEARCH RECALL\" /tmp/recall.txt\
        \ || {\n  echo \"::error::no SEARCH RECALL summary line \u2014 cannot quote the result\"\n  exit 1\n}\n"
    - name: Proven-duplicate search contract (real Postgres)
      if: matrix.group == 'shared'
      run: "set -o pipefail\npython -m pytest tests/integration/test_search_proven_duplicate_pg.py \\\n  -v -rs 2>&1 | tee /tmp/dupsearch.txt\nif grep -qiE \"[0-9]+\
        \ skipped\" /tmp/dupsearch.txt; then\n  echo \"::error::proven-duplicate search contract SKIPPED \u2014 the gate did not run\"\n  exit 1\nfi\n"
    - name: '#10305 one-row anchor-schedule move: lock, fence and reach (real Postgres)'
      if: matrix.group == 'shared'
      run: "set -o pipefail\npython -m pytest tests/integration/test_reconcile_anchor_schedule_member_10305_pg.py \\\n  -v -rs -p no:cacheprovider 2>&1 | tee /tmp/member10305.txt\n\
        if grep -qiE \"[0-9]+ skipped\" /tmp/member10305.txt; then\n  echo \"::error::#10305 member-move gate SKIPPED \u2014 the gate did not run\"\n  exit 1\nfi\n\
        if ! grep -qE \"\\b11 passed\\b\" /tmp/member10305.txt; then\n  echo \"::error::#10305 member-move gate did not pass exactly 11 tests\"\n  exit 1\nfi\n"
    - name: '#10305 D2 participant fill: fences, rollback, restore and the code denylist (real Postgres)'
      if: matrix.group == 'shared'
      run: "set -o pipefail\npython -m pytest tests/integration/test_espn_participant_fill_pg.py \\\n  -v -rs -p no:cacheprovider 2>&1 | tee /tmp/fill10305.txt\n\
