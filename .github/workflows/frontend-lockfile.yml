name: Add a frontend dev dependency to the lockfile (manual)

# The mechanism of record for adding dev dependencies to
# `frontend/package.json` + `frontend/package-lock.json` from a machine with no
# registry access.
#
# History:
#   L2-233 — `jest` + `ts-jest`. The suite existed (116 suites / 1,393 tests)
#            but neither package was declared, so on a clean `npm ci` checkout
#            jest did not exist and the suite could never gate a deploy.
#   L2-234 — `@types/jest`. Undeclared in exactly the same way, with a different
#            consequence: `tsc --noEmit` reports TS2582/TS2304 on every jest
#            global in every test file, which buries real type errors under
#            thousands of lines of noise. See the typecheck census steps below.
#
# WHY THIS EXISTS. Adding a dev dependency is a one-line local command anywhere
# with registry access. This machine has none: its only egress is an agent proxy
# that answers 503 for registry.npmjs.org, and a direct connection is refused at
# the network layer (`npm view` exits 124 on a 30s timeout). Hand-authoring the
# lockfile entries would mean inventing `integrity` hashes, which is the
# fabricated-evidence shape the whole gate exists to make impossible. So the
# resolution happens HERE, by npm, against the real registry, and the files are
# downloaded for commit. (Same reasoning, same shape as `e2e-lockfile.yml`,
# which did this for the browser rail in L2-229.)
#
# HOW TO USE IT.
#   1. Dispatch this workflow with the spec(s) you want added.
#   2. Download the `frontend-dep-manifest` artifact.
#   3. Commit `package.json` and `package-lock.json` TOGETHER. They must land in
#      the SAME commit: a package.json that names a dependency the lockfile does
#      not carry makes `npm ci` exit non-zero, which reds frontend-build and
#      blocks deploy.
#   4. The artifact also carries the exact registry tarball of each package that
#      was added at the top level, so a machine with no registry can unpack it
#      into `node_modules` and reproduce the runner's typecheck. VERIFY IT
#      FIRST against the `integrity` the lockfile records — the tarball is
#      convenience, the lockfile hash is the proof:
#        openssl dgst -sha512 -binary <pkg>.tgz | base64
#
# This workflow only ever writes an artifact. It cannot commit, cannot push, and
# holds no credential beyond `contents: read`.

on:
  workflow_dispatch:
    inputs:
      specs:
        # Space-separated so one dispatch can add a coherent set (a package and
        # its types) rather than leaving the tree in a half-declared state
        # between two runs.
        description: "Space-separated npm specs to add as devDependencies"
        default: "@types/jest@^30.0.0"
        required: true
      allow_version_change:
        # Named, not waved through. The check below fails on ANY pre-existing
        # package whose version moves; this input is the only way past it, and
        # it puts the exact package and both versions on the run record where
        # they can be read back later.
        #
        # First use (2026-08-02, L2-233): `node_modules/semver` — npm
        # re-resolved the hoisted copy 7.7.3 -> 7.8.5 while adding the jest
        # tree. It is already `dev: true` in the lockfile (its consumers are
        # @typescript-eslint and is-bun-module, both eslint tooling), so it
        # reaches no browser bundle and no Vercel runtime, and 7.8.5 is inside
        # every declared caret. That is a reviewed allowance, which is a
        # different thing from a guard that does not notice.
        description: "Comma-separated lockfile paths permitted to change version, e.g. node_modules/semver"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  lockfile:
    name: Resolve the requested specs into the frontend dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # The version ci.yml's frontend-build job pins. Resolving on a
          # different major can emit a lockfile that runner's npm rewrites.
          node-version: "20"

      - name: Record the dependency graph BEFORE
        # The whole risk of this operation is collateral: npm re-resolving
        # unrelated carets and quietly upgrading production dependencies under
        # cover of a test-tooling change. Snapshot every resolved version now so
        # the check below can be an assertion instead of an eyeball.
        run: |
          set -euo pipefail
          node -e '
            const lock = require("./package-lock.json");
            const out = {};
            for (const [p, m] of Object.entries(lock.packages || {})) {
              if (p) out[p] = m.version ?? null;
            }
            require("fs").writeFileSync("/tmp/before.json", JSON.stringify(out));
            console.log(`packages before: ${Object.keys(out).length}`);
          '

      - name: Typecheck census BEFORE
        # The reason a types package is worth a dispatch at all is a number, and
        # a number claimed from the machine that cannot install the package is
        # not measured. Both censuses run HERE, on the same tree, minutes apart.
        #
        # `npm ci` (not `npm install`) so the BEFORE state is exactly what CI
        # and Vercel see. `|| true` because tsc exits non-zero by design when it
        # finds errors, and finding errors is the entire point of this step.
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit --incremental false > /tmp/tsc-before.txt 2>&1 || true
          node scripts/tsc-census.js /tmp/tsc-before.txt /tmp/census-before.json

      - name: Add the requested dev dependencies
        # A real install, not `--package-lock-only`: later steps run the actual
        # suite and the actual typecheck from this tree, and a lock-only resolve
        # cannot prove either. `--ignore-scripts` keeps lifecycle scripts out.
        # `--registry` is stated explicitly so the artifact cannot silently come
        # from whatever a future runner image happens to default to.
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npm install --save-dev --ignore-scripts \
            --registry=https://registry.npmjs.org/ \
            $SPECS
          node -e '
            const pkg = require("./package.json");
            const dev = pkg.devDependencies || {};
            const specs = process.env.SPECS.split(/\s+/).filter(Boolean);
            const names = [];
            for (const spec of specs) {
              // "@types/jest@^30.0.0" -> "@types/jest";  "jest@^30" -> "jest"
              const at = spec.lastIndexOf("@");
              const name = at > 0 ? spec.slice(0, at) : spec;
              names.push(name);
              if (!dev[name]) {
                console.error(`::error::package.json is missing devDependencies.${name} after install`);
                process.exit(1);
              }
              console.log(`devDependencies.${name} = ${dev[name]}`);
            }
            require("fs").writeFileSync("/tmp/added-names.json", JSON.stringify(names));
          '

      - name: No pre-existing dependency may change version
        # This is the "test-tooling change did not become a dependency upgrade"
        # proof. Additions are the point; a changed or removed version is not,
        # and it fails the run rather than riding along in a few thousand lines
        # of generated JSON.
        env:
          ALLOW_VERSION_CHANGE: ${{ inputs.allow_version_change }}
        run: |
          set -euo pipefail
          node -e '
            const before = require("/tmp/before.json");
            const lock = require("./package-lock.json");
            const allowed = new Set(
              (process.env.ALLOW_VERSION_CHANGE || "")
                .split(",").map((s) => s.trim()).filter(Boolean)
            );
            const after = {};
            for (const [p, m] of Object.entries(lock.packages || {})) {
              if (p) after[p] = m.version ?? null;
            }
            const changed = [], allowedChanges = [], removed = [];
            for (const [p, v] of Object.entries(before)) {
              if (!(p in after)) removed.push(p);
              else if (after[p] !== v) {
                (allowed.has(p) ? allowedChanges : changed).push(`${p}: ${v} -> ${after[p]}`);
              }
            }
            const added = Object.keys(after).filter((p) => !(p in before));
            console.log(`added:            ${added.length}`);
            console.log(`changed:          ${changed.length}`);
            console.log(`changed (allowed): ${allowedChanges.length}`);
            console.log(`removed:          ${removed.length}`);
            for (const c of allowedChanges) console.log(`  ALLOWED ${c}`);
            for (const c of changed) console.log(`  CHANGED ${c}`);
            for (const r of removed) console.log(`  REMOVED ${r}`);
            // An allowance that is declared but never used is stale, and a
            // stale allowance is a hole waiting for the next resolve to fall
            // through. Fail on it too.
            for (const p of allowed) {
              if (!allowedChanges.some((c) => c.startsWith(`${p}: `))) {
                console.error(`::error::allow_version_change names ${p}, but it did not change — remove the stale allowance`);
                process.exit(1);
              }
            }
            if (changed.length || removed.length) {
              console.error("::error::adding these specs moved a pre-existing dependency — that is a dependency upgrade, not a test-tooling change. Review it, then name it in allow_version_change if it is genuinely safe.");
              process.exit(1);
            }
          '

      - name: Everything resolved from registry.npmjs.org
        run: |
          set -euo pipefail
          node -e '
            const lock = require("./package-lock.json");
            const foreign = Object.entries(lock.packages || {}).filter(
              ([p, m]) => p && m.resolved && new URL(m.resolved).host !== "registry.npmjs.org"
            );
            for (const [p, m] of foreign) console.error(`  ${p} <- ${m.resolved}`);
            if (foreign.length) {
              console.error("::error::a dependency resolved off registry.npmjs.org");
              process.exit(1);
            }
            console.log("all tarballs resolve to registry.npmjs.org");
          '

      - name: Prove `npm ci` accepts it, from nothing
        # Generating a lockfile and shipping it unverified just moves the guess
        # downstream. `npm ci` is the exact command frontend-build runs, and it
        # exits non-zero when the lock disagrees with package.json — so run it
        # here, from a deleted node_modules, before anyone commits the files.
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci

      - name: Prove the suite actually runs from that clean install
        # If `npx jest` cannot execute against a lockfile-only install, the CI
        # step this feeds would be a red job on every push, and better to learn
        # it here than on master.
        run: |
          set -euo pipefail
          npx jest --ci --watchman=false 2>&1 | tee /tmp/jest.log
          node -e '
            const log = require("fs").readFileSync("/tmp/jest.log", "utf8");
            const suites = /Test Suites:.*?(\d+) total/.exec(log);
            const tests = /Tests:.*?(\d+) total/.exec(log);
            if (!suites || !tests) {
              console.error("::error::could not parse the jest summary — refusing to call this a pass");
              process.exit(1);
            }
            console.log(`collected ${suites[1]} suites / ${tests[1]} tests`);
            if (Number(suites[1]) < 100) {
              console.error("::error::suspiciously few suites collected on a clean install");
              process.exit(1);
            }
          '

      - name: Typecheck census AFTER, and the delta
        # The measured answer to "what did this actually buy". Prints per-code
        # and per-file movement, and fails if the census got WORSE — adding type
        # declarations must not introduce new errors anywhere.
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false > /tmp/tsc-after.txt 2>&1 || true
          node scripts/tsc-census.js /tmp/tsc-after.txt /tmp/census-after.json
          node scripts/tsc-census.js --delta /tmp/census-before.json /tmp/census-after.json
          cp /tmp/tsc-after.txt /tmp/census-after.json /tmp/census-before.json .

      - name: Pack the added packages for a registry-less machine
        # So the development machine can reproduce this exact typecheck rather
        # than take the runner's word for it. Only the top-level additions —
        # transitive deps of a @types package are themselves @types packages and
        # come down with them if needed. `npm pack` fetches the same tarball the
        # lockfile records, so the local side can verify by hash and does not
        # have to trust the artifact.
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          node -e '
            const names = require("/tmp/added-names.json");
            const lock = require("./package-lock.json");
            const out = [];
            for (const n of names) {
              const m = lock.packages[`node_modules/${n}`];
              if (!m) { console.error(`::error::${n} not in lockfile after install`); process.exit(1); }
              out.push({ name: n, version: m.version, integrity: m.integrity, resolved: m.resolved });
              console.log(`${n}@${m.version}  ${m.integrity}`);
            }
            require("fs").writeFileSync("/tmp/tarballs/added.json", JSON.stringify(out, null, 2));
          '
          node -e '
            const { execSync } = require("child_process");
            for (const p of require("/tmp/tarballs/added.json")) {
              execSync(`npm pack ${p.name}@${p.version} --registry=https://registry.npmjs.org/ --pack-destination /tmp/tarballs`, { stdio: "inherit" });
            }
          '
          cp -r /tmp/tarballs ./_tarballs

      - name: Report what was added
        run: |
          set -euo pipefail
          node -e '
            const lock = require("./package-lock.json");
            const before = require("/tmp/before.json");
            const added = Object.entries(lock.packages || {})
              .filter(([p]) => p && !(p in before));
            console.log(`lockfileVersion: ${lock.lockfileVersion}`);
            console.log(`packages added:  ${added.length}`);
            for (const [p, m] of added) console.log(`  ${p}@${m.version ?? "?"}`);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dep-manifest
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/tsc-after.txt
            frontend/census-before.json
            frontend/census-after.json
            frontend/_tarballs
          retention-days: 7
          if-no-files-found: error
