name: TestFlight release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('TestFlight source {0}', inputs.source_sha || github.sha) || 'TestFlight merge intake' }}

# Read every first-parent commit in the push, including changes later reverted.
# PRs run controller contracts; only trusted master dispatches can sign or upload.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact first-parent master commit to release (blank uses current master)
        required: false
        type: string
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Exercise the release controller without credentials or signing
        run: |
          python3 -m pip install 'pytest==9.0.3' 'PyYAML==6.0.3'
          python3 -m pytest tools/tests/test_testflight_release_loop.py -q

  scope:
    needs: contract
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      sources: ${{ steps.scope.outputs.sources }}
      source: ${{ steps.scope.outputs.source }}
    steps:
      # Controller code comes from trusted master, including for earlier batch commits.
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: scope
        name: Start Tuesday and preserve every changed iOS commit
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          SOURCE="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$REQUESTED_SOURCE" ]; then
            SOURCE="$REQUESTED_SOURCE"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ -z "$BEFORE" ] || [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; }; then
            BEFORE="$(git rev-parse "$SOURCE^1")"
          fi
          python3 tools/testflight/release.py scope --before "$BEFORE" --source "$SOURCE"

  dispatch:
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Give every selected merge its own release run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES: ${{ needs.scope.outputs.sources }}
        run: python3 tools/testflight/release.py dispatch --sources "$SOURCES"

  queue:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    outputs:
      token: ${{ steps.lease.outputs.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: lease
        name: Wait for release ownership without dropping another merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.scope.outputs.source }}
        run: python3 tools/testflight/lease.py acquire --source "$SOURCE_SHA"

  release:
    needs: [scope, queue]
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    outputs:
      token: ${{ steps.lease.outputs.token }}
    env:
      # Matches the existing hosted Watch workflow; the app requires Swift 6.2+.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SOURCE_SHA: ${{ needs.scope.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Failed-job-only retries reuse successful queue outputs. They must acquire
      # ownership again with the CURRENT run_attempt before allocating a number.
      - id: lease
        name: Acquire or validate ownership for this actual release attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controller/tools/testflight/lease.py acquire --source "$SOURCE_SHA" --wait-seconds 14400
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.scope.outputs.source }}
          path: source
          persist-credentials: false
      - name: Install App Store Connect JWT support
        run: python3 -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Stage the existing native signing assets outside the checkout
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
        run: python3 controller/tools/testflight/prepare_signing.py
      - id: number
        name: Allocate the next Apple and master build number while owning the lease
        env:
          GH_TOKEN: ${{ github.token }}
          LEASE_TOKEN: ${{ steps.lease.outputs.token }}
        run: |
          python3 controller/tools/testflight/lease.py validate --source "$SOURCE_SHA" --token "$LEASE_TOKEN"
          git -C controller fetch --quiet origin master
          git -C controller show origin/master:'ios/Bain Luck/Bain Luck.xcodeproj/project.pbxproj' > "$RUNNER_TEMP/master-project.pbxproj"
          python3 controller/tools/testflight/release.py reserve --master-project "$RUNNER_TEMP/master-project.pbxproj" --source-project 'source/ios/Bain Luck/Bain Luck.xcodeproj/project.pbxproj'
      - name: Archive, verify, upload and wait for VALID processing
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_BUILD: ${{ steps.number.outputs.build }}
          TESTFLIGHT_VERSION: ${{ steps.number.outputs.version }}
          TESTFLIGHT_SOURCE_ROOT: ${{ github.workspace }}/source
          TESTFLIGHT_SOURCE_SHA: ${{ needs.scope.outputs.source }}
          TESTFLIGHT_LEASE_TOKEN: ${{ steps.lease.outputs.token }}
        run: bash controller/tools/testflight/build.sh
      - name: Preserve the binary and build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/testflight-output/*.ipa
            ${{ runner.temp }}/testflight-output/*.json
            ${{ runner.temp }}/testflight-output/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the temporary signing keychain and private key
        if: always()
        run: |
          if [ -n "${TESTFLIGHT_KEYCHAIN:-}" ]; then
            security delete-keychain "$TESTFLIGHT_KEYCHAIN"
          fi
          rm -rf "$RUNNER_TEMP/testflight-signing"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

  return-lease:
    needs: [queue, release]
    if: always() && (needs.release.outputs.token != '' || needs.queue.outputs.token != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Return this actual attempt's ownership after success or failure
        env:
          GH_TOKEN: ${{ github.token }}
          LEASE_TOKEN: ${{ needs.release.outputs.token || needs.queue.outputs.token }}
        run: python3 tools/testflight/lease.py release --token "$LEASE_TOKEN" --allow-unowned
