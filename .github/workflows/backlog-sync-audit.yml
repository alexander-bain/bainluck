name: Backlog Sync Audit

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  repository-projects: read

jobs:
  audit:
    name: Backlog/GitHub sync audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run advisory audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/audit_backlog_github_sync.py --dry-run | tee backlog-sync-audit.txt
          {
            echo "## Backlog/GitHub Sync Audit"
            echo
            echo '```text'
            cat backlog-sync-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
