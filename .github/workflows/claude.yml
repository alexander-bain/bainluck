name: Claude Code

# Stopped automatic comment/issue triggers: ~40,000+ runs triggered on comments/issues
# and skipped (0 successes; 5 recent failures when "@claude" appeared incidentally in text),
# plus queued workflow objects holding runner/queue slots during merge bursts.
# Keep manual workflow_dispatch only until/unless an interactive @claude bot is needed.
on:
  workflow_dispatch:

jobs:
  claude:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
