name: Claude Code

# Stopped automatic comment/issue triggers per Alex ruling 381: A (#12538):
# measured 2026-11-24 at 977 skipped and 6 failed in the last 24 hours, 16 waiting,
# and no successful run ever — queuing runs on incidental comments/mentions without
# adding value. Keep manual workflow_dispatch only until/unless an interactive bot is needed.
on:
  workflow_dispatch:

jobs:
  claude:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
