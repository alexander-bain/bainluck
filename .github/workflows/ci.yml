        # tables back. Six mutants were measured dead against it, including the
        # two no text assertion can see: judging the payload instead of the pair
        # the row will hold, and dropping the settled gate (which would freeze
        # the score of every delayed game ESPN covers — `SUSPENDED_FUTURE` is
        # the only row that kills it).
        #
        # It shares `bl_searchtest` with every step above, so it is LAST in the
        # job and its double answers a payload for `baseball_mlb` only: a
        # leftover row in another sport adds a loop iteration, and re-feeding
        # this file's own globally-unique external ids a second time would make
        # a correct guard count six refusals instead of three. Measured, not
        # assumed — the unhardened form reads 18 updates / 6 refusals.
        #
        # Same three refusals as the two steps above: a SKIP is what this suite
        # does when it cannot see its database and reads exactly like a pass,
        # ZERO collected is a collection error wearing a green hat, and a short
        # count means something was deselected. The exit code is read for its
        # VALUE (gotcha #54) — 1 is a result, anything else is a harness story.
        run: |
          # `set +e` on purpose: the step runs under `bash -e`, so a red suite
          # would abort HERE and the refusals below would never execute.
          set +e
          python -m pytest \
            tests/integration/test_completed_espn_final_is_not_repoisoned_7147_pg.py \
            -p no:cacheprovider -rA -s --tb=short \
            --junitxml=/tmp/repoison7147-junit.xml 2>&1 | tee /tmp/repoison7147.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "PYTEST EXIT CODE: $RC"
          grep -E "^#7147 PG PASS" /tmp/repoison7147.txt || {
            echo "::error::no #7147 PG PASS line — the pass summary cannot be quoted"
            exit 1
          }
          python - "$RC" <<'PY'
          import sys, xml.etree.ElementTree as ET

          EXPECTED = 14
          rc = int(sys.argv[1])
          try:
              root = ET.parse("/tmp/repoison7147-junit.xml").getroot()
          except Exception as exc:
              sys.exit(f"::error::#7147 PG guard produced no junit report ({exc}) — NOT a pass")
          s = root if root.tag == "testsuite" else root.find("testsuite")
          t, f, e, k = (int(s.get(a, 0)) for a in ("tests", "failures", "errors", "skipped"))
          print(f"tests={t} passed={t - f - e - k} failed={f} errors={e} skipped={k}")
          if t == 0:
              sys.exit("::error::#7147 PG guard collected ZERO tests — NOT a pass")
          if k:
              sys.exit(f"::error::#7147 PG guard SKIPPED {k} test(s) — a skip is never green evidence")
          if t != EXPECTED:
              sys.exit(f"::error::#7147 PG guard ran {t} tests, expected {EXPECTED} — tests were deselected or removed")
          if rc not in (0, 1):
              sys.exit(f"::error::pytest exit {rc} is a harness story, not a result")
          if f or e or rc:
              sys.exit(f"::error::#7147 PG guard RED: {f} failed, {e} errors")
          print("#7147 settled-final write gate GREEN on all", t, "tests")
          PY

      - name: "#7640 stale-rank repair apply/restore round trip (real Postgres)"
        # `scripts/repair_7640_stale_futures_ranks.py` rewrites
        # `futures_outcomes.rank` on ~13,000 open markets under D51(b), which
        # permits the write only because there is a backup and a one-command
        # restore. Four of the five things that grant rests on are decided by a
        # planner and cannot be read off the source: `rank()`'s tie behaviour
        # over a real `Numeric(7,6)` field with a genuine NULL in it,
        # `IS DISTINCT FROM` making a healthy board zero row writes (the whole
        # resumability claim), RETURNING handing back the POST-update rank
        # beside an UNTOUCHED `last_updated`, and — the one the grant turns on —
        # the undo SPARING a row a poller rewrote after the repair.
        #
        # That last one is why `rank` alone cannot carry the test: a poller that
        # re-derives a board arrives at the same number the repair wrote, so
        # "the row still holds what we wrote" is true whether or not anybody
        # touched it. The gate seeds that exact collision and requires the row
        # back out of the server unreverted.
        #
        # LAST in the job and after the #7147 step for the reason that step
        # states: its fixture drops and recreates the schema, so anything it
        # leaves behind is gone before the next run and nothing it seeds can
        # reach a neighbour that has already executed.
        #
        # Same skip-detection as every gate here — a skipped gate reads exactly
        # like a passing one, and this file would skip silently on every other
        # runner in the matrix.
        run: |
          set -o pipefail
          python -m pytest \
            tests/integration/test_repair_7640_rank_roundtrip_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/rankrepair7640.txt
          if grep -qiE "[0-9]+ skipped" /tmp/rankrepair7640.txt; then
            echo "::error::#7640 rank repair round trip SKIPPED — the gate did not run"
            exit 1
          fi
      - name: "#8530 UFC history repair apply/restore round trip (real Postgres)"
        # `scripts/repair_8530_ufc_flipped_history.py` swaps home/away on the
        # 2026-09-26 UFC card's chart history under D51(b): backup first, one-
        # command restore. The swap is `UPDATE … FROM` the backup guarded by a
        # row-tuple `IS NOT DISTINCT FROM` that carries genuine NULLs (most
        # sportsbook rows have no spread), and whether that matches, re-runs as
        # a no-op, and lets the restore spare a row written since is decided by
        # the server. Same skip-detection as every gate here.
        run: |
          set -o pipefail
          python -m pytest \
            tests/integration/test_repair_8530_ufc_history_roundtrip_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/uhistrepair8530.txt
          if grep -qiE "[0-9]+ skipped" /tmp/uhistrepair8530.txt; then
            echo "::error::#8530 history repair round trip SKIPPED — the gate did not run"
            exit 1
          fi
      - name: "#7594 canonical ownership — provision the disposable database"
        # A database of its own, for the reason the #4079 step above gives: this
        # contract builds and drops the tables the take-back touches, and
        # `bl_searchtest` has been populated by eighty steps before it, whose
        # inbound foreign keys make the drop fail outright. Created empty here
        # and thrown away with the runner.
        run: |
          set -o pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import asyncio, asyncpg

          DB = "bl_canonical_own_7594"

          async def go():
              c = await asyncpg.connect(
                  user="postgres", password="postgres", database="postgres",
                  host="localhost", port=5432)
              await c.execute(f'DROP DATABASE IF EXISTS {DB}')
              await c.execute(f'CREATE DATABASE {DB}')
              await c.close()

          asyncio.run(go())
          print(
              "CANONICAL_OWNERSHIP_DATABASE_URL="
              f"postgresql+asyncpg://postgres:postgres@localhost:5432/{DB}"
          )
          PY
          echo "provisioned bl_canonical_own_7594"

      - name: "#7594 the take-back cannot empty a fixture, and the beat takes back the twin (real Postgres)"
        # CERT-3204. The repair holds `FOR UPDATE` row ownership of the canonical
        # through the take-back, and NOTHING CHEAPER CAN SEE THE HAZARD: the
        # sqlite rail the other race tests use serialises writers and ignores
        # `FOR UPDATE` entirely, so those tests pass with the lock, without it,
        # and with a lock that does nothing. Two real sessions tell the three
        # apart — one retires the canonical after the screen and holds it
        # uncommitted, and the take-back is asserted to WAIT.
        #
        # Each ownership case has a strawman beside it: the same interleaving
        # with ownership stubbed out MUST empty the fixture, or the rig is not
        # reproducing the hazard and its partner proves nothing.
        #
        # 12 of the 14 are the FORWARD arm (`_take_back_revived_twins_impl`),
        # added when the beat gained the take-back. They belong on real Postgres
        # for three reasons a sqlite version could not reach: the recall orders
        # on `abs(extract(epoch FROM (…- now())))`, the write takes the same
        # `FOR UPDATE`, and the bank gate is a `to_regclass`.
        #
        # Two of those twelve are CERT-3213's required preservation controls: a
        # doubleheader's second game (6h) and a back-to-back's (23h) sit inside
        # the screen's own ±30h window and MUST survive the arm. Restoring that
        # window as the write's identity turns both red.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_7594_canonical_ownership_pg.py \
            -v -rs 2>&1 | tee /tmp/own7594.txt
          if grep -qiE "[0-9]+ skipped" /tmp/own7594.txt; then
            echo "::error::#7594 ownership contract SKIPPED — the gate did not run"
            exit 1
          fi
          # `[^0-9]` so a future `114 passed` cannot satisfy a gate asking for 14.
          grep -qE "[^0-9]14 passed," /tmp/own7594.txt || {
            echo "::error::#7594 contract did not run all fourteen cases"
            exit 1
          }

      - name: "#7617 delay contract — provision the disposable database"
        # A database of its own, for the reason the #4079 step above gives: this
        # contract creates the six tables the staleness net touches and drops
        # them again, and `bl_searchtest` has been populated by eighty steps
        # before it — `futures_markets` there carries nine inbound foreign keys,
        # so the drop dies with `DependentObjectsStillExist` before a case runs.
        # Created empty here and thrown away with the runner, so it holds nothing
        # but this file's tables and the drop is safe by construction. No
        # sentinel nonce: unlike #4079 this suite never drops a schema it did not
        # create in the same job, and it reads its own variable rather than
        # falling back to `$DATABASE_URL`.
        run: |
          set -o pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import asyncio, asyncpg

          DB = "bl_delay_contract_7617"

          async def go():
              c = await asyncpg.connect(
                  user="postgres", password="postgres", database="postgres",
                  host="localhost", port=5432)
              await c.execute(f'DROP DATABASE IF EXISTS {DB}')
              await c.execute(f'CREATE DATABASE {DB}')
              await c.close()

          asyncio.run(go())
          print(
              "DELAY_CONTRACT_DATABASE_URL="
              f"postgresql+asyncpg://postgres:postgres@localhost:5432/{DB}"
          )
          PY
          echo "provisioned bl_delay_contract_7617"

      - name: "#7617 a delay is not silence (real Postgres)"
        # A marquee NFL game in a fourth-quarter weather delay was classified
        # `suspended` and drawn under the league page's "NO RESULT REPORTED"
        # heading while it was being played. The cause was a column a SQL
        # expression did not select: `win_prob_snapshots` dedups a repeated
        # value onto the row it already wrote, so `MAX(captured_at)` read ESPN's
        # 109 observations across the pause as one, two hours stale.
        #
        # It cannot be a unit test, and that is the specific lesson of the
        # defect rather than a preference: the existing guards in
        # `test_staleness_does_not_end_a_match.py` either assert strings in the
        # query or HAND the net a `last_snap`, and every one of them was green
        # throughout. Only Postgres can answer what that expression returns.
        #
        # Same skip detection as every gate in this job, plus a count: pytest
        # exits 0 when each test skips, and four of the six cases here are
        # controls that pass with OR without the fix — a run that lost the two
        # ship cases would still print a green summary.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_a_delay_is_not_silence_pg_7617.py \
            -v -rs 2>&1 | tee /tmp/delay7617.txt
          if grep -qiE "[0-9]+ skipped" /tmp/delay7617.txt; then
            echo "::error::#7617 delay contract SKIPPED — the gate did not run"
            exit 1
          fi
          # `[^0-9]` so a future `16 passed` cannot satisfy a gate asking for 6.
          grep -qE "[^0-9]6 passed," /tmp/delay7617.txt || {
            echo "::error::#7617 delay contract did not run all six cases"
            exit 1
          }

      - name: "#7878 win-prob evidence collapse — provision the disposable database"
        # Its own database for the reason the #7617 step above gives: the file
        # drops and creates the five tables it touches.
        run: |
          set -o pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import asyncio, asyncpg

          DB = "bl_evidence_collapse_7878"

          async def go():
              c = await asyncpg.connect(
                  user="postgres", password="postgres", database="postgres",
                  host="localhost", port=5432)
              await c.execute(f'DROP DATABASE IF EXISTS {DB}')
              await c.execute(f'CREATE DATABASE {DB}')
              await c.close()

          asyncio.run(go())
          print(
              "EVIDENCE_COLLAPSE_DATABASE_URL="
              f"postgresql+asyncpg://postgres:postgres@localhost:5432/{DB}"
          )
          PY
          echo "provisioned bl_evidence_collapse_7878"

      - name: "#7878 win-prob retention keeps observation evidence (real Postgres)"
        # The 48h collapse merged equal-home runs with no gap bound and kept
        # MIN(id), so 10:00/10:01/12:00 became one row and a chart could no
        # longer show the two unobserved hours honestly. The rule is one SQL
        # statement of window functions over a JSONB tuple; only Postgres can
        # say what it keeps. Skip detection plus a count, as for #7617.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_winprob_evidence_collapse_pg_7878.py \
            -v -rs 2>&1 | tee /tmp/evidence7878.txt
          if grep -qiE "[0-9]+ skipped" /tmp/evidence7878.txt; then
            echo "::error::#7878 evidence collapse SKIPPED — the gate did not run"
            exit 1
          fi
          grep -qE "[^0-9]22 passed," /tmp/evidence7878.txt || {
            echo "::error::#7878 evidence collapse did not run all twenty-two cases (#8514 added the backfilled-row case; the retention-selection blocker added seven selector cases)"
            exit 1
          }

      - name: "#7878 win-prob evidence crosses the history response (real Postgres, real route)"
        # Codex's exact-head review of PR #8438 found the producer's evidence
        # never reached a client: the final `game_state` projection (#6546)
        # stripped it. This gate seeds rows, runs the real retention collapse,
        # GETs /api/events/{id}/history through the real app and reads the
        # served JSON for every evidence kind. Shared `bl_searchtest`, reserved
        # ids, ORM seeding. Skip detection plus a count.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_winprob_evidence_wire_7878_pg.py \
            -v -rs 2>&1 | tee /tmp/wire7878.txt
          if grep -qiE "[0-9]+ skipped" /tmp/wire7878.txt; then
            echo "::error::#7878 wire gate SKIPPED — the gate did not run"
            exit 1
          fi
          grep -qE "[^0-9]4 passed," /tmp/wire7878.txt || {
            echo "::error::#7878 wire gate did not run all four cases (#8514 added the two ESPN backfill cases)"
            exit 1
          }

      - name: "#837 subscription slate — provision the disposable database"
        # Its own database for the reason the #7617 step above gives: this
        # contract creates and drops the six tables the slate predicate joins,
        # and `bl_searchtest` has inbound foreign keys on `futures_markets` that
        # make that drop die with `DependentObjectsStillExist`. Created empty and
        # thrown away with the runner.
        run: |
          set -o pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import asyncio, asyncpg

          DB = "bl_ws_slate_837"

          async def go():
              c = await asyncpg.connect(
                  user="postgres", password="postgres", database="postgres",
                  host="localhost", port=5432)
              await c.execute(f'DROP DATABASE IF EXISTS {DB}')
              await c.execute(f'CREATE DATABASE {DB}')
              await c.close()

          asyncio.run(go())
          print(
              "WS_SLATE_DATABASE_URL="
              f"postgresql+asyncpg://postgres:postgres@localhost:5432/{DB}"
          )
          PY
          echo "provisioned bl_ws_slate_837"

      - name: "#837 the socket does not subscribe to finished sport (real Postgres)"
        # The Polymarket slate was bounded at one end only, so `scheduled` meant
        # "the status updater last wrote scheduled" rather than "not started
        # yet": 1,248 of 1,888 markets on production were events that began more
        # than six hours ago, back to 2026-06-01. 27 of 30 sampled stale tokens
        # have no orderbook at the venue at all, which is what `served=1413/3367`
        # was made of — and the capped token top-up was spending 253 of its 299
        # slots on them while 42 markets on games in progress had no tokens.
        #
        # Postgres answers this one or nobody does, and the two ways of getting
        # it wrong fail in OPPOSITE directions. Too loose and the stale bag
        # stays subscribed. Too broad — the floor written ABOVE the `or_()`
        # instead of inside the `scheduled` arm, which is how this was first
        # drafted — and the clock tests reach live rows as well, so an event
        # still called live goes dark after 24 h and one with no recorded start
        # goes dark at once. Two live-preservation cases hold that end.
        #
        # Skip detection plus a count: most of these cases are controls that
        # pass with OR without the fix, so a run that lost a ship case would
        # still print green. Two ship cases now, one per class — the age floor
        # and the settled-market drop — so the count is what holds them both.
        #
        # THE COUNT IS A PIN AND IT BINDS THE NEXT AUTHOR: adding a case to this
        # file reddens this gate until the number below moves with it. That is
        # the point (it is how a silently-dropped case gets caught), but it means
        # the number is part of the test file's contract, not CI boilerplate.
        # 12 = 7 age-floor cases + 4 settled-market cases + 1 consumer wiring case.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_ws_slate_age_floor_pg_837.py \
            -v -rs 2>&1 | tee /tmp/slate837.txt
          if grep -qiE "[0-9]+ skipped" /tmp/slate837.txt; then
            echo "::error::#837 slate contract SKIPPED — the gate did not run"
            exit 1
          fi
          # `[^0-9]` so a future `112 passed` cannot satisfy a gate asking for 12.
          # `[,[:space:]]` because pytest drops the comma when a run emits no
          # warnings (`12 passed in 3.4s`) — the old `passed,` form was green
          # only by the accident of this file currently raising warnings.
          grep -qE "[^0-9]12 passed[,[:space:]]" /tmp/slate837.txt || {
            echo "::error::#837 slate contract did not run all twelve cases"
            exit 1
          }

      - name: "#7867 a team's Championship Path reads the sport family's roster (real Postgres)"
        # #7867. `_build_related_futures` now refuses a name-matched row when
        # every occurrence of this team's token sits inside a longer name of
        # ANOTHER known club (`Miami` inside `Miami (OH)`, `Giants` inside
        # `Yomiuri Giants`). The candidate pool is family-wide, so the roster
        # that establishes those identities must be read at the family width
        # too — one JOIN on `sports`, still one read — while `team_index` and
        # the logos keep only the event's own league.
        #
        # THE ARM THAT NEEDS A REAL SERVER is that width. The mocked suite
        # answers the roster query by statement text, so a mutant that narrows
        # it back to the league passes every mocked test by construction;
        # measured on this branch it fails 2 of these 3. The third arm asserts
        # the request still makes exactly one roster read.
        #
        # Same skip detection as every gate in this job, and a count so a
        # dropped case cannot print green: 3 = family roster (MLB/NPB/KBO) +
        # NHL/WNBA/NCAAF pages + the one-roster-read arm.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_route_related_futures_team_paths_7867_pg.py \
            -v -rs -s 2>&1 | tee /tmp/teampaths7867.txt
          if grep -qiE "[0-9]+ skipped" /tmp/teampaths7867.txt; then
            echo "::error::#7867 team-paths gate SKIPPED — the gate did not run"
            exit 1
          fi
          grep -qE "[^0-9]3 passed[,[:space:]]" /tmp/teampaths7867.txt || {
            echo "::error::#7867 team-paths gate did not run all three cases"
            exit 1
          }

      - name: "#8430 a Polymarket child reuses the row its sibling holds (real Postgres)"
        # #8430. Each child of one Polymarket game event used to mint its own
        # row whenever the matcher's best candidate was refused — Boyer v
        # Gorzny reached 14 rows, 11 empty and reading LIVE. The create path
        # now asks `_polymarket_group_sibling_event_id` first, which is a
        # predicate over `futures_markets` (group, child scope, one distinct
        # event, not itself) plus #4965's fixture guard against `events`. A
        # session double answers whatever it is handed, so this is the gate.
        #
        # 7 = found + another group + split group + parent-only group + itself
        # + the fixture guard refusing + its control (same row, venue agrees).
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_polymarket_group_sibling_8430_pg.py \
            -v -rs 2>&1 | tee /tmp/groupsibling8430.txt
          if grep -qiE "[0-9]+ skipped" /tmp/groupsibling8430.txt; then
            echo "::error::#8430 group-sibling gate SKIPPED — the gate did not run"
            exit 1
          fi
          grep -qE "[^0-9]7 passed[,[:space:]]" /tmp/groupsibling8430.txt || {
            echo "::error::#8430 group-sibling gate did not run all seven cases"
            exit 1
          }

      - name: "#837 an odds pass releases a sport's game rows before the next sport's call (real Postgres)"
        # #837. `_poll_all_odds` and `_discover_events` each committed once, at
        # the end of the pass. So a live game's `events` row stayed locked from
        # its sport's betting write through every later sport's Odds API call,
        # and the live stamp (500 ms lock_timeout) re-queued for that long.
        # Production measured 55 s on one game behind discovery.
        # Row locks are the subject, so a session double cannot see this: the
        # gate parks a real pass inside the second sport's `get_odds` and tries
        # the stamp's lock from a second connection.
        #
        # 3 = the probe's positive control (a held row reads `locked`) + one arm
        # per pass. Each arm also asserts the pass really wrote `betting` on the
        # row it probes, and that it parked mid-pass.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_a_poll_releases_its_event_rows_per_sport_837_pg.py \
            -v -rs 2>&1 | tee /tmp/persport837.txt
          if grep -qiE "[0-9]+ skipped" /tmp/persport837.txt; then
            echo "::error::#837 per-sport commit gate SKIPPED — the gate did not run"
            exit 1
          fi
          grep -qE "[^0-9]3 passed[,[:space:]]" /tmp/persport837.txt || {
            echo "::error::#837 per-sport commit gate did not run all three cases"
            exit 1
          }

      - name: "#837 a failed sport no longer aborts the sports after it, and the scores loop releases per sport (real Postgres)"
        # #837, the three gaps the per-sport commit above left. (1) A failed
        # statement (production: a 40P01 at 03:05:27Z) left the transaction
        # aborted and every later sport died on PendingRollbackError; both
        # passes now roll back in the per-sport `except`. (2) That rollback
        # expires ORM rows (gotcha #6), so discovery iterates (id, key) pairs.
        # (3) The scores loop commits per sport before the next `get_scores`.
        #
        # 4 = the probe's positive control + the scores-loop arm + one rollback
        # arm per pass. The rollback arms inject a real Postgres error, and the
        # discover arm fails with MissingGreenlet on the ORM-loop mutant.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_a_failed_sport_and_the_scores_loop_release_837_pg.py \
            -v -rs 2>&1 | tee /tmp/rollback837.txt
          if grep -qiE "[0-9]+ skipped" /tmp/rollback837.txt; then
            echo "::error::#837 rollback/scores gate SKIPPED — the gate did not run"
            exit 1
          fi
          grep -qE "[^0-9]4 passed[,[:space:]]" /tmp/rollback837.txt || {
            echo "::error::#837 rollback/scores gate did not run all four cases"
            exit 1
          }

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # CERT-433. The CERT-430 comparison specimen renders a payload the BACKEND
      # builds — `backend/scripts/emit_comparison_specimen.py`, spawned by
      # `__tests__/components/tournamentReskin.test.tsx` — because a fixture that
      # hardcodes the repaired payload cannot fail when its producer is deleted.
      #
      # Pinned rather than left to the runner's ambient `python3`: the image
      # happens to ship one today, and a gate that depends on that is a gate
      # nobody chose.
      #
      # NO `cache: pip` AND NO INSTALL STEP, deliberately. The producer imports
      # zero third-party packages, so this job stays a Node job that can also
      # run one pure script — it does not become a job that installs the backend
      # stack to render one card. That property is fragile enough to be worth a
      # test, and it has one:
      # `backend/tests/test_comparison_specimen.py::
      #  test_the_producer_runs_without_our_third_party_requirements`
      # re-checks it under `-S` in the BACKEND suite, so a new import breaks
      # there, where the fix is, rather than here, where it isn't.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # Item 2 — the ONLY uncached artifact in this workflow. pip is cached by
      # setup-python in both python jobs and npm by setup-node above, so `.next`
      # is what was left. Sequenced after the sharding deliberately: while
      # backend-tests was 8m23s, shaving the 2m12s frontend job bought nothing.
      #
      # `path` is workspace-relative — actions/cache does not inherit
      # defaults.run.working-directory, so `frontend/` is not redundant here.
      #
      # Restore-keys give a partial hit: a source-only change still restores the
      # previous build's cache and Next.js reuses what it can. Never key on the
      # lockfile alone, or the cache goes stale the moment sources change while
      # still reporting a hit.
      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
          restore-keys: |
            next-${{ hashFiles('frontend/package-lock.json') }}-
            next-

      - name: Build (ESLint gate — NOT a TypeScript gate, see the step below)
        run: npm run build

      - name: Unit tests (Jest)
        # L2-233. 116 suites / 1,393 tests that, until this step existed, ran
        # only on an engineer's laptop: no workflow invoked jest, and neither
        # `jest` nor `ts-jest` was even declared in package.json — so `npx jest`
        # after `npm ci` would have resolved nothing. Both halves are fixed in
        # the commit that added this line.
        #
        # AFTER the build since UX-P150, and this reordering is load-bearing.
        # It used to run ahead of it — ~20s here versus ~2min there, so a broken
        # test cost one short run instead of a full build first. That trade
        # stopped being available the moment part of the suite started reading
        # the build OUTPUT rather than the sources:
        #
        #   __tests__/components/shippedCopyBans.test.ts   scans .next/static/chunks
        #   __tests__/capture/usOpenDesktopCapture.test.tsx  needs the compiled CSS
        #   __tests__/capture/golfFieldFloorCapture.test.tsx        "
        #
        # Those three pass on a laptop, where `npm run build` has always been run
        # at some point, and failed here on every push once they existed, because
        # `.next` does not exist yet at this point in a clean runner. The copy
        # scan is explicit that a missing bundle is a FAILURE and not a skip —
        # "the build output exists, or CI has skipped its own gate" — because the
        # defect it was written for was copy that had been "fixed" twice, with
        # render guards, and had never actually shipped. Making it tolerate an
        # absent bundle would restore exactly the blindness it exists to remove,
        # so the step moved instead.
        #
        # Both are still required — this job fails on either.
        #
        # No `--passWithNoTests`, no `continue-on-error`. Those, and the rest of
        # what keeps this from silently becoming decoration, are asserted by
        # frontend/__tests__/lib/ciJestGate.test.ts, plus a workflow-shape
        # fixture in the e2e-contract job below that survives this step being
        # deleted.
        run: npm run test:ci

      - name: Type check (fail-on-new)
        # L2-234. `npm run build` above has never enforced TypeScript:
        # next.config.mjs sets `typescript.ignoreBuildErrors: true` (gotcha
        # #10), so a wrong or missing type deploys green. This is the step that
        # notices.
        #
        # It is a fail-on-new gate, not a clean one. Pre-existing errors are
        # recorded per file in frontend/typecheck-baseline.json (see its
        # `total`; do not hardcode the count here, it ratchets down) and owned
        # by issue #1521; they do not fail the build, and one error more than
        # them does. A clean gate today would red every push until all of them
        # were cleared, and a step that reds every push acquires a `|| true`.
        #
        # The ratchet turns both ways: fixing an error without lowering the
        # baseline also fails, with instructions, so the recorded count cannot
        # drift above the real one and become silent headroom.
        #
        # AFTER the build deliberately — `.next/types/**` is generated route
        # typing that tsconfig includes, so running before it would check a
        # smaller program than a developer does locally and the two censuses
        # would disagree.
        #
        # No `continue-on-error`. That, and the rest of what keeps this from
        # becoming decoration, is asserted by
        # frontend/__tests__/lib/ciTypecheckGate.test.ts, plus a workflow-shape
        # fixture in the e2e-contract job that survives this step being deleted.
        run: npm run typecheck

  e2e-contract:
    # L2-229 Item 1 — the browser-audit rail's fixtures, on ordinary push CI.
    #
    # These are the tests that test the tests: they mutate the workflow, the
    # evaluator, the manifest validator and the redactor, and assert each
    # mutation produces exactly its own red. If they stop failing, every green
    # the rail reports afterwards is worthless — so until now the rail's only
    # always-on gate lived in a MANUAL workflow nobody dispatches on a normal
    # push, and a false-green-fixture regression could ship silently.
    #
    # It is cheap enough to be unconditional: no dependency install, no browser
    # download, no network — `node --test` needs nothing but Node, which is why
    # browser-audit.yml also runs it ahead of any install. ~0.2s of test time.
    #
    # Deliberately NOT `npm ci`: adding an install here would couple every push
    # to the e2e lockfile and to registry availability, which is the opposite of
    # what makes this gate safe to run on everything.
    name: Browser-audit contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend/e2e

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          # Must match browser-audit.yml. Node only globs `--test` arguments
          # from v22, so on 20 the shell has to expand `contract/*.test.js` —
          # quoting it made this suite silently never run in CI (L2-228).
          node-version: "20"

      - name: Contract fixtures (no dependencies, no browser, no network)
        run: npm run contract

  release-required:
    # #4456 — does this master push actually need a HEROKU release?
    #
    # Every master merge used to cycle the dynos, and a dyno cycle kills whatever
    # the workers are mid-way through: the matcher, and the calibration rebuild
    # that takes ~2h and has been killed repeatedly at ~110/128 by a release
    # landing under it. A frontend-only merge has nothing for Heroku to serve
    # differently, so it should cost the backend nothing.
    #
    # THIS JOB FAILS TOWARD RELEASING. Every uncertain branch below emits
    # `required=true`. A missed release is a silent production/master skew that
    # nobody notices for hours; a redundant release costs one dyno cycle. Those
    # are not symmetric, so the tie goes to releasing.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.decide.outputs.required }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the previous commit to diff against; a shallow clone cannot.
          fetch-depth: 0

      - name: Decide whether Heroku must release
        id: decide
        run: |
          set -uo pipefail
          # The decision lives in a script so a guard test can execute it.
          # #7610: and the BASE it decides against lives in one too. Diffing from
          # `github.event.before` stranded a backend delta forever whenever a push
          # did not release — the next push's base moved past it and this gate
          # never saw it again. `ci-deploy-base.sh` returns the deployed sha when
          # it is BELOW the fallback, so the range only ever grows.
          BASE="$(bash .github/scripts/ci-deploy-base.sh \
                    '${{ github.event.before }}' '${{ github.sha }}' \
                   || echo '${{ github.event.before }}')"
          [ -n "$BASE" ] || BASE='${{ github.event.before }}'
          # `|| echo true` is the last fail-safe: if the script itself cannot run,
          # we release.
          REQUIRED="$(bash .github/scripts/heroku-release-required.sh \
                        "$BASE" '${{ github.sha }}' || echo true)"
          case "$REQUIRED" in
            true|false) ;;
            *) echo "unparseable decision '$REQUIRED' — defaulting to release"; REQUIRED=true ;;
          esac
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "release required: $REQUIRED"

  deploy:
    # search-recall added for #1494: the recall gate is deploy-blocking, so the
    # reverted search speed-up cannot re-land without it going green.
    # `backend-tests` stays a BARE job name even though it is now a 4-leg matrix:
    # a matrix dependency is satisfied only when EVERY leg succeeds, so one red
    # shard still blocks the release. Enumerating shard names here would have to
    # be edited every time the matrix changes, and forgetting would silently drop
    # a shard from the deploy gate.
    # shard-completeness is required too — without it a partition that skips
    # files could deploy on a green built from a smaller suite.
    # release-required (#4456) is a GATE, not a test: it decides whether this
    # push needs a Heroku dyno cycle at all. It shares `deploy`'s exact `if`, so
    # the two are never inconsistently skipped, and it fails toward `true`.
    needs: [backend-tests, shard-completeness, search-recall, frontend-build, e2e-contract, release-required]
    # KEEP THIS CONDITION ON ONE LINE. ciTriggerCoverage's "an any-base PR cannot
    # release" assertion matches `if:.*github.event_name == 'push'` with a
    # single-line regex; folding this into a `>-` block scalar hides the
    # event_name/ref guards from it and the suite goes red. That test is the only
    # thing standing between a pull_request run and a Heroku release, so it must
    # stay able to SEE the guard, not merely have the guard be present.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.release-required.outputs.required != 'false'
    runs-on: ubuntu-latest
    # THRU-F: the group SERIALIZES releases; it must not KILL one mid-release.
    #
    # Two different things can be cancelled here, and only one of them is safe:
    #
    #   1. A PENDING deploy — a run that has the group's queue slot but has not
    #      started. Cancelling it is free and is what keeps a merge burst from
    #      turning into one Heroku build per merge.
    #   2. An IN-PROGRESS deploy — a run inside `git push heroku`. That push is
    #      not a handshake: Heroku streams the whole build and release back over
    #      it, so the job sits "in progress" for MINUTES while production is
    #      actually being changed.
    #
    # `cancel-in-progress: true` cancelled BOTH. Killing (2) does not stop the
    # Heroku side — once the ref moves, the build and release run to completion
    # server-side — it only removes our half of the conversation. The release
    # still lands, the run reads `cancelled`, and every line of reconciliation
    # below (the rejection branch, the ancestry re-read, the fail-closed refusal)
    # is skipped, because there is no longer a job to run it. A deploy we cannot
    # observe or adjudicate is worse than a deploy that waits.
    #
    # Setting it to `false` keeps (1) and drops (2): cancellation of a PENDING
    # job is not governed by this flag at all. A concurrency group holds exactly
    # one pending job, and a newly queued one always cancels the previously
    # pending one — that coalescing is what we wanted from the flag, and we keep
    # it for free. So a burst of ten merges still costs at most two Heroku
    # builds (the one already running, then the newest queued sha), not ten.
    #
    # Release SELECTION is then made once, explicitly, by the never-backwards
    # guard in the step below — which reads what is actually LIVE and skips when
    # something newer is already deployed. That is one selection rule, applied
    # when the slot is held, instead of two racing ones. `cancel-in-progress`
    # was the second, blind selector: it chose by arrival time, could not see
    # Heroku at all, and its only lever was to kill.
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy to Heroku (never-backwards guarded)
        run: |
          # Never-backwards guard (L2-57, reference point repaired for #3171).
          #
          # The hazard is real: the concurrency group above only ever cancels a
          # deploy that is still QUEUED, so an OLDER commit's re-run whose deploy
          # starts AFTER a newer commit already released is never cancelled and
          # would rewind production (bitten twice: v3320=older landed after
          # v3319=newer). Serialization orders the releases; it does not decide
          # which ones SHOULD release. That decision is this guard's, and this
          # guard's alone — see the THRU-F note on the concurrency block.
          #
          # The original guard answered it by asking "am I the origin/master
          # tip?" — the wrong reference, because the tip is not what is live.
          # When merges land faster than CI completes, no run is still the tip by
          # the time its deploy job starts, so EVERY deploy skipped: production
          # sat 80 minutes and ten merge commits behind master with certified
          # ships undeployed, every run green, nothing released (#3171).
          #
          # Ask what the hazard actually poses instead: is something NEWER
          # already live? Skip only when Heroku's master IS this commit (nothing
          # to do) or a strict DESCENDANT of it (genuinely newer). Otherwise
          # deploy — pushing a descendant of what is live is forward progress and
          # cannot clobber anything.
          #
          # Gotcha #9: the check lives inside the run block, not a step-level
          # `if` with secrets.
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY not set — skipping deploy"
            exit 0
          fi
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/bainluck.git 2>/dev/null || true

          # `|| true` keeps an unreadable live ref from reddening the job (and
          # holds under `-o pipefail` too); it falls through to the push, where
          # git adjudicates it for us.
          LIVE="$(git ls-remote heroku refs/heads/master 2>/dev/null | cut -f1 || true)"
          git fetch --quiet heroku refs/heads/master 2>/dev/null || true
          if [ -z "$LIVE" ]; then
            echo "Could not read Heroku's live commit — deferring to the push below."
          elif [ "$LIVE" = "$GITHUB_SHA" ]; then
            echo "Skipping deploy: $GITHUB_SHA is already the live commit."
            exit 0
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE"; then
            echo "Skipping deploy: this run's commit ($GITHUB_SHA) is an ancestor of"
            echo "the live commit ($LIVE) — something newer is already deployed."
            echo "An older re-run can no longer clobber a newer deploy."
            exit 0
          else
            echo "Deploying $GITHUB_SHA over live commit ${LIVE:-<unknown>}."
          fi

          # The check above is a read followed by a write, so it cannot close the
          # race by itself. Push WITHOUT --force and let git refuse a
          # non-fast-forward: if a newer deploy won the race in between, the
          # server rejects us instead of quietly rewinding production. Push the
          # SHA explicitly rather than the local `master` branch, so what gets
          # released is the commit this run actually gated.
          if git push heroku "$GITHUB_SHA:refs/heads/master"; then
            echo "Deployed $GITHUB_SHA."
            exit 0
          fi

          # Rejected. Do NOT force by reflex. A rejection can perfectly well mean
          # a NEWER deploy won the race, and forcing then rewinds production —
          # the exact incident this guard exists to prevent. So establish what is
          # live and whether we can REASON about it before doing anything, and
          # treat "cannot prove" as a refusal rather than as permission.
          LIVE_NOW="$(git ls-remote heroku refs/heads/master 2>/dev/null | cut -f1 || true)"
          git fetch --quiet heroku refs/heads/master 2>/dev/null || true
          # Ancestry is only meaningful for a commit whose object we actually
          # hold. `merge-base --is-ancestor` on a commit we never fetched exits
          # non-zero, which reads identically to a truthful "no" — so ask
          # directly instead of inferring it from a failure.
          HAVE_LIVE=0
          if [ -n "$LIVE_NOW" ] && git cat-file -e "${LIVE_NOW}^{commit}" 2>/dev/null; then
            HAVE_LIVE=1
          fi

          if [ "$HAVE_LIVE" = 1 ] && git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE_NOW"; then
            echo "Superseded mid-push: $LIVE_NOW is newer than $GITHUB_SHA. Leaving it."
            exit 0
          fi

          if [ "$HAVE_LIVE" = 1 ] && git merge-base --is-ancestor "$LIVE_NOW" "$GITHUB_SHA"; then
            # The live commit is provably BEHIND us, so a fast-forward does exist
            # and the rejection was transient. Retry as a fast-forward — never as
            # a force. A second rejection reddens the job under `-e`, which is
            # the honest outcome: somebody should look.
            echo "Live commit $LIVE_NOW is behind $GITHUB_SHA and a fast-forward exists; retrying."
            git push heroku "$GITHUB_SHA:refs/heads/master"
            echo "Deployed $GITHUB_SHA."
            exit 0
          fi

          # What is left is either genuinely diverged history, or a live commit
          # whose ancestry we cannot establish. A force push in EITHER state can
          # rewind a newer production, so both fail closed.
          #
          # One exception, and only one: when this commit IS GitHub's current
          # master tip there is no newer commit for a force to lose, so a history
          # rewrite can still self-heal without a human. Note the direction of
          # the test — the tip is used here to NARROW when forcing is allowed,
          # never to decide whether to deploy. That inversion is #3171.
          ORIGIN_TIP="$(git ls-remote origin refs/heads/master 2>/dev/null | cut -f1 || true)"
          if [ -n "$ORIGIN_TIP" ] && [ "$ORIGIN_TIP" = "$GITHUB_SHA" ]; then
            echo "Push rejected and the live commit (${LIVE_NOW:-<unreadable>}) has no provable"
            echo "ancestry with $GITHUB_SHA — but this commit IS origin/master's tip, so there is"
            echo "no newer commit to rewind past. History diverged; forcing."
            git push heroku "$GITHUB_SHA:refs/heads/master" --force
            exit 0
          fi

          echo "REFUSING to deploy. The push was rejected, the live commit"
          echo "(${LIVE_NOW:-<unreadable>}) has no provable ancestry with $GITHUB_SHA, and this"
          echo "commit is not origin/master's tip (${ORIGIN_TIP:-<unreadable>}). Forcing from here"
          echo "could rewind a newer production, so this fails closed. Deploy by hand once the"
          echo "divergence is understood."
          exit 1
