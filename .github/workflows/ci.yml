        # judgement and the reader's row sit `sports_needing_scores`,
        # `_get_espn_covered_sports()`, #1981's `external_id_currency` and two
        # separate write statements against two real tables. A guard that is
        # right about a row the loop never reaches protects nothing, and a
        # refusal that is computed and then written anyway is invisible to a
        # source assertion.
