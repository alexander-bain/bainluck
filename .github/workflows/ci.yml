name: CI

on:
  # NO `branches:` FILTER ON pull_request — deliberate, and load-bearing.
  #
  # It used to read `pull_request: branches: [master]`, which does NOT mean
  # "PRs into master get CI". It means "ONLY PRs into master get CI" — a PR
  # based on any other branch matches no trigger and gets NO RUN AT ALL. Not a
  # pending check, not a red one: an empty checks list, which reads as "nothing
  # to wait for" in exactly the place a reviewer looks for permission to merge.
  #
  # Two named failures, both in one week, both on stacked lane branches:
  #
  #   1. PR #1943 (`lane1/q363` -> `lane1/q362`) reported `mergeStateStatus:
  #      DIRTY` and no checks. The base was retargeted to master; GitHub emits
  #      `edited` on a retarget and this workflow listens to opened/synchronize/
  #      reopened, so retargeting SCHEDULED NOTHING. A close+reopen is what
  #      finally produced a run.
  #   2. PR #1950 (`lane1/q365`, cut from `lane1/q364`) hit the same wall. Only
  #      gitleaks reported, because `gitleaks.yml` has a BARE `pull_request:`
  #      with no branch filter — the accidental control that proves the cause
  #      is the filter here and not anything about the branches themselves.
  #
  # The workaround (retarget, then close+reopen) was rediscovered from scratch
  # both times, because the symptom — a green-looking PR with no checks — does
  # not point at a trigger. Removing the filter deletes the class: every PR gets
  # a run regardless of base, and a stacked branch can never again be merged on
  # the strength of checks that were never scheduled.
  #
  # Deploy is unaffected. The `deploy` job is separately gated on
  # `github.ref == 'refs/heads/master' && github.event_name == 'push'`, so a PR
  # into any base still cannot release — see the job's own comment. The `push:`
  # filter below stays master-only so branch pushes do not double-run CI
  # alongside their own PR.
  #
  # Guarded by `frontend/e2e/contract/ciTriggerCoverage.contract.test.js`.
  pull_request:
  push:
    branches: [master]

jobs:
  # Queue 312 — sharded because this job WAS the merge-to-deploy path: 8m23s of a
  # 9m31s run (measured, run 31436687919), with every other job finishing minutes
  # earlier. Four legs of ~113s each make frontend-build the long pole instead.
  #
  # The split is computed, not configured. `scripts/ci_shard.py` enumerates the
  # collected test files and assigns each to exactly one shard; there are no path
  # globs to maintain and no way for a new test file to match none of them. The
  # `shard-completeness` job below proves that claim on every run against pytest's
  # own collection — read its header for why that check is not optional.
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs even when one fails. With fail-fast the first red
      # cancels its siblings, so a run that broke three shards reports one and
      # you re-discover the others one push at a time.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend

    steps:
      # THE MUTATION-RESIDUE SCAN NEEDS A MERGE BASE, AND THE DEFAULT CHECKOUT
      # DOES NOT HAVE ONE.
      #
      # `tests/test_mutation_guard.py` runs `scan_mutation_residue.py`, whose
      # Pass B diffs `origin/master...HEAD`. On a PUSH to master that resolves
      # and the job is green; on a PULL REQUEST, checkout lands a detached merge
      # ref at depth 1, `origin/master` does not exist, and git returns 128 —
      # which the scanner reported as exit 1, the SAME code it uses for "residue
      # found". Every PR in the repo failed shard 3 identically, with a message
      # that read like a real finding (2026-08-24: #2145, #2146, #2151).
      #
      # `filter: blob:none` is what makes the full graph affordable: the pack is
      # ~850 MiB, but `git diff --name-only` needs commits and TREES only, so
      # blobs stay on the server and are fetched lazily if something else asks.
      # `fetch-depth: 0` alone would pull the whole 850 MiB on all four shards.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # `strategy.job-total` rather than a literal 4: the matrix list is then
        # the single place the shard count is written, so growing it to 5 cannot
        # leave a stale divisor here silently running the wrong partition.
        #
        # -q against pytest.ini's `addopts = -v`: verbosity is summed, so the
        # old `tests/ -v` here actually ran at verbosity 2. This lands at 0 —
        # progress dots, with --tb=short preserved for real failures.
        #
        # `--durations=0` is what keeps the BALANCE HINTS honest, and it is not
        # decoration. `scripts/ci_shard.py` packs the shards LPT-greedy against
        # measured per-file seconds in `ci_shard_durations.json`; a file with no
        # measurement is packed at the flat DEFAULT_WEIGHT guess instead. That
        # file was last recorded by hand on 2026-08-10 and by 2026-09-01 it
        # covered 599 of 1,061 test files — so 44% of the suite, and roughly
        # two thirds of the packer's total weight budget, was a constant rather
        # than a measurement. The packer was balancing a fiction, and the shards
        # it produced ran 338s / 247s / 244s / 221s at p50 (n=604 runs): the job
        # waits for the slowest leg, so 79s of every run at p50 and 114s at p90
        # was pure imbalance — 13.0 hours of CI wall clock over 30 days.
        #
        # A hint file that can only be refreshed by remembering to refresh it
        # goes stale again, and the staleness is silent: the partition stays
        # total and disjoint, CI stays green, and only the clock knows. So every
        # run now emits the measurement its own next partition needs, and a
        # refresh is a log download rather than a local suite run:
        #
        #   python scripts/ci_shard.py --record <(cat shard1.log ... shard4.log)
        #
        # Recording from the RUNNER's clock rather than a laptop's is not a
        # convenience either. Local wall clock is ~3.5x the runner's on this
        # suite and the ratio is not uniform across files — integration tests
        # stretch far more than unit tests — so weights recorded locally
        # mis-rank files against each other and pack a worse partition than the
        # runner's own numbers do.
        #
        # Cost: pytest suppresses sub-5ms entries, so this adds a bounded tail
        # of a few thousand lines to a log that is already ~100 KB. It changes
        # no test, no selection and no exit code.
        run: |
          set -o pipefail
          FILES="$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})"
          if [ -z "$FILES" ]; then
            echo "::error::shard ${{ matrix.shard }} resolved to ZERO test files — the"
            echo "::error::partition is broken and this leg would pass without testing anything."
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ strategy.job-total }}: $(echo $FILES | wc -w) test files"
          python -m pytest $FILES -q --durations=0

  # Item 1.4 — the assertion that makes sharding safe to trust.
  #
  # A sharded suite has one failure mode that no red can announce: a test file
  # that no shard owns is never run, and CI reports green having tested less
  # than it did yesterday. The green is indistinguishable from a healthy one,
  # which is why this cannot be left to code review of a glob list.
  #
  # So: ask pytest what it collects, ask ci_shard.py what it assigns, and require
  # the two sets to be equal — plus pairwise-disjoint shards, so nothing is
  # double-run either. Fails loudly and blocks deploy.
  #
  # Its own job, deliberately: it needs only a collection (~2s) rather than a
  # test run, so it finishes long before the shards and never joins the critical
  # path. Cheap enough that there is no argument for sampling it.
  shard-completeness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: The shards must cover the whole suite, exactly once each
        # Keep --of in step with the matrix above. A mismatch is not a
        # correctness hole (the partition is total for any N) but it would
        # report balance for a split nobody runs.
        run: python scripts/ci_shard.py --verify --of 4

  # #1494 — the search RECALL gate.
  #
  # Separate from backend-tests because it needs a real Postgres. LAT-P002 was
  # reverted (f98d8104) when 3 of 8 production queries came back with ZERO
  # futures, and its gold-set recall criterion was listed OWED and never run —
  # because no rail existed to run it on. Every other search test mocks the DB
  # session, so the WHERE clause never touches data and this whole defect class
  # was unguarded on a p1 surface. This job is that rail, and it is
  # deploy-blocking (see `deploy.needs`).
  search-recall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bl_searchtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # asyncpg URL for the test's own engine...
      SEARCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest
      # ...and for the app module's import-time engine, so it points at
      # localhost and skips the non-local SSL branch in services/database.py.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the gate is actually armed
        # A skipped recall gate is indistinguishable from a passing one, which
        # is exactly how criterion 3 stayed "owed" across two cycles. Fail loudly
        # if the DB never came up rather than let the job go green on skips.
        run: |
          python -c "
          import os, sys
          url = os.environ.get('SEARCH_TEST_DATABASE_URL')
          if not url:
              sys.exit('SEARCH_TEST_DATABASE_URL unset — the recall gate would silently SKIP')
          print(f'recall gate armed against {url.rsplit(chr(64), 1)[-1]}')
          "

      - name: Search recall contract (real Postgres)
        # -s so the "SEARCH RECALL n/n" line reaches the job log: #1494's
        # acceptance is "RUN, with output quoted", and a gate whose result
        # nobody can read is the same as a gate nobody ran.
        #
        # One run, tee'd, then checked for skips — pytest exits 0 when every
        # test skips, and a silently-skipped gate reads exactly like a passing
        # one. That is the failure mode this whole job exists to end, so it is
        # not allowed to recur in the job's own plumbing.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_search_recall_contract.py \
            -v -s -rs 2>&1 | tee /tmp/recall.txt
          if grep -qiE "[0-9]+ skipped" /tmp/recall.txt; then
            echo "::error::search recall contract SKIPPED — the gate did not run"
            exit 1
          fi
          grep -E "^SEARCH RECALL" /tmp/recall.txt || {
            echo "::error::no SEARCH RECALL summary line — cannot quote the result"
            exit 1
          }

      - name: Provenance enum contract (real Postgres)
        # C-ADHOC-PROV-CORE. The receiver accepted `play` while the migration's
        # enum declared six values without it, and the route specimen STORED it
        # and COMMITTED — because the recording double does not enforce
        # PostgreSQL's enum type. Against a real database every Play interaction
        # would have been rejected at commit, in production, on the kid surface.
        #
        # An ORM will hand PostgreSQL any string; the TYPE is what says no. So
        # this gate cannot be a unit test, a mock session, or a source
        # assertion — all three were green while the defect was live. It needs
        # the service container.
        #
        # Same skip-detection as the two gates around it: pytest exits 0 when
        # every test skips, so a gate that silently did not run is
        # indistinguishable from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_provenance_enum_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/provenance.txt
          if grep -qiE "[0-9]+ skipped" /tmp/provenance.txt; then
            echo "::error::provenance enum contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Futures price writer contract (real Postgres)
        # #2199. The refresher shipped with 19,906 tests green and its first live
        # run wrote ZERO snapshots — permanently, by construction. Its writer
        # resolved outcomes with `is_winner IS NULL` against a non-nullable
        # column defaulting to FALSE, so the predicate matched 0 of 10,804
        # production rows.
        #
        # The only test covering it asserted the module's SOURCE TEXT
        # (`assert "is_winner IS NULL" in _MODULE_SRC`) — a grep that passes iff
        # the bug is present and cannot fail when the predicate matches nothing.
        # A source assertion pins an intent; it never observes a write. This gate
        # seeds an outcome the way production seeds it and asserts a row lands.
        #
        # Real Postgres because `_write_prices` builds its INSERT with `pg_insert`
        # (no other dialect compiles it) and because the defect is a writer/data
        # contract split — every instrument not touching real rows said green.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_futures_price_refresh_writes_pg.py \
            -v -s -rs 2>&1 | tee /tmp/futures_writer.txt
          if grep -qiE "[0-9]+ skipped" /tmp/futures_writer.txt; then
            echo "::error::futures price writer contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Movement window contract (real Postgres)
        # item 12 / lane1 Q482. `probability_change_24h` froze: all four writers
        # store a PER-WRITE delta and nothing recomputed it over a window, so a
        # row that stops being written serves its last delta forever under a name
        # that promises a day. Measured on production 2026-08-31: 1,604,840 of
        # 2,186,901 non-null deltas were older than 24 h, and 17 of the 20 rows
        # on `/api/futures/movers` — which publishes `timeframe_hours: 24` — had
        # not been touched in 24 h, the oldest by six weeks.
        #
        # Real Postgres, because every assertion here is one a double cannot
        # make: the `now() - interval` boundary between kept and retired, the
        # `ORDER BY abs(...) DESC ... LIMIT` inside an `IN (SELECT ...)` that
        # decides the first run clears the VISIBLE lie rather than a random
        # slice, and a `NOT EXISTS` correlated against rows the same transaction
        # just wrote. Above all it asserts, on rows, the identity
        # `max_movement_24h == MAX(ABS(change))` that LAT-P108 proved
        # /api/futures/movers' pool bound rests on — the sibling unit file
        # (`tests/test_movement_window.py`) pins the wiring and cannot see any
        # of it.
        #
        # Same skip-detection as the gates around it: pytest exits 0 when every
        # test skips, so a gate that silently did not run is indistinguishable
        # from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_movement_window_pg.py \
            -v -s -rs 2>&1 | tee /tmp/movement_window.txt
          if grep -qiE "[0-9]+ skipped" /tmp/movement_window.txt; then
            echo "::error::movement window contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: futures_outcomes grade schema parity (real Postgres)
        # CERT-521. `is_winner` was widened to nullable so a metadata-built test
        # database could finally express "nobody graded this" — and the widening
        # alone was a REGRESSION, because production's DDL is
        # `boolean NULL DEFAULT false` while the model carried only a client-side
        # `default=False`. A raw INSERT omitting the column would have stored NULL
        # here and FALSE in production, and raw INSERT is how every gate in this
        # job seeds. A gate could then manufacture ungraded truth out of a field
        # it forgot to name.
        #
        # Real Postgres because a DEFAULT is applied by the SERVER. Four green
        # metadata guards sat over `is_winner BOOLEAN,` and none of them could
        # see the missing clause; only asking a database can tell what the
        # emitted DDL actually does.
        #
        # Same skip-detection as the gates around it: pytest exits 0 when every
        # test skips, so a gate that silently did not run is indistinguishable
        # from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_futures_outcome_grade_schema_parity_pg.py \
            -v -s -rs 2>&1 | tee /tmp/grade_parity.txt
          if grep -qiE "[0-9]+ skipped" /tmp/grade_parity.txt; then
            echo "::error::futures_outcomes grade schema parity SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Odds-enrichment equivalence (real Postgres)
        # LAT-P030/#1494. The odds enrichment stage was 84-95% of every slow team
        # query (measured 6,724ms of 12,182ms) because DISTINCT ON cannot skip: it
        # read the FULL snapshot history of every event on the page. The rewrite
        # reads one row per (event, bookmaker) instead — 36x faster, and only safe
        # if the rows are identical. LATERAL / WITH RECURSIVE are Postgres-only, so
        # this needs the service container; it cannot run in the unit job.
        #
        # Same skip-detection as the recall gate above, for the same reason: pytest
        # exits 0 when every test skips, so a gate that silently did not run is
        # indistinguishable from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_search_odds_enrichment_equivalence.py \
            -v -s -rs 2>&1 | tee /tmp/enrichment.txt
          if grep -qiE "[0-9]+ skipped" /tmp/enrichment.txt; then
            echo "::error::odds-enrichment equivalence SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Bookmaker-count equivalence (real Postgres)
        # LAT-P163/#2379. The same class as the odds-enrichment gate above, one
        # table over: `count(DISTINCT bookmaker) GROUP BY outcome_id` cannot skip
        # either, so the related-futures build read every snapshot row of every
        # outcome on the page — measured 365,275 index entries and 68,657 heap
        # fetches to produce 300 integers whose maximum was 7. The loose-index-scan
        # rewrite is only safe if the counts are IDENTICAL, and the two forms share
        # no code, so an executing server is the only thing that can grade it.
        #
        # It is also the only thing that can grade the two mechanisms the rewrite
        # rests on: `CAST($1 AS integer[])` resolving the bound array's type under
        # asyncpg, and a WITH RECURSIVE correlated to its left side. No mock
        # session has a type resolver.
        #
        # Same skip-detection as every gate in this job, for the same reason:
        # pytest exits 0 when every test skips, so a gate that silently did not
        # run is indistinguishable from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_bookmaker_count_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/bookmaker_count.txt
          if grep -qiE "[0-9]+ skipped" /tmp/bookmaker_count.txt; then
            echo "::error::bookmaker-count equivalence SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Pre-match prior equivalence (real Postgres)
        # LAT-P222/#3030. Third instance of the class the two gates above cover:
        # a correlated bound the planner cannot evaluate until it holds the row.
        # The ux/1036 read joined `win_prob_snapshots` back to `events` for
        # `commence_time`, so it probed `events_pkey` 24,528 times to return 53
        # rows — 86% of the whole `events` stage of a cold Discover build. The
        # caller was already holding every one of those cutoffs.
        #
        # Real Postgres because `unnest` of two arrays, CROSS JOIN LATERAL and
        # DISTINCT ON have no other dialect, and because the risk is not the
        # latency: the kickoff bound is the only thing stopping a settled market's
        # ~100% winner price from being printed on a finished card as what the
        # market thought BEFORE the game. This gate seeds readings on both sides
        # of kickoff and proves the rewrite returns exactly what the join did —
        # then proves the seed can tell a dropped bound apart, so a green here is
        # a statement about the bound and not about the fixture.
        #
        # Same skip-detection as every gate in this job, for the same reason:
        # pytest exits 0 when every test skips, so a gate that silently did not
        # run is indistinguishable from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_prematch_prior_lateral_equivalence_pg.py \
            -v -s -rs 2>&1 | tee /tmp/prematch_prior.txt
          if grep -qiE "[0-9]+ skipped" /tmp/prematch_prior.txt; then
            echo "::error::pre-match prior equivalence SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Kalshi cliff-drain bind contract (real Postgres)
        # #1884. The drain shipped with 39 green unit tests and threw
        # asyncpg.DataError on the FIRST statement of every run: it bound its
        # cold-start watermark as an ISO string into a timestamptz comparison.
        # asyncpg refuses that; psycopg2 would have cast it silently. No unit
        # test could see the defect, because the session double discarded
        # `params` and the one test that read the bind compared it against the
        # same constant the production line binds.
        #
        # Only a real driver enforces a bind type, so this gate lives here.
        # Same skip-detection as the two gates above, for the same reason.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_kalshi_cliff_bind_contract.py \
            -v -s -rs 2>&1 | tee /tmp/cliffbind.txt
          if grep -qiE "[0-9]+ skipped" /tmp/cliffbind.txt; then
            echo "::error::cliff-drain bind contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: CREATE-wave INSERT bind contract (real Postgres)
        # Queue 380 / Fable's ruling 2026-08-20: "a dry run gates only what it
        # executes." The 328-game CREATE wave (#1947/#1796) died at FOUR depths
        # behind FOUR green gates — #2003 (statpal absorber), #2013
        # (AmbiguousParameterError: :truth_id inferred as two different types and
        # cast in neither), #2023 (espn_id minting writer), #2026 (DataError:
        # commence_time bound as an ISO string; CAST(... AS timestamptz) does not
        # help, because asyncpg type-checks the PYTHON argument before the
        # statement reaches the server).
        #
        # Two of those four are pure bind-type defects, and NOTHING upstream
        # could see either: the dry run is green because the dry run never
        # executes the INSERT, and the unit suite's session double reads the bind
        # dict as plain Python, which accepts both. Only a real driver enforces a
        # bind type, so this gate lives here beside the cliff-drain one.
        #
        # The file is two-armed on purpose — it reverts each fix and asserts the
        # driver RAISES — so a green run means red-first was proved rather than
        # that nothing objected. Same skip-detection as the gates above.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_create_wave_insert_bind_contract.py \
            -v -s -rs 2>&1 | tee /tmp/createbind.txt
          if grep -qiE "[0-9]+ skipped" /tmp/createbind.txt; then
            echo "::error::CREATE-wave INSERT bind contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Calibration mode-price source scope (real Postgres)
        # #2098 / ruling 125, cert C-2098-SOURCE-1 §3d. `vm_id` is source-blind
        # on its `e:` arm, so two sources on one event share it; `mode_prices`
        # grouped and joined on `vm_id` ALONE, and one source's modal price
        # therefore DELETED the other source's legs at that price (measured:
        # 4 Polymarket legs deleting 23 Kalshi legs on e:14887630).
        #
        # §3d requires this NOT be a string assertion on the SQL — string
        # assertions on this module's frozen SQL have already produced one false
        # sense of coverage. The claim is relational, so it needs a fixture with
        # one event_id reachable from two sources, and that needs the service
        # container. It runs LAST in this job because it create_all/drop-free
        # seeds and then deletes its own rows.
        #
        # The file is two-armed like the CREATE-wave gate above: it also
        # EXECUTES the reverted (pre-fix) SQL and asserts the suppression comes
        # back, so a green run means red-first was proved rather than that
        # nothing objected. Same skip-detection as every gate in this job.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_calibration_mode_price_source_scope_pg.py \
            -v -s -rs 2>&1 | tee /tmp/modescope.txt
          if grep -qiE "[0-9]+ skipped" /tmp/modescope.txt; then
            echo "::error::calibration mode-price source scope SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Calibration mode-price source scope, peer sites (real Postgres)
        # #2098 / ruling 125, sites TWO and THREE — CAL-P091. The step above
        # guards the PRODUCER. The same three-line defect also sat in
        # `app/routes/admin_data_quality.py` (GET /api/admin/calibration-data)
        # and `scripts/audit_golf_hockey_calibration.py`, both of which exist to
        # AUDIT the population the producer publishes. Until CAL-P091 the admin
        # endpoint disagreed with the producer by roughly 23-35 rows on the
        # charter specimen e:14887630 — an instrument silently measuring a
        # different population than the thing it audits, whose agreement would
        # then be read as corroboration.
        #
        # Same shape as the step above and for the same reasons: relational
        # claim, so a real fixture rather than a string assertion; two-armed, so
        # a green run means the reverted SQL was EXECUTED and the suppression
        # came back, not merely that nothing objected; single-source control, so
        # the fix is known to have scoped dedup rather than disabled it. Both
        # chains are executed as production strings — the admin one via the
        # module constant CAL-P091 hoisted it into, so a guard cannot pass
        # against a copy while the original regresses.
        run: |
          set -o pipefail
          python -m pytest \
            tests/integration/test_calibration_mode_price_source_scope_peers_pg.py \
            -v -s -rs 2>&1 | tee /tmp/modescope_peers.txt
          if grep -qiE "[0-9]+ skipped" /tmp/modescope_peers.txt; then
            echo "::error::calibration mode-price peer-site scope SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Calibration vm-variant join, one outcome one row (real Postgres)
        # D5 / ruling 125 with the sign reversed — CAL-P150, #1978. The two steps
        # above guard a join whose coarse key DELETED rows. This one guards the
        # same coarse-key mistake three CTEs earlier, where it MULTIPLIES:
        # `vm_stats` GROUPs BY five columns, `clean_vms` was joined on two, and
        # every outcome of a virtual market whose members disagree on category,
        # is_grouped or mutually_exclusive was emitted once per variant. Measured
        # before the fix: 99.9% of >=3-market groups carry mixed identity, and
        # the 13 cells folded exactly hold 420,081 published rows against 266,137
        # distinct — 36.65% phantom.
        #
        # Real Postgres and not a string assertion, for the reason written into
        # the file: the producer's own comment MISDESCRIBED this pair, ruling
        # 125's text repeated the misdescription, and a string assertion drafted
        # from either would have been green for months. The claim is relational.
        #
        # Two-armed like both steps above: it EXECUTES the reverted two-column
        # join and asserts the duplication returns, so a green run means
        # red-first was proved here rather than asserted in a report. It also
        # carries the cricket regression control the 2026-08-30 directive
        # requires — cricket's published SET must not move under a change that
        # is only allowed to change multiplicity, or the D14 reinvestigation
        # loses its baseline.
        run: |
          set -o pipefail
          python -m pytest \
            tests/integration/test_calibration_vm_variant_join_pg.py \
            -v -s -rs 2>&1 | tee /tmp/vmvariant.txt
          if grep -qiE "[0-9]+ skipped" /tmp/vmvariant.txt; then
            echo "::error::calibration vm-variant join gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: tag-counts statements execute (real Postgres)
        # LAT-P114 / #2267. `/api/feed/tag-counts` returned a plain-text 500 on
        # every request from the day it was written (c536d738, 2026-03-01), so
        # `/categories` rendered "Failed to load categories" for its entire
        # existence. `GROUP BY category` named an output alias that the real
        # `futures_markets.category` column shadows; PostgreSQL resolves the
        # input column first, leaving the selected COALESCE ungrouped:
        #
        #   GroupingError: column "futures_markets.llm_sport_category" must
        #   appear in the GROUP BY clause or be used in an aggregate function
        #
        # ~19,000 tests were green throughout, and they had to be — the
        # statement is valid SQL naming only real identifiers, and the thing
        # that rejects it is the SERVER's name-resolution rule. No mock, no
        # recording double and no source assertion has one. This gate needs the
        # service container.
        #
        # Two-armed like the gates above: it captures the statements the
        # handler actually issues (never a copy, which would go on passing
        # while the route drifted) AND executes the pre-fix statement, which is
        # required to fail. A green run therefore means red-first was proved,
        # not that nothing objected. Same skip-detection as every gate here.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_tag_counts_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/tagcounts.txt
          if grep -qiE "[0-9]+ skipped" /tmp/tagcounts.txt; then
            echo "::error::tag-counts real-Postgres gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#2879 rekey apply/rollback round trip (real Postgres)"
        # CERT-847. `scripts/rekey_statpal_anchors_2879.py` runs unattended
        # under D51, which is granted only to a repair that "writes a backup
        # first and ships a one-command restore". Its restore was a single
        # UPDATE keyed on `a.id = b.id` — which cannot resurrect the row its
        # own DELETE arm removes, and that arm is the USUAL case once lane1's
        # step 2 is live. Reproduction: deleted `s6:354453`, rollback restored
        # 0, and reported success.
        #
        # Why the service container and nothing cheaper: the claim is a round
        # trip through a DELETE that must reappear verbatim. A mock cursor
        # invents the rowcount that decides whether the delete fired; only the
        # server enforces `uq_anchor_source_id` when the legacy row goes back
        # beside the D55 row that superseded it; and only a real INSERT against
        # the real DDL can show that `id` and `first_seen_at` came back
        # unchanged rather than silently re-defaulted.
        #
        # Two-armed: `test_the_update_arm_alone_cannot_pass_this` executes the
        # ORIGINAL one-statement restore and requires it to leave the row gone,
        # so a green run means the repair was proved necessary, not that
        # nothing objected. Same skip-detection as every gate here.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_rekey_statpal_anchors_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/rekey2879.txt
          if grep -qiE "[0-9]+ skipped" /tmp/rekey2879.txt; then
            echo "::error::#2879 rekey round-trip gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#2867 tennis link apply/rollback round trip (real Postgres)"
        # `scripts/link_tennis_statpal_anchors_2867.py` runs unattended under
        # D51 on the same terms as the #2879 re-key above, and CERT-847 is the
        # precedent for what a restore proves when nothing executes it.
        #
        # It writes TWO shapes per link — an UPDATE on `events.statpal_fixture_id`
        # and an INSERT into `event_provider_anchors` — and they undo
        # differently. Four things only the server decides: whether
        # `ON CONFLICT DO NOTHING` against `uq_anchor_source_id` is a no-op or a
        # raise; whether the delete arm's `anchor_existed_before` scoping really
        # leaves a pre-existing anchor standing; the three-valued `IS DISTINCT
        # FROM` logic every restore runs through because the normal prior value
        # is NULL; and psycopg2's `%s` paramstyle on the real statements.
        #
        # Two-armed: `test_a_partial_undo_is_reported_rather_than_called_clean`
        # drives the rollback into the state where BOTH write statements return
        # a clean rowcount and nothing raises, and requires the post-condition
        # query to report it as still-applied. Same skip-detection as every gate
        # here.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_link_tennis_statpal_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/tennislink2867.txt
          if grep -qiE "[0-9]+ skipped" /tmp/tennislink2867.txt; then
            echo "::error::#2867 tennis link round-trip gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#2867 already-linked lookup (real Postgres)"
        # CERT-871 FOLLOW-UP `AUTHORITY-006-ALREADY-LINKED-RECEIPTS`. The forward
        # linker asks for candidates with `statpal_fixture_id IS NULL`, so a
        # fixture it linked on an EARLIER pass finds nothing and reports as
        # unmatched — i.e. as "StatPal has a match we do not hold", the opposite
        # of the truth. On a 10-minute beat that buries the real misses under a
        # day's worth of its own successes.
        #
        # `_already_linked` is the disambiguation and it needs a server for three
        # reasons: `= ANY(:fixture_ids)` is Postgres array binding with no sqlite
        # equivalent and no mock that can be wrong about it; the join is a
        # `VARCHAR` column against a Python `str`, and an int/str coercion on
        # either side misses EVERY row while raising nothing; and only the server
        # can be asked whether the predicate is scoped as written.
        #
        # Batch-size arm included: a one-id batch would execute even if the array
        # binding degenerated to a scalar, so one test runs the real ~70-id pass.
        # Same skip-detection as every gate here.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_link_tennis_already_linked_pg.py \
            -v -s -rs 2>&1 | tee /tmp/tennisalready2867.txt
          if grep -qiE "[0-9]+ skipped" /tmp/tennisalready2867.txt; then
            echo "::error::#2867 already-linked lookup gate SKIPPED — the gate did not run"
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # CERT-433. The CERT-430 comparison specimen renders a payload the BACKEND
      # builds — `backend/scripts/emit_comparison_specimen.py`, spawned by
      # `__tests__/components/tournamentReskin.test.tsx` — because a fixture that
      # hardcodes the repaired payload cannot fail when its producer is deleted.
      #
      # Pinned rather than left to the runner's ambient `python3`: the image
      # happens to ship one today, and a gate that depends on that is a gate
      # nobody chose.
      #
      # NO `cache: pip` AND NO INSTALL STEP, deliberately. The producer imports
      # zero third-party packages, so this job stays a Node job that can also
      # run one pure script — it does not become a job that installs the backend
      # stack to render one card. That property is fragile enough to be worth a
      # test, and it has one:
      # `backend/tests/test_comparison_specimen.py::
      #  test_the_producer_runs_without_our_third_party_requirements`
      # re-checks it under `-S` in the BACKEND suite, so a new import breaks
      # there, where the fix is, rather than here, where it isn't.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # Item 2 — the ONLY uncached artifact in this workflow. pip is cached by
      # setup-python in both python jobs and npm by setup-node above, so `.next`
      # is what was left. Sequenced after the sharding deliberately: while
      # backend-tests was 8m23s, shaving the 2m12s frontend job bought nothing.
      #
      # `path` is workspace-relative — actions/cache does not inherit
      # defaults.run.working-directory, so `frontend/` is not redundant here.
      #
      # Restore-keys give a partial hit: a source-only change still restores the
      # previous build's cache and Next.js reuses what it can. Never key on the
      # lockfile alone, or the cache goes stale the moment sources change while
      # still reporting a hit.
      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
          restore-keys: |
            next-${{ hashFiles('frontend/package-lock.json') }}-
            next-

      - name: Build (ESLint gate — NOT a TypeScript gate, see the step below)
        run: npm run build

      - name: Unit tests (Jest)
        # L2-233. 116 suites / 1,393 tests that, until this step existed, ran
        # only on an engineer's laptop: no workflow invoked jest, and neither
        # `jest` nor `ts-jest` was even declared in package.json — so `npx jest`
        # after `npm ci` would have resolved nothing. Both halves are fixed in
        # the commit that added this line.
        #
        # AFTER the build since UX-P150, and this reordering is load-bearing.
        # It used to run ahead of it — ~20s here versus ~2min there, so a broken
        # test cost one short run instead of a full build first. That trade
        # stopped being available the moment part of the suite started reading
        # the build OUTPUT rather than the sources:
        #
        #   __tests__/components/shippedCopyBans.test.ts   scans .next/static/chunks
        #   __tests__/capture/usOpenDesktopCapture.test.tsx  needs the compiled CSS
        #   __tests__/capture/golfFieldFloorCapture.test.tsx        "
        #
        # Those three pass on a laptop, where `npm run build` has always been run
        # at some point, and failed here on every push once they existed, because
        # `.next` does not exist yet at this point in a clean runner. The copy
        # scan is explicit that a missing bundle is a FAILURE and not a skip —
        # "the build output exists, or CI has skipped its own gate" — because the
        # defect it was written for was copy that had been "fixed" twice, with
        # render guards, and had never actually shipped. Making it tolerate an
        # absent bundle would restore exactly the blindness it exists to remove,
        # so the step moved instead.
        #
        # Both are still required — this job fails on either.
        #
        # No `--passWithNoTests`, no `continue-on-error`. Those, and the rest of
        # what keeps this from silently becoming decoration, are asserted by
        # frontend/__tests__/lib/ciJestGate.test.ts, plus a workflow-shape
        # fixture in the e2e-contract job below that survives this step being
        # deleted.
        run: npm run test:ci

      - name: Type check (fail-on-new)
        # L2-234. `npm run build` above has never enforced TypeScript:
        # next.config.mjs sets `typescript.ignoreBuildErrors: true` (gotcha
        # #10), so a wrong or missing type deploys green. This is the step that
        # notices.
        #
        # It is a fail-on-new gate, not a clean one. Pre-existing errors are
        # recorded per file in frontend/typecheck-baseline.json (see its
        # `total`; do not hardcode the count here, it ratchets down) and owned
        # by issue #1521; they do not fail the build, and one error more than
        # them does. A clean gate today would red every push until all of them
        # were cleared, and a step that reds every push acquires a `|| true`.
        #
        # The ratchet turns both ways: fixing an error without lowering the
        # baseline also fails, with instructions, so the recorded count cannot
        # drift above the real one and become silent headroom.
        #
        # AFTER the build deliberately — `.next/types/**` is generated route
        # typing that tsconfig includes, so running before it would check a
        # smaller program than a developer does locally and the two censuses
        # would disagree.
        #
        # No `continue-on-error`. That, and the rest of what keeps this from
        # becoming decoration, is asserted by
        # frontend/__tests__/lib/ciTypecheckGate.test.ts, plus a workflow-shape
        # fixture in the e2e-contract job that survives this step being deleted.
        run: npm run typecheck

  e2e-contract:
    # L2-229 Item 1 — the browser-audit rail's fixtures, on ordinary push CI.
    #
    # These are the tests that test the tests: they mutate the workflow, the
    # evaluator, the manifest validator and the redactor, and assert each
    # mutation produces exactly its own red. If they stop failing, every green
    # the rail reports afterwards is worthless — so until now the rail's only
    # always-on gate lived in a MANUAL workflow nobody dispatches on a normal
    # push, and a false-green-fixture regression could ship silently.
    #
    # It is cheap enough to be unconditional: no dependency install, no browser
    # download, no network — `node --test` needs nothing but Node, which is why
    # browser-audit.yml also runs it ahead of any install. ~0.2s of test time.
    #
    # Deliberately NOT `npm ci`: adding an install here would couple every push
    # to the e2e lockfile and to registry availability, which is the opposite of
    # what makes this gate safe to run on everything.
    name: Browser-audit contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend/e2e

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Must match browser-audit.yml. Node only globs `--test` arguments
          # from v22, so on 20 the shell has to expand `contract/*.test.js` —
          # quoting it made this suite silently never run in CI (L2-228).
          node-version: "20"

      - name: Contract fixtures (no dependencies, no browser, no network)
        run: npm run contract

  deploy:
    # search-recall added for #1494: the recall gate is deploy-blocking, so the
    # reverted search speed-up cannot re-land without it going green.
    # `backend-tests` stays a BARE job name even though it is now a 4-leg matrix:
    # a matrix dependency is satisfied only when EVERY leg succeeds, so one red
    # shard still blocks the release. Enumerating shard names here would have to
    # be edited every time the matrix changes, and forgetting would silently drop
    # a shard from the deploy gate.
    # shard-completeness is required too — without it a partition that skips
    # files could deploy on a green built from a smaller suite.
    needs: [backend-tests, shard-completeness, search-recall, frontend-build, e2e-contract]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: heroku-deploy
      cancel-in-progress: true
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy to Heroku (newest-wins guarded)
        run: |
          # Newest-wins guard (L2-57): the deploy-job concurrency group only
          # CANCELS an in-progress deploy. An OLDER commit's RE-RUN whose deploy
          # starts AFTER a newer commit already deployed is not in-progress-cancelled,
          # so it would clobber prod with older code (bitten twice: v3320=older
          # landed after v3319=newer). Guard: if this run's SHA is not the current
          # origin/master tip, skip the deploy (job stays green). Gotcha #9: the
          # check lives inside the run block, not a step-level `if` with secrets.
          ORIGIN_TIP="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ -n "$ORIGIN_TIP" ] && [ "$ORIGIN_TIP" != "$GITHUB_SHA" ]; then
            echo "Skipping deploy: this run's commit ($GITHUB_SHA) is not the current"
            echo "origin/master tip ($ORIGIN_TIP) — a newer commit supersedes it."
            echo "An older re-run can no longer clobber a newer deploy."
            exit 0
          fi
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY not set — skipping deploy"
            exit 0
          fi
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/bainluck.git 2>/dev/null || true
          git push heroku master --force
