        # 🪤 The obvious fix is also wrong, and the second arm guards it.
        # `:horizon_days::int` compiles with an EMPTY bind list, because
        # SQLAlchemy's bind regex refuses a colon preceded by a colon — the
        # literal reaches the server and raises a DIFFERENT syntax error. The
        # shipped spelling is `cast(:horizon_days AS int)`.
