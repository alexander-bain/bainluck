        # A cast is not the only edit that silences the original error — deleting
        # the BETWEEN clause does too — so the corpus carries a far-future row, a
        # row with an `espn_id`, a completed row and a two-anchor row, and the
        # arms assert both directions plus that a tighter horizon empties the
        # population (a hardcoded 30 fails there). Red-first is executed, not
        # remembered: one arm rebuilds the merged text by surgery on the shipped
