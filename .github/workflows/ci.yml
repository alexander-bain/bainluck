name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes TypeScript + ESLint)
        run: npm run build

  ios-build:
    # Compile-only gate for the iOS/macOS app. Catches Swift type errors and
    # pbxproj breakage that the local agent can't (xcodebuild SPM resolution is
    # sandbox-blocked there). GitHub macOS runners resolve SPM normally.
    # Intentionally NOT in `deploy.needs`: the app ships via TestFlight, not
    # Heroku, so a red iOS build must not block backend/web deploys.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: "ios/Bain Luck"

    steps:
      - uses: actions/checkout@v6

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "Bain Luck.xcodeproj" -scheme "Bain Luck"

      - name: Build (compile check, no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Bain Luck.xcodeproj" \
            -scheme "Bain Luck" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  deploy:
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: heroku-deploy
      cancel-in-progress: true
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy to Heroku
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY not set — skipping deploy"
            exit 0
          fi
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/bainluck.git 2>/dev/null || true
          git push heroku master --force
