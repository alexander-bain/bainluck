name: CI

on:
  # NO `branches:` FILTER ON pull_request — deliberate, and load-bearing.
  #
  # It used to read `pull_request: branches: [master]`, which does NOT mean
  # "PRs into master get CI". It means "ONLY PRs into master get CI" — a PR
  # based on any other branch matches no trigger and gets NO RUN AT ALL. Not a
  # pending check, not a red one: an empty checks list, which reads as "nothing
  # to wait for" in exactly the place a reviewer looks for permission to merge.
  #
  # Two named failures, both in one week, both on stacked lane branches:
  #
  #   1. PR #1943 (`lane1/q363` -> `lane1/q362`) reported `mergeStateStatus:
  #      DIRTY` and no checks. The base was retargeted to master; GitHub emits
  #      `edited` on a retarget and this workflow listens to opened/synchronize/
  #      reopened, so retargeting SCHEDULED NOTHING. A close+reopen is what
  #      finally produced a run.
  #   2. PR #1950 (`lane1/q365`, cut from `lane1/q364`) hit the same wall. Only
  #      gitleaks reported, because `gitleaks.yml` has a BARE `pull_request:`
  #      with no branch filter — the accidental control that proves the cause
  #      is the filter here and not anything about the branches themselves.
  #
  # The workaround (retarget, then close+reopen) was rediscovered from scratch
  # both times, because the symptom — a green-looking PR with no checks — does
  # not point at a trigger. Removing the filter deletes the class: every PR gets
  # a run regardless of base, and a stacked branch can never again be merged on
  # the strength of checks that were never scheduled.
  #
  # Deploy is unaffected. The `deploy` job is separately gated on
  # `github.ref == 'refs/heads/master' && github.event_name == 'push'`, so a PR
  # into any base still cannot release — see the job's own comment. The `push:`
  # filter below stays master-only so branch pushes do not double-run CI
  # alongside their own PR.
  #
  # Guarded by `frontend/e2e/contract/ciTriggerCoverage.contract.test.js`.
  pull_request:
  push:
    branches: [master]

jobs:
  # #5007 (THRU-H) — does this candidate need the backend jobs at all?
  #
  # The four shards plus search-recall are 11.1m and 8.3m of a 12.1m run
  # (measured, n=25). A candidate confined to `frontend/` that no backend test
  # can even read is protected by none of them and pays for all of them.
  #
  # THIS JOB FAILS TOWARD "full", exactly like release-required fails toward
  # releasing. Skipping a job that would have caught a defect ships the defect;
  # running a job that proves nothing costs minutes. Not symmetric.
  #
  # The decision is NOT "is every changed file under frontend/". Twelve backend
  # tests read `frontend/**` off disk as cross-tier parity guards, so that rule
  # alone is a fail-open — see `.github/ci-cross-tier-paths.txt` and its rot
  # guard, `backend/tests/test_ci_cross_tier_manifest.py`. The script consults
  # that manifest; a candidate touching one of those paths runs everything.
  #
  # `deploy` is unaffected. Whenever this job says `frontend`, every changed path
  # is under `frontend/`, so `heroku-release-required.sh` necessarily says
  # `false` and `deploy` was already skipping — the reduced set is a strict
  # subset of the no-release set. That invariant is asserted by
  # `test_a_frontend_scope_always_implies_no_heroku_release`, not left to reading.
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The classifier diffs a range; a shallow clone has no base to diff.
          fetch-depth: 0

      - name: Classify the complete candidate
        id: decide
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The MERGE BASE, not the base branch tip. A two-dot diff against a
            # base that has moved reports master's own advances as part of this
            # candidate — conservative, but it would force `full` on almost
            # every PR and the saving would quietly never appear. Falling back
            # to the base sha keeps that conservative behaviour if merge-base
            # cannot be computed.
            BASE="$(git merge-base '${{ github.event.pull_request.base.sha }}' \
                                   '${{ github.event.pull_request.head.sha }}' 2>/dev/null \
                     || echo '${{ github.event.pull_request.base.sha }}')"
            HEAD='${{ github.event.pull_request.head.sha }}'
          else
            BASE='${{ github.event.before }}'
            HEAD='${{ github.sha }}'
          fi
          # `|| echo full` is the last fail-safe: if the script cannot run at
          # all, we run everything.
          SCOPE="$(bash .github/scripts/ci-change-scope.sh "$BASE" "$HEAD" || echo full)"
          case "$SCOPE" in
            full|frontend) ;;
            *) echo "unparseable scope '$SCOPE' — defaulting to full"; SCOPE=full ;;
          esac
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "change scope: $SCOPE (base=$BASE head=$HEAD)"

  # Queue 312 — sharded because this job WAS the merge-to-deploy path: 8m23s of a
  # 9m31s run (measured, run 31436687919), with every other job finishing minutes
  # earlier. Four legs of ~113s each make frontend-build the long pole instead.
  #
  # The split is computed, not configured. `scripts/ci_shard.py` enumerates the
  # collected test files and assigns each to exactly one shard; there are no path
  # globs to maintain and no way for a new test file to match none of them. The
  # `shard-completeness` job below proves that claim on every run against pytest's
  # own collection — read its header for why that check is not optional.
  backend-tests:
    # #5007 — skipped only when change-scope PROVED the candidate cannot reach
    # anything these shards test. The comparison is `!= 'frontend'`, not
    # `== 'full'`, so an empty or unset output (a cancelled or failed
    # change-scope job) still runs the shards.
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs even when one fails. With fail-fast the first red
      # cancels its siblings, so a run that broke three shards reports one and
      # you re-discover the others one push at a time.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend

    steps:
      # THE MUTATION-RESIDUE SCAN NEEDS A MERGE BASE, AND THE DEFAULT CHECKOUT
      # DOES NOT HAVE ONE.
      #
      # `tests/test_mutation_guard.py` runs `scan_mutation_residue.py`, whose
      # Pass B diffs `origin/master...HEAD`. On a PUSH to master that resolves
      # and the job is green; on a PULL REQUEST, checkout lands a detached merge
      # ref at depth 1, `origin/master` does not exist, and git returns 128 —
      # which the scanner reported as exit 1, the SAME code it uses for "residue
      # found". Every PR in the repo failed shard 3 identically, with a message
      # that read like a real finding (2026-08-24: #2145, #2146, #2151).
      #
      # `filter: blob:none` is what makes the full graph affordable: the pack is
      # ~850 MiB, but `git diff --name-only` needs commits and TREES only, so
      # blobs stay on the server and are fetched lazily if something else asks.
      # `fetch-depth: 0` alone would pull the whole 850 MiB on all four shards.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # `strategy.job-total` rather than a literal 4: the matrix list is then
        # the single place the shard count is written, so growing it to 5 cannot
        # leave a stale divisor here silently running the wrong partition.
        #
        # -q against pytest.ini's `addopts = -v`: verbosity is summed, so the
        # old `tests/ -v` here actually ran at verbosity 2. This lands at 0 —
        # progress dots, with --tb=short preserved for real failures.
        #
        # `--durations=0` is what keeps the BALANCE HINTS honest, and it is not
        # decoration. `scripts/ci_shard.py` packs the shards LPT-greedy against
        # measured per-file seconds in `ci_shard_durations.json`; a file with no
        # measurement is packed at the flat DEFAULT_WEIGHT guess instead. That
        # file was last recorded by hand on 2026-08-10 and by 2026-09-01 it
        # covered 599 of 1,061 test files — so 44% of the suite, and roughly
        # two thirds of the packer's total weight budget, was a constant rather
        # than a measurement. The packer was balancing a fiction, and the shards
        # it produced ran 338s / 247s / 244s / 221s at p50 (n=604 runs): the job
        # waits for the slowest leg, so 79s of every run at p50 and 114s at p90
        # was pure imbalance — 13.0 hours of CI wall clock over 30 days.
        #
        # A hint file that can only be refreshed by remembering to refresh it
        # goes stale again, and the staleness is silent: the partition stays
        # total and disjoint, CI stays green, and only the clock knows. So every
        # run now emits the measurement its own next partition needs, and a
        # refresh is a log download rather than a local suite run:
        #
        #   python scripts/ci_shard.py --record <(cat shard1.log ... shard4.log)
        #
        # Recording from the RUNNER's clock rather than a laptop's is not a
        # convenience either. Local wall clock is ~3.5x the runner's on this
        # suite and the ratio is not uniform across files — integration tests
        # stretch far more than unit tests — so weights recorded locally
        # mis-rank files against each other and pack a worse partition than the
        # runner's own numbers do.
        #
        # Cost: pytest suppresses sub-5ms entries, so this adds a bounded tail
        # of a few thousand lines to a log that is already ~100 KB. It changes
        # no test, no selection and no exit code.
        run: |
          set -o pipefail
          FILES="$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})"
          if [ -z "$FILES" ]; then
            echo "::error::shard ${{ matrix.shard }} resolved to ZERO test files — the"
            echo "::error::partition is broken and this leg would pass without testing anything."
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ strategy.job-total }}: $(echo $FILES | wc -w) test files"
          python -m pytest $FILES -q --durations=0

  # Item 1.4 — the assertion that makes sharding safe to trust.
  #
  # A sharded suite has one failure mode that no red can announce: a test file
  # that no shard owns is never run, and CI reports green having tested less
  # than it did yesterday. The green is indistinguishable from a healthy one,
  # which is why this cannot be left to code review of a glob list.
  #
  # So: ask pytest what it collects, ask ci_shard.py what it assigns, and require
  # the two sets to be equal — plus pairwise-disjoint shards, so nothing is
  # double-run either. Fails loudly and blocks deploy.
  #
  # Its own job, deliberately: it needs only a collection (~2s) rather than a
  # test run, so it finishes long before the shards and never joins the critical
  # path. Cheap enough that there is no argument for sampling it.
  shard-completeness:
    # #5007 — this proves the SHARD PARTITION is complete, so it is meaningful
    # only when the shards run. Skipped with them, never independently.
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: The shards must cover the whole suite, exactly once each
        # Keep --of in step with the matrix above. A mismatch is not a
        # correctness hole (the partition is total for any N) but it would
        # report balance for a split nobody runs.
        run: python scripts/ci_shard.py --verify --of 4

  # #3761 — THE GOLDEN FLOOR GUARD, RUN RATHER THAN MERELY AVAILABLE.
  #
  # `scripts/check_golden_baseline_floor.py` shipped with CERT-2166/2170 as a
  # command a merge desk could run by hand, and
  # `tests/test_golden_baseline_floor_guard_3564.py` proves its LOGIC against
  # fixtures. Neither of those makes it run against an actual proposal, so the
  # read integrator/239 did by hand on 2026-09-06 — a branch carrying
  # `passing_count: 665` over master's 668, with no conflict, no reviewable diff
  # line and `git merge-tree` exit 0 — stayed a thing somebody had to remember
  # to do. `matching_golden_baseline.json` is a whole-file generated artifact,
  # so a silent revert of it is textually indistinguishable from a deliberate
  # re-derivation. This job is that read, on every PR, without remembering.
  #
  # PULL REQUEST ONLY, AND THAT IS A FINDING, NOT AN OVERSIGHT. The script
  # defends the working tree against `--target origin/master`. On a push to
  # master those are the SAME COMMIT, so a push run compares the tip against
  # itself and cannot fail no matter what just landed. A gate that cannot fail
  # is worse than no gate, because it is a green check somebody will later cite
  # as proof. Excluded here rather than left to print a meaningless pass;
  # `test_golden_floor_ci_wiring_3761.py` pins both the exclusion and the
  # self-comparison fact that forces it.
  #
  # Since #3761 the script no longer DRESSES that case up: an identical pairs
  # map prints "NO CHANGE: the baseline is untouched" instead of "ACCEPT: the
  # floor is defended", so a log read after the fact says which of the two
  # happened. It still exits 0, and it must -- most pull requests never touch
  # the fixture, so this job reaches that branch on nearly every run, and any
  # non-zero there would redden the whole repo. The opt-in `--require-change`
  # (exit 2 on an identical map) is a MERGE DESK tool for a proposal already
  # known to move the fixture; it does NOT unlock a push arm, which would then
  # fail every single release instead of passing meaninglessly.
  #
  # AND THAT IS WHY THIS JOB MUST NEVER JOIN `deploy: needs:`, however much it
  # looks like it belongs there. `deploy` runs on push only, this job is skipped
  # on push, and a `needs:` dependency that SKIPS skips its dependents too — so
  # adding it would silently stop every release rather than gate one.
  #
  # `fetch-depth: 0` + `filter: blob:none` for exactly the reason backend-tests
  # carries them: a default PR checkout is a detached merge ref at depth 1 where
  # `origin/master` DOES NOT EXIST. Without them the script cannot read its
  # target and exits 2 — which it announces as "The comparison did NOT run. Do
  # not read this as a pass." — but only to a log nobody opens on a green run.
  golden-baseline-floor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No `pip install` step: the script imports the standard library only, and
      # that is deliberate — this gate cannot then be taken down by a dependency
      # resolution failure on an unrelated package.
      #
      # NOT piped and NOT `continue-on-error` (gotcha #124). Exit 1 is a result:
      # the floor fell and the proposal did not name what fell. Exit 2 is a
      # story about the harness: a ref or blob was unreadable and the comparison
      # never happened. BOTH must fail this job, which they do only because the
      # step's exit code is the command's own and nothing swallows it.
      - name: The golden baseline floor may not fall without naming what fell
        run: python3 scripts/check_golden_baseline_floor.py --target origin/master

  # #1494 — the search RECALL gate.
  #
  # Separate from backend-tests because it needs a real Postgres. LAT-P002 was
  # reverted (f98d8104) when 3 of 8 production queries came back with ZERO
  # futures, and its gold-set recall criterion was listed OWED and never run —
  # because no rail existed to run it on. Every other search test mocks the DB
  # session, so the WHERE clause never touches data and this whole defect class
  # was unguarded on a p1 surface. This job is that rail, and it is
  # deploy-blocking (see `deploy.needs`).
  search-recall:
    # #5007 — the recall rail exercises backend search. A candidate confined to
    # `frontend/` and touching no cross-tier path cannot change what it measures.
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bl_searchtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # asyncpg URL for the test's own engine...
      SEARCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest
      # ...and for the app module's import-time engine, so it points at
      # localhost and skips the non-local SSL branch in services/database.py.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bl_searchtest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the gate is actually armed
        # A skipped recall gate is indistinguishable from a passing one, which
        # is exactly how criterion 3 stayed "owed" across two cycles. Fail loudly
        # if the DB never came up rather than let the job go green on skips.
        run: |
          python -c "
          import os, sys
          url = os.environ.get('SEARCH_TEST_DATABASE_URL')
          if not url:
              sys.exit('SEARCH_TEST_DATABASE_URL unset — the recall gate would silently SKIP')
          print(f'recall gate armed against {url.rsplit(chr(64), 1)[-1]}')
          "

      - name: Search recall contract (real Postgres)
        # -s so the "SEARCH RECALL n/n" line reaches the job log: #1494's
        # acceptance is "RUN, with output quoted", and a gate whose result
        # nobody can read is the same as a gate nobody ran.
        #
        # One run, tee'd, then checked for skips — pytest exits 0 when every
        # test skips, and a silently-skipped gate reads exactly like a passing
        # one. That is the failure mode this whole job exists to end, so it is
        # not allowed to recur in the job's own plumbing.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_search_recall_contract.py \
            -v -s -rs 2>&1 | tee /tmp/recall.txt
          if grep -qiE "[0-9]+ skipped" /tmp/recall.txt; then
            echo "::error::search recall contract SKIPPED — the gate did not run"
            exit 1
          fi
          grep -E "^SEARCH RECALL" /tmp/recall.txt || {
            echo "::error::no SEARCH RECALL summary line — cannot quote the result"
            exit 1
          }

      - name: Proven-duplicate search contract (real Postgres)
        # CERT-439 / #2263. The registry proves two rows are one game and tags
        # the loser `provenance:duplicate-of:<id>`. The league, team and feed
        # rails stopped printing it; search and typeahead did not, so the
        # product answered "one game" or "two games" according to how the user
        # navigated to it.
        #
        # This cannot be a unit test or a source assertion — both were green
        # while the twin was still a separate search result. The search route
        # runs on PostgreSQL and nothing else: `ts_rank_cd(to_tsvector(...))`
        # ordering, pg_trgm-servable ILIKE recall arms, and a "did you mean"
        # fallback behind `SET LOCAL pg_trgm.similarity_threshold`.
        #
        # Same skip detection as every gate in this job: pytest exits 0 when
        # each test skips, and a gate that silently did not run reads exactly
        # like one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_search_proven_duplicate_pg.py \
            -v -rs 2>&1 | tee /tmp/dupsearch.txt
          if grep -qiE "[0-9]+ skipped" /tmp/dupsearch.txt; then
            echo "::error::proven-duplicate search contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Typeahead next-fixture contracts, or-NEXT and lead-team (real Postgres)
        # #5201 rides this step: the or-NEXT arm below is gated on "no pooled row
        # NAMES the query's participant", and a NAMESAKE satisfies that gate —
        # measured on production 2026-09-11, `bruins` showed a Boston Bruins card
        # in slot 0 above *San Diego State Aztecs at UCLA Bruins* and Boston's own
        # three upcoming fixtures were unreachable. The lead-team arm's clauses
        # are compiled in `tests/test_typeahead_reaches_the_resolved_teams_fixture_5201.py`;
        # the four cases that need real rows (an id-only fixture, a name-only
        # fixture, the horizon, and the same game never offered twice) are in
        # this file and are graded here.
        #
        # T2-2 / #5059. `/typeahead`'s upcoming pool is bounded at now+7d, so
        # "the live game, else the NEXT, else the last finished" lost its middle
        # term for whole leagues at once: measured on production 2026-09-11, all
        # 32 NHL and all 27 NBA teams — 366 teams across all sports — had no
        # fixture inside the window, and the or-LAST arm filled the dropdown
        # with finished games.
        #
        # The sibling unit file compiles the arm and asserts its clauses. It
        # cannot prove the clause changes the ANSWER, and it cannot see the two
        # ways this ship fails in production: the arm running for queries that
        # already worked (which silently widens the candidate set for every
        # keystroke on the endpoint), and the finished game staying beside the
        # next one. Both are properties of which rows the route returns, so they
        # need the route and a real database.
        #
        # Same skip detection as every gate in this job: pytest exits 0 when
        # each test skips, and a gate that silently did not run reads exactly
        # like one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_typeahead_next_fixture_pg.py \
            -v -rs 2>&1 | tee /tmp/nextfixture.txt
          if grep -qiE "[0-9]+ skipped" /tmp/nextfixture.txt; then
            echo "::error::or-NEXT typeahead contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Tennis twin sweep write/undo contract (real Postgres)
        # #2878 / CERT-2142. The sweep's whole effect is one jsonb element
        # appended to `events.event_tags`, and its idempotence claim lives
        # entirely in a `NOT @>` — both are properties of PostgreSQL. Under
        # sqlite `event_tags` is shimmed to JSON, `||` and `@>` do not exist,
        # and gotcha #4 is that a JSONB write which looks right can silently
        # fail to persist. So the unit suite can prove the judgement and prove
        # the rails honour the label, but only this can prove the label is ever
        # written — or that the undo removes exactly one element and leaves the
        # tags another writer added.
        #
        # Same skip detection as every gate in this job: pytest exits 0 when
        # each test skips, and a gate that silently did not run reads exactly
        # like one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_tennis_twin_sweep_pg.py \
            -v -rs 2>&1 | tee /tmp/twinsweep.txt
          if grep -qiE "[0-9]+ skipped" /tmp/twinsweep.txt; then
            echo "::error::tennis twin sweep contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#3672 repair bind contract (real asyncpg)"
        # #1884's class, recurred. `repair_3672_bare_namespace_event_names.py`
        # shipped with 42 green unit tests, passed CERT-2139, merged and
        # deployed — and raised asyncpg DataError on its FIRST statement, having
        # bound `SINCE` as an ISO string into `CAST(:since AS timestamptz)`.
        # It planned nothing and wrote no backup.
        #
        # The unit suite could not see it: its fake session accepts any params
        # object, so the bind's type never met a type system. The cliff drain's
        # bind contract closed this class for the drain's OWN sql; the unit of
        # protection turns out to be a statement, not a codebase.
        #
        # Same skip detection as every gate in this job.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_repair_3672_bind_contract.py \
            -v -rs 2>&1 | tee /tmp/bind3672.txt
          if grep -qiE "[0-9]+ skipped" /tmp/bind3672.txt; then
            echo "::error::#3672 repair bind contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Provenance enum contract (real Postgres)
        # C-ADHOC-PROV-CORE. The receiver accepted `play` while the migration's
        # enum declared six values without it, and the route specimen STORED it
        # and COMMITTED — because the recording double does not enforce
        # PostgreSQL's enum type. Against a real database every Play interaction
        # would have been rejected at commit, in production, on the kid surface.
        #
        # An ORM will hand PostgreSQL any string; the TYPE is what says no. So
        # this gate cannot be a unit test, a mock session, or a source
        # assertion — all three were green while the defect was live. It needs
        # the service container.
        #
        # Same skip-detection as the two gates around it: pytest exits 0 when
        # every test skips, so a gate that silently did not run is
        # indistinguishable from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_provenance_enum_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/provenance.txt
          if grep -qiE "[0-9]+ skipped" /tmp/provenance.txt; then
            echo "::error::provenance enum contract SKIPPED — the gate did not run"
            exit 1
          fi

      - name: Futures price writer contract (real Postgres)
