        # LEFT JOIN that must not multiply the pool, a CASE that must return
        # NULL for every row that is not a game, and `ASC NULLS LAST`, whose
        # whole job is to leave ~10,600 rows where they were. A `NULLS FIRST`
        # typo would sort every futures market ahead of every game and no row
        # count would notice.
        #
        # The file carries its own red control: the same statement with the one
        # key removed, which must put the 90-day-old futures market first. If
        # that control stops reproducing the defect the gate is decoration, and
        # it fails rather than passing quietly.
        # Same skip-detection as every gate here.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_polymarket_kickoff_ordering_pg.py \
            -v -s -rs 2>&1 | tee /tmp/kickofforder4896.txt
          if grep -qiE "[0-9]+ skipped" /tmp/kickofforder4896.txt; then
            echo "::error::#4896 kickoff-ordering gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#2927 containers migration round trip (real Postgres)"
        # Migration `containers_phase1`, authorised by Alex's verbatim "go 2927"
        # — a go whose terms are "additive, nothing altered, nothing dropped,
        # reversible by dropping the tables". This gate is the proof of that
        # last clause rather than the assertion of it.
        #
        # Why it cannot be anything cheaper. Every claim is a claim about
        # PostgreSQL: `event_edges.receipt_id` -> `market_match_receipts` and
        # `market_match_receipts.container_id` -> `containers` reference each
        # other, so the table order in `upgrade()` is load-bearing, and a wrong
        # order fails in the Heroku release phase — on production, with the
        # site down. The CHECK and UNIQUE constraints are enforced by the
        # server and by nothing else; C-ADHOC-PROV-CORE is the precedent, where
        # a recording double stored and committed a value the real type would
        # have rejected while every unit test stayed green.
        #
        # The test migrates a database of its OWN — created and dropped per
        # run, never `bl_searchtest` — from empty to the parent revision,
        # photographs `information_schema`, migrates up, proves the new
        # constraints bite, migrates back down, and requires the second
        # photograph to equal the first. The comparison is the point: "the four
        # tables are gone" would also be true of a downgrade that left
        # `container_id`, its foreign key and its index standing, and that
        # residue is what makes the SECOND rollback fail.
        #
        # Same skip-detection as every gate in this job, for the same reason:
        # pytest exits 0 when every test skips, so a gate that silently did not
        # run is indistinguishable from one that passed.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_containers_migration_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/containers2927.txt
          if grep -qiE "[0-9]+ skipped" /tmp/containers2927.txt; then
            echo "::error::#2927 containers migration round trip SKIPPED — the gate did not run"
            exit 1
          fi
          grep -E "^CONTAINERS MIGRATION ROUND TRIP" /tmp/containers2927.txt || {
            echo "::error::no round-trip summary line — the undo line is unproved"
            exit 1
          }

      - name: "#2927 container assembly writes and re-writes (real Postgres)"
        # Phase 2. The pure half of assembly — the register gatherer, the class
        # computation, the cycle guard, the section ordering — is graded in
        # `tests/test_container_assembly_2927.py` against the real committed US
        # Open register. This step grades the half only a server can answer.
        #
        # The load-bearing one is IDEMPOTENCY. Assembly is `ON CONFLICT
        # (parent_type, parent_id, child_type, child_id, kind) DO UPDATE`, and a
        # mock session records the statement the caller built — it agrees with
        # the caller by construction. Only a server can say whether the second
        # nightly pass produced 458 members or 916, and that is the difference
        # between a hub that works and a hub that looks, from outside, like it
        # is working unusually well. Its companion asserts the harder half: a
        # member whose class CHANGES must move between sections rather than
        # appear in both, which `DO NOTHING` would pass while getting wrong.
        #
        # Also here because they cannot be anywhere else: `container_id`
        # surviving the receipt upsert (#2199's lesson — a writer that looked
        # correct wrote 0 of 10,804 rows with 19,906 tests green), and the
        # dangling-edge check, whose entire purpose is to notice a row deleted
        # AFTER its edge was written and which therefore requires deleting one.
        #
        # Same skip-detection as every gate in this job, for the same reason.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_container_assembly_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/assembly2927.txt
          if grep -qiE "[0-9]+ skipped" /tmp/assembly2927.txt; then
            echo "::error::#2927 container assembly SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4229 Kalshi senate backfill moves the stored row (real Postgres)"
        # CERT-2372 blocked the classifier-only SHA because the diff made these
        # markets CLASSIFY as politics while every stored row stayed `hockey`:
        # `app/tasks/kalshi.py` writes the tag through
        # `coalesce(nullif(existing,'other'), new)`, so a real tag is never
        # overwritten. The claim under test is therefore "a stored row changed
        # value", and only a server that stored it can observe that. A mock
        # session returns the very rowcount under test, and the failure being
        # guarded is a write that appears to succeed and changes nothing.
        #
        # Two-armed like the gates above: the Ottawa control is forced INSIDE
        # the repair's id list, so only the shipped classifier's per-row verdict
        # can spare it, AND `test_a_blind_id_update_cannot_pass_this` executes
        # the naive one-statement update and requires it to corrupt that
        # control. A green run therefore means the classifier gate was proved
        # necessary, not that nothing objected.
        #
        # Same skip-detection as every gate in this job. Adding the file is not
        # adding the gate: without this step the suite goes green while the
        # file's mere existence reads as coverage (lane1b/102's #4157 lesson).
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_repair_kalshi_senate_category_4229_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/senate4229.txt
          if grep -qiE "[0-9]+ skipped" /tmp/senate4229.txt; then
            echo "::error::#4229 senate backfill gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4229 Polymarket senate repair preserves the observation clock (real Postgres)"
        # CERT-2382 blocked the first SHA because the UPDATE carried
        # `updated_at = NOW()`, and this table's `updated_at` is RENDERED on the
        # card as the market's own relative date — the Fed Chair card's
        # before-LOOK reads `May 17`. Stamping it would have left four-month-old
        # prices unchanged while presenting them as observed just now.
        #
        # This clause cannot be pinned by a source scan, and that is the whole
        # reason for the file. `FuturesMarket.updated_at` is `onupdate=func.now()`,
        # which fires for Core/ORM `update()` and not for the `text()` this rail
        # uses. So "the timestamp survives" rests on an interaction between a
        # column default and a statement style, neither visible in the repair's
        # source: switching to `sqlalchemy.update()` would keep every scan green
        # and bump the clock on every repaired row.
        #
        # Two-armed like its neighbours: the hockey control is forced INSIDE the
        # id bound so only the venue's per-event verdict can spare it, AND
        # `test_a_repair_that_stamps_the_clock_cannot_pass_this` executes the
        # blocked statement and requires the timestamp assertion to fail. Green
        # means the clock is preserved AND that preserving it was proved
        # necessary.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_repair_polymarket_senate_category_4229_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/senate4229pm.txt
          if grep -qiE "[0-9]+ skipped" /tmp/senate4229pm.txt; then
            echo "::error::#4229 Polymarket senate repair gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4253 a delisted Kalshi leg stops claiming 100% (real Postgres)"
        # The Starlink IPO card served five PAST dates at 100%, ranked above
        # every real price, because Kalshi purged those market rows (gotcha #35)
        # and no writer has touched ours since March. Declining to write is not
        # withdrawing what is written.
        #
        # Real Postgres for three reasons a mock cannot cover. The candidate
        # predicate turns on a correlated `NOT EXISTS` over the same table it
        # selects from plus `= ANY(:ids)`; the write is a compare-and-set with
        # `RETURNING`; and the clock arm is the CERT-2382 clause again —
        # `FuturesOutcome.last_updated` is `onupdate=func.now()`, which fires for
        # `update()` and not for `text()`, so a switch of statement style would
        # keep every source scan green while stamping every withdrawn row.
        #
        # The refusal arms carry the safety argument, not the ship arm: the same
        # census that found 41 retirable legs found that 4.2% of ALL stored legs
        # are venue-absent, dominated by ungraded YES results at ~0.99 beside
        # crowned siblings. `test_a_market_grading_has_touched_is_refused` is the
        # arm that keeps those.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_kalshi_delisted_leg_retirement_pg.py \
            -v -s -rs 2>&1 | tee /tmp/kalshi4253.txt
          if grep -qiE "[0-9]+ skipped" /tmp/kalshi4253.txt; then
            echo "::error::#4253 delisted-leg retirement gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4745 empty-book openings actually leave the published curve (real Postgres)"
        # CERT-2508 BLOCKed the guard that shipped in `ece46743`: it only reaches
        # rows where `opening_probability IS NULL`, so the ~16,960 legs the
        # accuracy page already publishes at a mean 0.904 — and which came true
        # 13.1% of the time — stay on the page. *Mitch Marner: 3+ points* stored
        # a Kalshi book of bid 0.00 / ask 0.98 with no trade and we published
        # 0.98. Nobody would pay a cent; somebody left an offer at 98c.
        #
        # Real Postgres because the claim is "LEAVES THE CURVE", and the curve
        # price is `COALESCE(calibration_probability, opening_probability)` —
        # a property of two stored columns that only a server can hold. Three
        # more parts are server-side too: the bound turns on two correlated
        # laterals; the write re-derives it inside the UPDATE and reads
        # `fo.opening_probability`'s PRE-update value to decide whether the
        # calibration price was a copy of it; and both safety clauses are
        # `Numeric(7,6)` equalities, which a float round-trip can flip.
        #
        # Two arms carry the argument. `test_nulling_only_the_opening_cannot
        # _pass_this` runs the repair a reviewer reaches for first and requires
        # 0.98 to STILL be published, so green means the two-column write was
        # proved necessary rather than merely unopposed (gotcha #144). And
        # `test_phase_0c_does_not_re_promote_a_withdrawn_row` executes the
        # SHIPPED Phase 0c statement right after the repair — with its own
        # positive control, because a Phase 0c that did nothing at all would
        # pass the withdrawn-row assertion perfectly.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_repair_kalshi_empty_book_openings_1086_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/emptybook4745.txt
          if grep -qiE "[0-9]+ skipped" /tmp/emptybook4745.txt; then
            echo "::error::#4745 empty-book withdrawal gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#938 golf round markets stop publishing a stamp as a price (real Postgres)"
        # `KXDPWORLDTOURR1LEAD-HEIO26` publishes twenty-three golfers at 0.990
        # while Kalshi's own last quote before that round reads 0.070 / 0.350 /
        # 0.380. The real numbers were in `futures_odds_snapshots` the whole
        # time; the published 0.99 is the market's OPENING stamp, carried
        # forward because `backfill_winners` Part A2 — which already owns this
        # correction — is budget-gated and has been stopping early for weeks.
        #
        # Real Postgres because every load-bearing part is server-side. The
        # candidate predicate turns on a correlated `LEFT JOIN LATERAL` ordered
        # `captured_at DESC LIMIT 1`; the write re-derives that same lateral
        # INSIDE the UPDATE rather than trusting the plan's ids; and
        # `Numeric(7,6)` equality (`calibration_probability =
        # opening_probability`) is a column comparison, not a Python one — a
        # float round-trip makes 0.99 == 0.99 true in Python and can make it
        # false in the column, which is the entire candidate test.
        #
        # Two-armed like its neighbours. The controls carry the safety argument:
        # a quote captured AFTER the round begins must be refused (ruling 103),
        # a row Part A2 already repriced must not be examined at all, and the
        # tournament-scoped market — 2.12/2.42 ECE against these arms' 14.86/8.58
        # — must be out of the bound. AND
        # `test_nulling_the_stamp_cannot_pass_this` executes the repair a
        # reviewer reaches for first (`SET calibration_probability = NULL`, "let
        # the curve fall back") and requires the published price to stay at 0.99,
        # because the curve price is a COALESCE, not an exclusion (gotcha #144).
        # Green therefore means writing the real closing line was proved
        # NECESSARY, not that nothing objected.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_repair_golf_round_closing_line_1081_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/golf938.txt
          if grep -qiE "[0-9]+ skipped" /tmp/golf938.txt; then
            echo "::error::#938 golf round closing-line gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4444 the census caps do not move the numbers (real Postgres)"
        # The two `precompute_backfill_progress` tiles ran an uncapped
        # per-outcome `COUNT(*)` over `futures_odds_snapshots` and became the two
        # largest disk readers in the database — 1,015 GB of a 7,940 GB window,
        # 8x the accuracy rebuild they share the `heavy` queue with. Capping them
        # is only safe if the numbers are unchanged, and three of the four things
        # that rests on cannot be read off the SQL:
        #
        #   * `WHERE ro.rn <= :percap` filtering a window function's output is
        #     what stops the correlated probe running for unsampled rows. If the
        #     planner evaluated the target list first the fix would save nothing
        #     while every text assertion stayed green.
        #   * `snaps >= DENSE_POINTS` surviving a cap of `DENSE_POINTS + 1`
        #     EXACTLY — an off-by-one is a silently wrong dense rate everywhere.
        #   * the small-group control, which is why this is a PARTITIONed cap and
        #     not chart_density's flat `LIMIT`: a global limit returns `percap`
        #     rows in scan order and drops the newest month entirely.
        #
        # It is also the only thing that executes the module's two raw-SQL
        # constants at all.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_census_cap_real_postgres.py \
            -v -s -rs 2>&1 | tee /tmp/census4444.txt
          if grep -qiE "[0-9]+ skipped" /tmp/census4444.txt; then
            echo "::error::#4444 census-cap gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4482 a task's query budget survives the pool (real Postgres)"
        # Eight task sites armed a 60-90s statement bound and a 15-20s lock bound
        # with a bare `SET`, on a comment's assumption that it "persists across
        # the incremental commits on this one connection". The session returns
        # its connection to the pool at every commit, and `pool_recycle=1800` or
        # a `pool_pre_ping` failure hands back a fresh, unarmed one — the bound
        # silently becoming the 30-minute resting value, and the lock bound
        # becoming unbounded, since `lock_timeout` has no resting value.
        #
        # Real Postgres because all three load-bearing claims are the server's:
        # that asyncpg's startup packet accepts `lock_timeout` at all (a refused
        # GUC fails the CONNECT, so every task loses its database, which no mock
        # can reproduce); that `"7000"` arrives as `7s`; and that the budget
        # rides a connection the pool REPLACED.
        #
        # The rig is differential and both arms have to render: the fix arm
        # asserts `pg_backend_pid()` actually changed, and the control arm
        # reproduces the bare `SET` and asserts it LOSES the bound at the same
        # point. Same arms reading the same thing would be a clean diff over a
        # rig that measured nothing.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_task_session_budget_recycle_pg.py \
            -v -s -rs 2>&1 | tee /tmp/budget4482.txt
          if grep -qiE "[0-9]+ skipped" /tmp/budget4482.txt; then
            echo "::error::#4482 query-budget gate SKIPPED — the gate did not run"
            exit 1
          fi

      - name: "#4586 restore compare-and-swap (real Postgres)"
        # CERT-2439's required repair, `4586-RESTORE-CAS-PRESERVES-LATER-RELINKS`.
        # The forward repair compare-and-swaps on the link it planned; its D51
        # undo did not, and reverted every backed-up row whose live link merely
        # DIFFERED from its backup. That is true for a row the repair moved and
        # for a row the live matcher relinked afterwards — including the rows
        # the forward CAS had correctly SKIPPED — so the one-command undo put
        # markets the repair never touched back onto the voided phantom.
        #
        # Real Postgres because the claim is about a three-row population coming
        # out right, and the parts that decide it are the server's: the
        # manifest's `ON CONFLICT (market_id) DO UPDATE` on a real unique
        # constraint, the plan/CAS pair agreeing about which rows exist, and
        # `flush_receipts` appending a durable `market_link_changes` row (the
        # old restore appended none and claimed a later matcher pass would —
        # false under gotcha #15). The unit file asserts the clause is in the
        # SQL text; that was green while the defect was live.
        #
        # The blocked predicate is executed verbatim against the same seed and
        # required to get the row WRONG, so the required test cannot go green on
        # a restore that does nothing.
        #
        # Same skip-detection as every gate in this job: adding the file is not
        # adding the gate.
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_restore_4586_manifest_cas_pg.py \
            -v -s -rs 2>&1 | tee /tmp/restore4586.txt
          if grep -qiE "[0-9]+ skipped" /tmp/restore4586.txt; then
            echo "::error::#4586 restore-CAS gate SKIPPED — the gate did not run"
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # CERT-433. The CERT-430 comparison specimen renders a payload the BACKEND
      # builds — `backend/scripts/emit_comparison_specimen.py`, spawned by
      # `__tests__/components/tournamentReskin.test.tsx` — because a fixture that
      # hardcodes the repaired payload cannot fail when its producer is deleted.
      #
      # Pinned rather than left to the runner's ambient `python3`: the image
      # happens to ship one today, and a gate that depends on that is a gate
      # nobody chose.
      #
      # NO `cache: pip` AND NO INSTALL STEP, deliberately. The producer imports
      # zero third-party packages, so this job stays a Node job that can also
      # run one pure script — it does not become a job that installs the backend
      # stack to render one card. That property is fragile enough to be worth a
      # test, and it has one:
      # `backend/tests/test_comparison_specimen.py::
      #  test_the_producer_runs_without_our_third_party_requirements`
      # re-checks it under `-S` in the BACKEND suite, so a new import breaks
      # there, where the fix is, rather than here, where it isn't.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # Item 2 — the ONLY uncached artifact in this workflow. pip is cached by
      # setup-python in both python jobs and npm by setup-node above, so `.next`
      # is what was left. Sequenced after the sharding deliberately: while
      # backend-tests was 8m23s, shaving the 2m12s frontend job bought nothing.
      #
      # `path` is workspace-relative — actions/cache does not inherit
      # defaults.run.working-directory, so `frontend/` is not redundant here.
      #
      # Restore-keys give a partial hit: a source-only change still restores the
      # previous build's cache and Next.js reuses what it can. Never key on the
      # lockfile alone, or the cache goes stale the moment sources change while
      # still reporting a hit.
      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
          restore-keys: |
            next-${{ hashFiles('frontend/package-lock.json') }}-
            next-

      - name: Build (ESLint gate — NOT a TypeScript gate, see the step below)
        run: npm run build

      - name: Unit tests (Jest)
        # L2-233. 116 suites / 1,393 tests that, until this step existed, ran
        # only on an engineer's laptop: no workflow invoked jest, and neither
        # `jest` nor `ts-jest` was even declared in package.json — so `npx jest`
        # after `npm ci` would have resolved nothing. Both halves are fixed in
        # the commit that added this line.
        #
        # AFTER the build since UX-P150, and this reordering is load-bearing.
        # It used to run ahead of it — ~20s here versus ~2min there, so a broken
        # test cost one short run instead of a full build first. That trade
        # stopped being available the moment part of the suite started reading
        # the build OUTPUT rather than the sources:
        #
        #   __tests__/components/shippedCopyBans.test.ts   scans .next/static/chunks
        #   __tests__/capture/usOpenDesktopCapture.test.tsx  needs the compiled CSS
        #   __tests__/capture/golfFieldFloorCapture.test.tsx        "
        #
        # Those three pass on a laptop, where `npm run build` has always been run
        # at some point, and failed here on every push once they existed, because
        # `.next` does not exist yet at this point in a clean runner. The copy
        # scan is explicit that a missing bundle is a FAILURE and not a skip —
        # "the build output exists, or CI has skipped its own gate" — because the
        # defect it was written for was copy that had been "fixed" twice, with
        # render guards, and had never actually shipped. Making it tolerate an
        # absent bundle would restore exactly the blindness it exists to remove,
        # so the step moved instead.
        #
        # Both are still required — this job fails on either.
        #
        # No `--passWithNoTests`, no `continue-on-error`. Those, and the rest of
        # what keeps this from silently becoming decoration, are asserted by
        # frontend/__tests__/lib/ciJestGate.test.ts, plus a workflow-shape
        # fixture in the e2e-contract job below that survives this step being
        # deleted.
        run: npm run test:ci

      - name: Type check (fail-on-new)
        # L2-234. `npm run build` above has never enforced TypeScript:
        # next.config.mjs sets `typescript.ignoreBuildErrors: true` (gotcha
        # #10), so a wrong or missing type deploys green. This is the step that
        # notices.
        #
        # It is a fail-on-new gate, not a clean one. Pre-existing errors are
        # recorded per file in frontend/typecheck-baseline.json (see its
        # `total`; do not hardcode the count here, it ratchets down) and owned
        # by issue #1521; they do not fail the build, and one error more than
        # them does. A clean gate today would red every push until all of them
        # were cleared, and a step that reds every push acquires a `|| true`.
        #
        # The ratchet turns both ways: fixing an error without lowering the
        # baseline also fails, with instructions, so the recorded count cannot
        # drift above the real one and become silent headroom.
        #
        # AFTER the build deliberately — `.next/types/**` is generated route
        # typing that tsconfig includes, so running before it would check a
        # smaller program than a developer does locally and the two censuses
        # would disagree.
        #
        # No `continue-on-error`. That, and the rest of what keeps this from
        # becoming decoration, is asserted by
        # frontend/__tests__/lib/ciTypecheckGate.test.ts, plus a workflow-shape
        # fixture in the e2e-contract job that survives this step being deleted.
        run: npm run typecheck

  e2e-contract:
    # L2-229 Item 1 — the browser-audit rail's fixtures, on ordinary push CI.
    #
    # These are the tests that test the tests: they mutate the workflow, the
    # evaluator, the manifest validator and the redactor, and assert each
    # mutation produces exactly its own red. If they stop failing, every green
    # the rail reports afterwards is worthless — so until now the rail's only
    # always-on gate lived in a MANUAL workflow nobody dispatches on a normal
    # push, and a false-green-fixture regression could ship silently.
    #
    # It is cheap enough to be unconditional: no dependency install, no browser
    # download, no network — `node --test` needs nothing but Node, which is why
    # browser-audit.yml also runs it ahead of any install. ~0.2s of test time.
    #
    # Deliberately NOT `npm ci`: adding an install here would couple every push
    # to the e2e lockfile and to registry availability, which is the opposite of
    # what makes this gate safe to run on everything.
    name: Browser-audit contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend/e2e

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          # Must match browser-audit.yml. Node only globs `--test` arguments
          # from v22, so on 20 the shell has to expand `contract/*.test.js` —
          # quoting it made this suite silently never run in CI (L2-228).
          node-version: "20"

      - name: Contract fixtures (no dependencies, no browser, no network)
        run: npm run contract

  release-required:
    # #4456 — does this master push actually need a HEROKU release?
    #
    # Every master merge used to cycle the dynos, and a dyno cycle kills whatever
    # the workers are mid-way through: the matcher, and the calibration rebuild
    # that takes ~2h and has been killed repeatedly at ~110/128 by a release
    # landing under it. A frontend-only merge has nothing for Heroku to serve
    # differently, so it should cost the backend nothing.
    #
    # THIS JOB FAILS TOWARD RELEASING. Every uncertain branch below emits
    # `required=true`. A missed release is a silent production/master skew that
    # nobody notices for hours; a redundant release costs one dyno cycle. Those
    # are not symmetric, so the tie goes to releasing.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.decide.outputs.required }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the previous commit to diff against; a shallow clone cannot.
          fetch-depth: 0

      - name: Decide whether Heroku must release
        id: decide
        run: |
          set -uo pipefail
          # The decision lives in a script so a guard test can execute it.
          # `|| echo true` is the last fail-safe: if the script itself cannot run,
          # we release.
          REQUIRED="$(bash .github/scripts/heroku-release-required.sh \
                        '${{ github.event.before }}' '${{ github.sha }}' || echo true)"
          case "$REQUIRED" in
            true|false) ;;
            *) echo "unparseable decision '$REQUIRED' — defaulting to release"; REQUIRED=true ;;
          esac
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "release required: $REQUIRED"

  deploy:
    # search-recall added for #1494: the recall gate is deploy-blocking, so the
    # reverted search speed-up cannot re-land without it going green.
    # `backend-tests` stays a BARE job name even though it is now a 4-leg matrix:
    # a matrix dependency is satisfied only when EVERY leg succeeds, so one red
    # shard still blocks the release. Enumerating shard names here would have to
    # be edited every time the matrix changes, and forgetting would silently drop
    # a shard from the deploy gate.
    # shard-completeness is required too — without it a partition that skips
    # files could deploy on a green built from a smaller suite.
    # release-required (#4456) is a GATE, not a test: it decides whether this
    # push needs a Heroku dyno cycle at all. It shares `deploy`'s exact `if`, so
    # the two are never inconsistently skipped, and it fails toward `true`.
    needs: [backend-tests, shard-completeness, search-recall, frontend-build, e2e-contract, release-required]
    # KEEP THIS CONDITION ON ONE LINE. ciTriggerCoverage's "an any-base PR cannot
    # release" assertion matches `if:.*github.event_name == 'push'` with a
    # single-line regex; folding this into a `>-` block scalar hides the
    # event_name/ref guards from it and the suite goes red. That test is the only
    # thing standing between a pull_request run and a Heroku release, so it must
    # stay able to SEE the guard, not merely have the guard be present.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.release-required.outputs.required != 'false'
    runs-on: ubuntu-latest
    # THRU-F: the group SERIALIZES releases; it must not KILL one mid-release.
    #
    # Two different things can be cancelled here, and only one of them is safe:
    #
    #   1. A PENDING deploy — a run that has the group's queue slot but has not
    #      started. Cancelling it is free and is what keeps a merge burst from
    #      turning into one Heroku build per merge.
    #   2. An IN-PROGRESS deploy — a run inside `git push heroku`. That push is
    #      not a handshake: Heroku streams the whole build and release back over
    #      it, so the job sits "in progress" for MINUTES while production is
    #      actually being changed.
    #
    # `cancel-in-progress: true` cancelled BOTH. Killing (2) does not stop the
    # Heroku side — once the ref moves, the build and release run to completion
    # server-side — it only removes our half of the conversation. The release
    # still lands, the run reads `cancelled`, and every line of reconciliation
    # below (the rejection branch, the ancestry re-read, the fail-closed refusal)
    # is skipped, because there is no longer a job to run it. A deploy we cannot
    # observe or adjudicate is worse than a deploy that waits.
    #
    # Setting it to `false` keeps (1) and drops (2): cancellation of a PENDING
    # job is not governed by this flag at all. A concurrency group holds exactly
    # one pending job, and a newly queued one always cancels the previously
    # pending one — that coalescing is what we wanted from the flag, and we keep
    # it for free. So a burst of ten merges still costs at most two Heroku
    # builds (the one already running, then the newest queued sha), not ten.
    #
    # Release SELECTION is then made once, explicitly, by the never-backwards
    # guard in the step below — which reads what is actually LIVE and skips when
    # something newer is already deployed. That is one selection rule, applied
    # when the slot is held, instead of two racing ones. `cancel-in-progress`
    # was the second, blind selector: it chose by arrival time, could not see
    # Heroku at all, and its only lever was to kill.
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy to Heroku (never-backwards guarded)
        run: |
          # Never-backwards guard (L2-57, reference point repaired for #3171).
          #
          # The hazard is real: the concurrency group above only ever cancels a
          # deploy that is still QUEUED, so an OLDER commit's re-run whose deploy
          # starts AFTER a newer commit already released is never cancelled and
          # would rewind production (bitten twice: v3320=older landed after
          # v3319=newer). Serialization orders the releases; it does not decide
          # which ones SHOULD release. That decision is this guard's, and this
          # guard's alone — see the THRU-F note on the concurrency block.
          #
          # The original guard answered it by asking "am I the origin/master
          # tip?" — the wrong reference, because the tip is not what is live.
          # When merges land faster than CI completes, no run is still the tip by
          # the time its deploy job starts, so EVERY deploy skipped: production
          # sat 80 minutes and ten merge commits behind master with certified
          # ships undeployed, every run green, nothing released (#3171).
          #
          # Ask what the hazard actually poses instead: is something NEWER
          # already live? Skip only when Heroku's master IS this commit (nothing
          # to do) or a strict DESCENDANT of it (genuinely newer). Otherwise
          # deploy — pushing a descendant of what is live is forward progress and
          # cannot clobber anything.
          #
          # Gotcha #9: the check lives inside the run block, not a step-level
          # `if` with secrets.
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY not set — skipping deploy"
            exit 0
          fi
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/bainluck.git 2>/dev/null || true

          # `|| true` keeps an unreadable live ref from reddening the job (and
          # holds under `-o pipefail` too); it falls through to the push, where
          # git adjudicates it for us.
          LIVE="$(git ls-remote heroku refs/heads/master 2>/dev/null | cut -f1 || true)"
          git fetch --quiet heroku refs/heads/master 2>/dev/null || true
          if [ -z "$LIVE" ]; then
            echo "Could not read Heroku's live commit — deferring to the push below."
          elif [ "$LIVE" = "$GITHUB_SHA" ]; then
            echo "Skipping deploy: $GITHUB_SHA is already the live commit."
            exit 0
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE"; then
            echo "Skipping deploy: this run's commit ($GITHUB_SHA) is an ancestor of"
            echo "the live commit ($LIVE) — something newer is already deployed."
            echo "An older re-run can no longer clobber a newer deploy."
            exit 0
          else
            echo "Deploying $GITHUB_SHA over live commit ${LIVE:-<unknown>}."
          fi

          # The check above is a read followed by a write, so it cannot close the
          # race by itself. Push WITHOUT --force and let git refuse a
          # non-fast-forward: if a newer deploy won the race in between, the
          # server rejects us instead of quietly rewinding production. Push the
          # SHA explicitly rather than the local `master` branch, so what gets
          # released is the commit this run actually gated.
          if git push heroku "$GITHUB_SHA:refs/heads/master"; then
            echo "Deployed $GITHUB_SHA."
            exit 0
          fi

          # Rejected. Do NOT force by reflex. A rejection can perfectly well mean
          # a NEWER deploy won the race, and forcing then rewinds production —
          # the exact incident this guard exists to prevent. So establish what is
          # live and whether we can REASON about it before doing anything, and
          # treat "cannot prove" as a refusal rather than as permission.
          LIVE_NOW="$(git ls-remote heroku refs/heads/master 2>/dev/null | cut -f1 || true)"
          git fetch --quiet heroku refs/heads/master 2>/dev/null || true
          # Ancestry is only meaningful for a commit whose object we actually
          # hold. `merge-base --is-ancestor` on a commit we never fetched exits
          # non-zero, which reads identically to a truthful "no" — so ask
          # directly instead of inferring it from a failure.
          HAVE_LIVE=0
          if [ -n "$LIVE_NOW" ] && git cat-file -e "${LIVE_NOW}^{commit}" 2>/dev/null; then
            HAVE_LIVE=1
          fi

          if [ "$HAVE_LIVE" = 1 ] && git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE_NOW"; then
            echo "Superseded mid-push: $LIVE_NOW is newer than $GITHUB_SHA. Leaving it."
            exit 0
          fi

          if [ "$HAVE_LIVE" = 1 ] && git merge-base --is-ancestor "$LIVE_NOW" "$GITHUB_SHA"; then
            # The live commit is provably BEHIND us, so a fast-forward does exist
            # and the rejection was transient. Retry as a fast-forward — never as
            # a force. A second rejection reddens the job under `-e`, which is
            # the honest outcome: somebody should look.
            echo "Live commit $LIVE_NOW is behind $GITHUB_SHA and a fast-forward exists; retrying."
            git push heroku "$GITHUB_SHA:refs/heads/master"
            echo "Deployed $GITHUB_SHA."
            exit 0
          fi

          # What is left is either genuinely diverged history, or a live commit
          # whose ancestry we cannot establish. A force push in EITHER state can
          # rewind a newer production, so both fail closed.
          #
          # One exception, and only one: when this commit IS GitHub's current
          # master tip there is no newer commit for a force to lose, so a history
          # rewrite can still self-heal without a human. Note the direction of
          # the test — the tip is used here to NARROW when forcing is allowed,
          # never to decide whether to deploy. That inversion is #3171.
          ORIGIN_TIP="$(git ls-remote origin refs/heads/master 2>/dev/null | cut -f1 || true)"
          if [ -n "$ORIGIN_TIP" ] && [ "$ORIGIN_TIP" = "$GITHUB_SHA" ]; then
            echo "Push rejected and the live commit (${LIVE_NOW:-<unreadable>}) has no provable"
            echo "ancestry with $GITHUB_SHA — but this commit IS origin/master's tip, so there is"
            echo "no newer commit to rewind past. History diverged; forcing."
            git push heroku "$GITHUB_SHA:refs/heads/master" --force
            exit 0
          fi

          echo "REFUSING to deploy. The push was rejected, the live commit"
          echo "(${LIVE_NOW:-<unreadable>}) has no provable ancestry with $GITHUB_SHA, and this"
          echo "commit is not origin/master's tip (${ORIGIN_TIP:-<unreadable>}). Forcing from here"
          echo "could rewind a newer production, so this fails closed. Deploy by hand once the"
          echo "divergence is understood."
          exit 1
