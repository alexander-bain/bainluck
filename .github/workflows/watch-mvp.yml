permissions:
  contents: read

jobs:
  watch-mvp:
    name: Watch behavior and unsigned builds
    concurrency:
      group: watch-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # macos-15 defaults to Xcode 16.4; these models need Swift 6.2 or newer.
      # Xcode 26.3 is listed in actions/runner-images' macos-15 manifest.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      WATCH_BUILD_CONFIGURATION: Release
      WATCH_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source and toolchain
        run: |
          git rev-parse HEAD
          xcodebuild -version
          xcrun swiftc --version
      - name: Exercise selected-game behavior without network or simulator
        run: bash tools/tests/watch-selected-game/run.sh
      - name: Verify idempotent GA4 schema planning without credentials
        run: python3 -m unittest discover -s tools/tests -p test_watch_ga4_schema.py
      - name: Require complete rendered diagnostics consent evidence
        run: python3 -m unittest discover -s tools/tests -p test_watch_diagnostics_receipt.py
      - name: Exercise consent-gated Watch telemetry without network or simulator
        run: sh tools/tests/watch-telemetry/run.sh
      - name: Build unsigned Watch simulator and device executables
        run: bash tools/watch-build.sh
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-mvp-build-logs
          path: build/watch-mvp/*.log
          if-no-files-found: ignore
          retention-days: 7

  iphone-compatibility:
    name: Watch change iPhone compatibility
    concurrency:
      # Preserve full-suite evidence without blocking independent Watch UI work.
      group: watch-iphone-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    needs: watch-mvp
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Same compiler build as Native's current local Xcode (27A266a).
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify updating journeys require actual executed cases
        run: python3 -m unittest discover -s tools/tests -p test_watch_game_updating_gate.py
      - name: Verify receipt rejects incomplete and misleading results
        run: python3 -m unittest discover -s tools/tests -p test_watch_iphone_receipt.py
      - name: Run full BainLuckTests on a disposable hosted iPhone
        run: bash tools/watch-iphone-compatibility.sh
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-iphone-compatibility-evidence
          path: |
            build/watch-iphone-compatibility/*.txt
            build/watch-iphone-compatibility/*.json
            build/watch-iphone-compatibility/*.log
            build/watch-iphone-compatibility/BainLuckTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  watch-ui-products:
    name: Build exact simulator products once for five fresh pairs
    needs: watch-mvp
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable product and stage contracts
        run: |
          python3 -m unittest discover -s tools/tests -p test_watch_ui_products.py
          python3 -m unittest discover -s tools/tests -p test_watch_ui_stage.py
      - name: Build and package exact signed simulator products
        run: python3 tools/watch_ui_stage.py products --output-dir build/watch-ui-products -- bash tools/watch-ui-products.sh
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: watch-ui-products
          path: |
            build/watch-ui-products/products.tar.gz
            build/watch-ui-products/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: watch-ui-products-evidence
          path: |
            build/watch-ui-products/*.txt
            build/watch-ui-products/*.json
            build/watch-ui-products/*.jsonl
            build/watch-ui-products/*.log
            build/watch-ui-products/stage-*/**
            build/watch-ui-products/package-resolution/**
          retention-days: 7

  watch-ui-journey:
    name: Watch picker interaction journey (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [corner, readings, navigation, controls, widgets]
    concurrency:
      group: watch-ui-${{ matrix.shard }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    needs: watch-ui-products
    runs-on: xcode-27
    # Retain all36 cases across five isolated pairs using one immutable product package.
    # The aggregate requires exact coverage; all command/job/test limits stay fixed.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      WATCH_UI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: watch-ui-products
          path: build/watch-ui-products
      - name: Verify exact shard coverage
        run: python3 -m unittest discover -s tools/tests -p test_watch_ui_shards.py
      - name: Verify bounded package-download recovery
        run: python3 -m unittest discover -s tools/tests -p test_watch_resolve_packages.py
      - name: Reject incomplete picker network recovery evidence
        run: python3 -m unittest discover -s tools/tests -p test_watch_picker_network_gate.py
      - name: Reject incomplete selected-picker evidence
        run: python3 -m unittest discover -s tools/tests -p test_watch_picker_selected_gate.py
      - name: Verify Discoveries polish receipts fail closed
        run: python3 -m unittest discover -s tools/tests -p test_watch_discovery_polish_receipt.py
      - name: Verify simulator architecture selection fails closed
        run: python3 -m unittest discover -s tools/tests -p test_watch_simulator_architecture.py
      - name: Reject incomplete corner host or fallback evidence
        run: python3 -m unittest discover -s tools/tests -p test_watch_corner_gate.py
      - name: Reject incomplete rectangular readability evidence
        run: python3 -m unittest discover -s tools/tests -p test_watch_rectangular_readability_gate.py
      - name: Verify failed gates retain evidence before job cancellation
        run: python3 -m unittest discover -s tools/tests -p test_watch_ui_deadline.py
      - name: Verify products and prepare one fresh pair within the global budget
        run: python3 tools/watch_ui_stage.py prepare --output-dir build/watch-ui-journey -- bash tools/watch-ui-journey.sh prepare
      - name: Preserve preparation evidence before starting XCTest
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: watch-ui-preparation-${{ matrix.shard }}
          path: |
            build/watch-ui-journey/*.txt
            build/watch-ui-journey/*.json
            build/watch-ui-journey/*.jsonl
            build/watch-ui-journey/*.log
            build/watch-ui-journey/stage-*/**
          retention-days: 7
      - name: Execute unchanged cases within the remaining global budget
        run: python3 tools/watch_ui_stage.py execute --output-dir build/watch-ui-journey -- bash tools/watch-ui-journey.sh execute
      - name: Preserve UI journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: watch-ui-journey-${{ matrix.shard }}
          path: |
            build/watch-ui-journey/*.txt
            build/watch-ui-journey/*.json
            build/watch-ui-journey/*.jsonl
            build/watch-ui-journey/stage-*/**
            build/watch-ui-journey/*.log
            build/watch-ui-journey/package-resolution/**
            build/watch-ui-journey/run.*/BainLuckWatchUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  watch-ui-complete:
    name: Watch full UI coverage from isolated pairs
    needs: watch-ui-journey
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: watch-ui-journey-corner
          path: build/watch-ui-aggregate/corner
      - uses: actions/download-artifact@v4
        with:
          name: watch-ui-journey-readings
          path: build/watch-ui-aggregate/readings
      - uses: actions/download-artifact@v4
        with:
          name: watch-ui-journey-navigation
          path: build/watch-ui-aggregate/navigation
      - uses: actions/download-artifact@v4
        with:
          name: watch-ui-journey-controls
          path: build/watch-ui-aggregate/controls
      - uses: actions/download-artifact@v4
        with:
          name: watch-ui-journey-widgets
          path: build/watch-ui-aggregate/widgets
      - name: Require exact full coverage, source, signatures and all journey markers
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/watch_ui_shards.py aggregate --directory build/watch-ui-aggregate --sha "$EXPECTED_SHA"
      - name: Preserve complete coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-ui-complete-receipt
          path: |
            build/watch-ui-aggregate/aggregate-receipt.json
            build/watch-ui-aggregate/combined-tests.log
          if-no-files-found: ignore
          retention-days: 7

  companion-archive:
    name: Watch inside unsigned iPhone archive
    needs: watch-mvp
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: watch-companion-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject missing or misleading archive payloads
        run: python3 tools/tests/test_watch_companion_archive.py -v
      - name: Archive unsigned companion and inspect actual payload
        run: bash tools/watch-companion-archive.sh
      - name: Preserve diagnostics and receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-companion-archive-evidence
          path: |
            build/watch-companion-archive/*.log
            build/watch-companion-archive/*.json
            build/watch-companion-archive/*.txt
          if-no-files-found: ignore
          retention-days: 7
