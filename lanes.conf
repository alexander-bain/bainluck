#!/bin/bash
# lanes.conf — THE list of lanes. Sourced by start-lanes.sh AND lanes-supervisor.sh.
#
# WHY THIS FILE EXISTS (Alex, 2026-09-03 1:00pm): the two launchers each carried
# their own copy of the lane list and they drifted. start-lanes.sh opened six
# windows; lanes-supervisor.sh knew seven lanes; nine lanes actually existed
# (`lane1b`, `authority`, `native` were in neither or only one). A machine that
# rebooted came back missing lanes, and nobody could tell by reading either file
# alone. One list, sourced twice, cannot drift.
#
# ADDING A LANE: add its name to LANES_ALL, create its worktree, create
# .claude/handoff/runner-inbox/<lane>/. Nothing else. If the worktree does not
# exist the launchers skip the lane loudly rather than opening a broken window.
#
# bash-3.2 safe on purpose: macOS /bin/bash has no associative arrays.

# Order is the order windows open. `integrator` first only so it is the leftmost
# window Alex looks at; it no longer shares a runner with lane1 (see below), so
# order carries no scheduling meaning any more.
LANES_ALL="integrator lane1 lane1b ux latency calibration live authority native"

# lane -> worktree. The integrator alone works in the master tree; every other
# lane has its own worktree under ~/bainluck-dev/<lane> (D39 for lane1b,
# D50 for authority).
lane_dir () {
  case "$1" in
    integrator) echo "$HOME/bainluck" ;;
    *)          echo "$HOME/bainluck-dev/$1" ;;
  esac
}

# The runner every lane window runs. Named here, not in the two launchers, for
# the same reason the lane list is: one definition, sourced twice.
LANE_RUNNER="$HOME/bainluck/lane-runner.sh"

# The cert bus runs TWO grader windows (D44: "if two graders bank the same id,
# the second appends under a NEW id" — the bus is written for two). Both run the
# same tracked `lane4-runner.sh`; the numbered -vN variants beside it are scratch
# and are never the one to run.
LANE4_GRADERS=2
LANE4_RUNNER="$HOME/bainluck/lane4-runner.sh"

# The MEASUREMENT bus (integrator/135, 2026-09-04). Sibling of the cert graders:
# same codex CLI, same self-gated shape, but it drives the recurring M-R set in
# CODEX-QUEUE.md instead of CERT-QUEUE.md. Until now this bus ran only when Alex
# pasted a prompt by hand, so it went dark whenever he did. ONE window only — two
# would race on the same bucket's artifacts, which (unlike the two cert graders,
# where D44 tells the second what to do) has no tie-break rule.
BUS_RUNNER="$HOME/bainluck/bus-runner.sh"
